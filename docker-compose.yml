# StuHelper Docker Compose
#
# 架构：开发环境直接使用 Vite/后端本机端口；生产公网入口由宝塔 Nginx 管理。
#
# 路由优先级总览:
#   /api/*          (700)  → backend（Go 服务，保留 /api 前缀）
#   /admin/*        (600)  → admin 前端（Vben Admin）
#   /               (500)  → web 前端（Vue SPA，catch-all）
#
# 公开 OAuth/OIDC issuer 固定为 https://sso.stuhelper.com；账号中心页面由主站承载。
# 本 compose 中的 casdoor service 仅用于本地开发或显式本地 SSO 验证。
#
# 使用方式:
#   开发（仅基础设施）:  docker compose -f docker-compose.yml up -d --wait
#   可观测性 overlay:    docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability up -d --wait
#   生产部署:            docker compose -f docker-compose.yml -f docker-compose.observability.yml -f docker-compose.prod.yml --profile prod up -d --wait
#   生产公网入口:        宝塔 Nginx → 127.0.0.1:18080 / 18000 / 18001

name: ${STACK_NAME:-stuhelper}

x-node-dev-build: &node-dev-build
  context: ./infra/images/node-dev
  dockerfile: Dockerfile
  args:
    NODE_BASE_IMAGE_REF: ${NODE_DEV_BASE_IMAGE_REF:-node:24.18.0-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd}
    NPM_VERSION: "11.18.0"
    NPM_TARBALL_SHA512: T67M4L5wNm0cZ7EBLErcEkY1SmzEW/WJ+SADBzsFUY1UdAPfFHXFQtZ6SEXiK0+vzXysCvAsepbMaBTwnrAD+w==
    BRACE_EXPANSION_VERSION: "5.0.9"
    BRACE_EXPANSION_TARBALL_SHA512: ScQ4IuvIEF1TMlP7Zt+vjJ//9zlPb2SDcxWxM3bk8s6t6GGdJ7KO1dCcTidOPJKePW30LE/2cT7wCyPho9/Wxg==
    IP_ADDRESS_VERSION: "10.3.1"
    IP_ADDRESS_TARBALL_SHA512: 1e9d3kb97NHJTIJDZW9rKqW2h6+dFa50Dy0fpPSMQp2ADje5gvKsXmdiK6dwY5t76TaTt5+P5N1Y/LoToIxP6g==

services:
  postgres:
    image: ${POSTGRES_IMAGE_REF:-cgr.dev/chainguard/postgres:latest@sha256:dc2f04037c1044a22af76cee4de70b9111885b17c561b939d7ed70103d100759}
    container_name: ${STACK_NAME:-stuhelper}-postgres
    entrypoint: ["/usr/local/bin/stuhelper-postgres-entrypoint"]
    command:
    - postgres
    - -c
    - ssl=${POSTGRES_ENABLE_SSL:-off}
    - -c
    - ssl_cert_file=/tls/server.crt
    - -c
    - ssl_key_file=/tls/server.key
    - -c
    - hba_file=/etc/postgresql/pg_hba.conf
    - -c
    - wal_level=replica
    - -c
    - archive_mode=${POSTGRES_ARCHIVE_MODE:-off}
    - -c
    - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-15min}
    - -c
    - archive_command=sh -c 'dest=/var/lib/postgresql/wal-archive/%f; tmp="$$dest.tmp.$$$$"; if [ -f "$$dest" ]; then cmp -s %p "$$dest"; else cp %p "$$tmp" && mv "$$tmp" "$$dest"; fi'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stuhelper}
      # External-datastore deployments keep this service profile-disabled and
      # must not need an otherwise unused database-superuser credential.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-stuhelper}
      PGDATA: ${POSTGRES_PGDATA:-/var/lib/postgresql/data}
      POSTGRES_ENABLE_SSL: ${POSTGRES_ENABLE_SSL:-off}
      STUHELPER_APP_DB_PASSWORD: ${STUHELPER_APP_DB_PASSWORD:?STUHELPER_APP_DB_PASSWORD is required}
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD:-}
      OPENFGA_DB_PASSWORD: ${OPENFGA_DB_PASSWORD:?OPENFGA_DB_PASSWORD is required}
      STUHELPER_BACKUP_DB_PASSWORD: ${STUHELPER_BACKUP_DB_PASSWORD:?STUHELPER_BACKUP_DB_PASSWORD is required}
      STUHELPER_REPLICATION_DB_PASSWORD: ${STUHELPER_REPLICATION_DB_PASSWORD:?STUHELPER_REPLICATION_DB_PASSWORD is required}
      POSTGRES_EXPORTER_DB_PASSWORD: ${POSTGRES_EXPORTER_DB_PASSWORD:?POSTGRES_EXPORTER_DB_PASSWORD is required}
    ports:
    - "127.0.0.1:${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
    - postgres_data:/var/lib/postgresql
    - ./infra/postgres/init-extra-dbs.sh:/var/lib/postgres/initdb/00-init-extra-dbs.sh:ro
    - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    - ./infra/generated/postgres:/tls-source:ro
    - ./infra/generated/postgres-client-ca:/client-tls-source:ro
    - ./infra/postgres/docker-entrypoint-with-tls.sh:/usr/local/bin/stuhelper-postgres-entrypoint:ro
    - postgres_wal_archive:/var/lib/postgresql/wal-archive
    tmpfs:
    - /tls:mode=0700,uid=70,gid=70
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-stuhelper}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

    networks:
    - backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.50'
          memory: 512M
    security_opt:
    - no-new-privileges:true
  postgres-client:
    profiles: [ops]
    image: ${POSTGRES_IMAGE_REF:-cgr.dev/chainguard/postgres:latest@sha256:dc2f04037c1044a22af76cee4de70b9111885b17c561b939d7ed70103d100759}
    entrypoint: []
    command: ["pg_isready", "--version"]
    working_dir: /tmp
    environment:
      PGSSLROOTCERT: /tls/ca.crt
    volumes:
    - ./infra/generated/postgres-client-ca:/tls:ro
    networks:
    - backend
    restart: no
    read_only: true
    user: "70:70"
    tmpfs:
    - /tmp:mode=0700,uid=70,gid=70
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  redis:
    image: ${REDIS_IMAGE_REF:-redis:8.8.1-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb}
    container_name: ${STACK_NAME:-stuhelper}-redis
    entrypoint: ["/usr/local/bin/stuhelper-redis-entrypoint"]
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --port 0
      --tls-port 6379
      --tls-cert-file /redis-runtime/server.crt
      --tls-key-file /redis-runtime/server.key
      --tls-ca-cert-file /redis-runtime/ca.crt
      --tls-auth-clients no
      --aclfile /redis-runtime/users.acl
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:-stuhelper_app}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-true}
      REDIS_TLS_CA: /redis-tls/ca.crt
    ports:
    - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
    - redis_data:/data
    - ./infra/generated/redis:/redis-source:ro
    - ./infra/redis/docker-entrypoint-with-secrets.sh:/usr/local/bin/stuhelper-redis-entrypoint:ro
    tmpfs:
    - /redis-runtime:mode=0700,uid=999,gid=1000
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /redis-runtime/ca.crt --user \"$${REDIS_USERNAME:-stuhelper_app}\" -a \"$${REDIS_PASSWORD:?REDIS_PASSWORD is required}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

    networks:
    - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
    - no-new-privileges:true
  mailpit:
    profiles: [dev-full]
    image: ${MAILPIT_IMAGE_REF:-axllent/mailpit:v1.30.6@sha256:7f33095f80e901f6ad08028f06ca284aa58fe84942be5496008d041d3b9f4d4d}
    container_name: ${STACK_NAME:-stuhelper}-mailpit
    ports:
    - "127.0.0.1:${MAILPIT_SMTP_EXTERNAL_PORT:-1025}:1025"
    - "127.0.0.1:${MAILPIT_WEB_EXTERNAL_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

    networks:
    - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    security_opt:
    - no-new-privileges:true
  object-storage:
    profiles: [dev-full, prod-parity]
    image: ${DEV_OBJECT_STORAGE_IMAGE_REF:-chrislusf/seaweedfs:4.40@sha256:52194fba4fecd0083c842158b3a902ba6e04a63619b2b0efcd08007bdb6a4602}
    container_name: ${STACK_NAME:-stuhelper}-object-storage
    command:
    - mini
    - -dir=/data
    - -s3.config=/etc/seaweedfs-local/s3.json
    - -s3.cert.file=/etc/seaweedfs-local/public.crt
    - -s3.key.file=/etc/seaweedfs-local/private.key
    - -s3.port.https=8334
    - -bucket=${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required},${BACKUP_OBJECT_STORAGE_BUCKET:-stuhelper-postgres-backup}
    - -master.telemetry=false
    - -admin.ui=false
    - -webdav=false
    ports:
    - "127.0.0.1:${DEV_OBJECT_STORAGE_EXTERNAL_PORT:-9000}:8333"
    - "127.0.0.1:${LOCAL_OBJECT_STORAGE_TLS_EXTERNAL_PORT:-9001}:8334"
    volumes:
    - object_storage_data:/data
    - ./infra/generated/object-storage:/etc/seaweedfs-local:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9333/cluster/status"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped

    networks:
    - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    read_only: true
    user: "1000:1000"
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  migrate-dev:
    profiles: [dev-full]
    image: ${GOLANG_IMAGE_REF:-cgr.dev/chainguard/go:latest@sha256:b116b5f2d3f5e7556b66252f9ee7ef9988b84c2139c89d824efcebd6cadbf436}
    container_name: ${STACK_NAME:-stuhelper}-migrate-dev
    working_dir: /workspace/server
    entrypoint: ["/usr/bin/go"]
    command: ["run", "./cmd/migrate-runtime"]
    env_file:
    - ${ENV_FILE_PATH:-.env}
    - ${GENERATED_ENV_FILE_PATH:-.env.generated}
    environment:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      GOCACHE: /go-cache/build
      GOMODCACHE: /go-cache/mod
      GOTMPDIR: /go-cache
      DATABASE_URL: postgresql://${POSTGRES_USER:-stuhelper}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-stuhelper}?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable}
    volumes:
    - ./server:/workspace/server:ro
    - ./infra/generated/postgres-client-ca:/tls:ro
    - migrate_dev_go_cache:/go-cache
    depends_on:
      postgres:
        condition: service_healthy

    networks:
    - backend
    restart: no
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    read_only: true
    tmpfs:
    - /tmp:rw,nosuid,nodev,noexec,size=64m
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  migrate:
    profiles: [prod]
    image: ${BACKEND_IMAGE_REF:?BACKEND_IMAGE_REF is required}
    entrypoint: ["/app/migrate-runtime"]
    container_name: ${STACK_NAME:-stuhelper}-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stuhelper}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-stuhelper}?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-verify-full}&sslrootcert=/tls/ca.crt
    volumes:
    - ./infra/generated/postgres-client-ca:/tls:ro
    depends_on:
      postgres:
        condition: service_healthy

    networks:
    - backend
    restart: no
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    security_opt:
    - no-new-privileges:true
  seed-dev:
    profiles: [dev-full]
    image: ${POSTGRES_IMAGE_REF:-cgr.dev/chainguard/postgres:latest@sha256:dc2f04037c1044a22af76cee4de70b9111885b17c561b939d7ed70103d100759}
    container_name: ${STACK_NAME:-stuhelper}-seed-dev
    entrypoint: ["/bin/sh", "-c"]
    command:
    - psql "postgresql://${POSTGRES_USER:-stuhelper}:${POSTGRES_PASSWORD:-}@postgres:5432/${POSTGRES_DB:-stuhelper}?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable}" -v ON_ERROR_STOP=1 -f /seed/seed.sql
    volumes:
    - ./server/scripts/seed.sql:/seed/seed.sql:ro
    depends_on:
      migrate-dev:
        condition: service_completed_successfully

    networks:
    - backend
    restart: no
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    security_opt:
    - no-new-privileges:true
  resource-seed-dev:
    profiles: [dev-full]
    image: ${RCLONE_IMAGE_REF:-rclone/rclone:beta@sha256:f52965eba611ba8984117638b2a0539dcce170731937f93fbace66897d102698}
    container_name: ${STACK_NAME:-stuhelper}-resource-seed-dev
    command:
    - copyto
    - /seed/resources/course-8-final-review-guide.md
    - target:${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}/resources/dev-seed/course-8-final-review-guide.md
    - --config=/dev/null
    - --metadata-set=content-type=text/markdown; charset=utf-8
    - --cache-dir=/tmp/rclone
    environment:
      RCLONE_CONFIG_TARGET_TYPE: s3
      RCLONE_CONFIG_TARGET_PROVIDER: SeaweedFS
      RCLONE_CONFIG_TARGET_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      RCLONE_CONFIG_TARGET_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
      RCLONE_CONFIG_TARGET_ENDPOINT: http://object-storage:8333
      RCLONE_CONFIG_TARGET_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      RCLONE_CONFIG_TARGET_FORCE_PATH_STYLE: "true"
      RCLONE_CONFIG_TARGET_NO_CHECK_BUCKET: "true"
    volumes:
    - ./server/scripts/dev-seed/resources:/seed/resources:ro
    depends_on:
      object-storage:
        condition: service_healthy

    networks:
    - backend
    restart: no
    read_only: true
    tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
    cap_drop:
    - ALL
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    security_opt:
    - no-new-privileges:true
  casdoor:
    profiles: [dev-full]
    image: ${CASDOOR_IMAGE_REF:-casbin/casdoor:latest@sha256:53f00e1e69190c8629925a179cd59a10573f7be2764038571906196908cd6579}
    container_name: ${STACK_NAME:-stuhelper}-casdoor
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    environment:
      GIN_MODE: release
      appname: casdoor
      httpport: "8000"
      runmode: prod
      driverName: postgres
      dataSourceName: "user=casdoor password=${CASDOOR_DB_PASSWORD:-} host=postgres port=5432 sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable} dbname=casdoor sslrootcert=/tls/ca.crt"
      dbName: casdoor
      origin: ${CASDOOR_ISSUER:-http://localhost:8085}
    ports:
    - "127.0.0.1:${CASDOOR_EXTERNALPORT:-8085}:8000"
    volumes:
    - ./infra/generated/postgres-client-ca:/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/get-default-application >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
    - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.50'
          memory: 512M
  openfga-migrate:
    image: ${OPENFGA_IMAGE_REF:-openfga/openfga:v1.18.1@sha256:efde89d24487da1a8bc37d85b61341f1fb7024943a1ded65f4b7d51a75666688}
    container_name: ${STACK_NAME:-stuhelper}-openfga-migrate
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgresql://openfga:${OPENFGA_DB_PASSWORD}@postgres:5432/openfga?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable}
    volumes:
    - ./infra/generated/postgres-client-ca:/tls:ro
    depends_on:
      postgres:
        condition: service_healthy

    networks:
    - backend
    restart: no
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    security_opt:
    - no-new-privileges:true
  openfga:
    image: ${OPENFGA_IMAGE_REF:-openfga/openfga:v1.18.1@sha256:efde89d24487da1a8bc37d85b61341f1fb7024943a1ded65f4b7d51a75666688}
    container_name: ${STACK_NAME:-stuhelper}-openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgresql://openfga:${OPENFGA_DB_PASSWORD}@postgres:5432/openfga?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable}
      OPENFGA_PLAYGROUND_ENABLED: "${OPENFGA_PLAYGROUND_ENABLED:-false}"
    ports:
    - "127.0.0.1:${OPENFGA_HTTP_EXTERNAL_PORT:-8081}:8080"
    - "127.0.0.1:${OPENFGA_GRPC_EXTERNAL_PORT:-8082}:8081"
    - "127.0.0.1:${OPENFGA_PLAYGROUND_EXTERNAL_PORT:-3002}:3000"
    volumes:
    - ./infra/generated/postgres-client-ca:/tls:ro
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

    networks:
    - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
  app-dev:
    profiles: [dev-full]
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: ${STACK_NAME:-stuhelper}-app-dev
    env_file:
    - ${ENV_FILE_PATH:-.env}
    - ${GENERATED_ENV_FILE_PATH:-.env.generated}
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://stuhelper_app:${STUHELPER_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-stuhelper}?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ${REDIS_USERNAME:-stuhelper_app}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-true}
      REDIS_TLS_CA: /redis-tls/ca.crt
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: "1025"
      EMAIL_SMTP_STARTTLS: "false"
      # Online API processes are explicitly fenced from legacy Oracle source
      # credentials even when a shared developer env file still contains them.
      EXTERNAL_STUDENT_SOURCE_ENABLED: "false"
      EXTERNAL_STUDENT_SOURCE_ORACLE_HOST: ""
      EXTERNAL_STUDENT_SOURCE_ORACLE_USERNAME: ""
      EXTERNAL_STUDENT_SOURCE_ORACLE_PASSWORD: ""
    extra_hosts:
    - "host.docker.internal:host-gateway"
    volumes:
    - ./server:/app
    - ./infra/generated/postgres-client-ca:/tls:ro
    - ./infra/generated/redis-client-ca:/redis-tls:ro
    - ./infra/generated/external-student-source-client-ca:/external-student-source-tls:ro
    ports:
    - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate-dev:
        condition: service_completed_successfully
      seed-dev:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
    - backend
    - observability
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.50'
          memory: 512M
    security_opt:
    - no-new-privileges:true
  frontend-dev:
    profiles: [dev-full]
    build: *node-dev-build
    container_name: ${STACK_NAME:-stuhelper}-frontend-dev
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @stuhelper/web dev --host 0.0.0.0 --port 3000"
    volumes:
    - ./clients:/app
    - frontend_dev_node_modules:/app/node_modules
    ports:
    - "127.0.0.1:3000:3000"
    environment:
    - NODE_ENV=development
    - VITE_API_URL=${WEB_VITE_API_URL:-/api}
    - VITE_SSO_URL=${WEB_VITE_SSO_URL:-http://localhost:8085}
    - VITE_WEB_URL=${WEB_VITE_WEB_URL:-http://localhost:3000}
    - VITE_ADMIN_URL=${ADMIN_PUBLIC_URL:-http://localhost:3001}
    - VITE_API_TIMEOUT_MS=${WEB_VITE_API_TIMEOUT_MS:-15000}
    - VITE_QQ_BOT_ENTRY=${WEB_VITE_QQ_BOT_ENTRY:-}
    - VITE_QQ_BIND_COMMAND=${WEB_VITE_QQ_BIND_COMMAND:-绑定}
    - VITE_DEV_PROXY_TARGET=http://app-dev:8080
    extra_hosts:
    - "host.docker.internal:host-gateway"
    depends_on:
      app-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

    networks:
    - frontend
    - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    security_opt:
    - no-new-privileges:true
  admin-dev:
    profiles: [dev-full]
    build: *node-dev-build
    container_name: ${STACK_NAME:-stuhelper}-admin-dev
    working_dir: /workspace
    command: sh -c "corepack enable && corepack prepare pnpm@10 --activate && CI=1 pnpm install && pnpm dev:ele -- --host 0.0.0.0 --port 3001"
    volumes:
    - ./clients/admin:/workspace
    - admin_dev_node_modules:/workspace/node_modules
    - admin_dev_pnpm_store:/pnpm/store
    ports:
    - "127.0.0.1:${ADMIN_EXTERNAL_PORT:-3001}:3001"
    environment:
    - NODE_ENV=development
    - VITE_DEV_PROXY_TARGET=http://app-dev:8080
    extra_hosts:
    - "host.docker.internal:host-gateway"
    depends_on:
      app-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/admin/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

    networks:
    - frontend
    - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    security_opt:
    - no-new-privileges:true
