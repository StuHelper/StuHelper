# StuHelper Docker Compose
#
# 架构：开发环境直接使用 Vite/后端本机端口；生产公网入口由宝塔 Nginx 管理。
#
# 路由优先级总览:
#   /api/*          (700)  → backend（Go 服务，保留 /api 前缀）
#   /admin/*        (600)  → admin 前端（Vben Admin）
#   /               (500)  → web 前端（Vue SPA，catch-all）
#
# 公开 OAuth/OIDC issuer 固定为 https://sso.stuhelper.com；账号中心页面由主站承载。
# 本 compose 中的 casdoor service 仅用于本地开发或显式本地 SSO 验证。
#
# 使用方式:
#   开发（仅基础设施）:  docker compose -f docker-compose.yml up -d --wait
#   可观测性 overlay:    docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability up -d --wait
#   生产部署:            docker compose -f docker-compose.yml -f docker-compose.observability.yml -f docker-compose.prod.yml --profile prod up -d --wait
#   生产公网入口:        宝塔 Nginx → 127.0.0.1:18080 / 18000 / 18001

services:
  postgres:
    image: ${POSTGRES_IMAGE_REF:-postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7}
    container_name: ${STACK_NAME:-stuhelper}-postgres
    command:
    - postgres
    - -c
    - ssl=${POSTGRES_ENABLE_SSL:-off}
    - -c
    - ssl_cert_file=/tls/server.crt
    - -c
    - ssl_key_file=/tls/server.key
    - -c
    - hba_file=/etc/postgresql/pg_hba.conf
    - -c
    - wal_level=replica
    - -c
    - archive_mode=${POSTGRES_ARCHIVE_MODE:-off}
    - -c
    - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-15min}
    - -c
    - archive_command=sh -c 'dest=/var/lib/postgresql/wal-archive/%f; tmp="$$dest.tmp.$$$$"; if [ -f "$$dest" ]; then cmp -s %p "$$dest"; else cp %p "$$tmp" && mv "$$tmp" "$$dest"; fi'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-stuhelper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-stuhelper}
      PGDATA: ${POSTGRES_PGDATA:-/var/lib/postgresql/data}
      STUHELPER_APP_DB_PASSWORD: ${STUHELPER_APP_DB_PASSWORD:?STUHELPER_APP_DB_PASSWORD is required}
      CASDOOR_DB_PASSWORD: ${CASDOOR_DB_PASSWORD:-}
      OPENFGA_DB_PASSWORD: ${OPENFGA_DB_PASSWORD:?OPENFGA_DB_PASSWORD is required}
      STUHELPER_BACKUP_DB_PASSWORD: ${STUHELPER_BACKUP_DB_PASSWORD:?STUHELPER_BACKUP_DB_PASSWORD is required}
      STUHELPER_REPLICATION_DB_PASSWORD: ${STUHELPER_REPLICATION_DB_PASSWORD:?STUHELPER_REPLICATION_DB_PASSWORD is required}
    ports:
    - "127.0.0.1:${POSTGRES_EXTERNAL_PORT:-5432}:5432"
    volumes:
    - postgres_data:/var/lib/postgresql
    - ./infra/postgres/init-extra-dbs.sh:/docker-entrypoint-initdb.d/00-init-extra-dbs.sh:ro
    - ./infra/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    - ./infra/generated/postgres:/tls:ro
    - postgres_wal_archive:/var/lib/postgresql/wal-archive
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-stuhelper}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

    networks:
    - backend
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.50'
          memory: 512M
    security_opt:
    - no-new-privileges:true
  redis:
    image: ${REDIS_IMAGE_REF:-redis:8.6.2-alpine@sha256:c5e375abb885e6b2021c0377879e4890bf76f9065b8922ffc113f2b226b9fc17}
    container_name: ${STACK_NAME:-stuhelper}-redis
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy volatile-lru
      --port 0
      --tls-port 6379
      --tls-cert-file /tls/server.crt
      --tls-key-file /tls/server.key
      --tls-ca-cert-file /tls/ca.crt
      --tls-auth-clients no
      --aclfile /usr/local/etc/redis/users.acl
    environment:
      REDIS_USERNAME: ${REDIS_USERNAME:-stuhelper_app}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-true}
      REDIS_TLS_CA: /redis-tls/ca.crt
    ports:
    - "127.0.0.1:${REDIS_EXTERNAL_PORT:-6379}:6379"
    volumes:
    - redis_data:/data
    - ./infra/generated/redis:/tls:ro
    - ./infra/generated/redis/users.acl:/usr/local/etc/redis/users.acl:ro
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --tls --cacert /tls/ca.crt --user \"$${REDIS_USERNAME:-stuhelper_app}\" -a \"$${REDIS_PASSWORD:?REDIS_PASSWORD is required}\" ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

    networks:
    - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M
    security_opt:
    - no-new-privileges:true
  mailpit:
    profiles: [dev-full]
    image: ${MAILPIT_IMAGE_REF:-axllent/mailpit:v1.30.1@sha256:3bd7c2f2696deb35a4780d152b404dceec99cb041b942c0877b3b22384714f85}
    container_name: ${STACK_NAME:-stuhelper}-mailpit
    ports:
    - "127.0.0.1:${MAILPIT_SMTP_EXTERNAL_PORT:-1025}:1025"
    - "127.0.0.1:${MAILPIT_WEB_EXTERNAL_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

    networks:
    - backend
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    security_opt:
    - no-new-privileges:true
  minio:
    image: ${MINIO_IMAGE_REF:-minio/minio:RELEASE.2025-02-28T09-55-16Z@sha256:a929054ae025fa7997857cd0e2a2e3029238e31ad89877326dc032f4c1a14259}
    container_name: ${STACK_NAME:-stuhelper}-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
    - "127.0.0.1:${MINIO_API_EXTERNAL_PORT:-9000}:9000"
    - "127.0.0.1:${MINIO_CONSOLE_EXTERNAL_PORT:-9001}:9001"
    volumes:
    - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

    networks:
    - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
  minio-init:
    image: ${MINIO_MC_IMAGE_REF:-minio/mc:RELEASE.2025-03-12T17-29-24Z@sha256:470f5546b596e16c7816b9c3fa7a78ce4076bb73c2c73f7faeec0c8043923123}
    container_name: ${STACK_NAME:-stuhelper}-minio-init
    entrypoint:
    - /bin/sh
    - -ec
    - |
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
      backup_bucket="$${BACKUP_OBJECT_STORAGE_BUCKET:-stuhelper-postgres-backup}"
      backup_access_key="$${BACKUP_OBJECT_STORAGE_ACCESS_KEY_ID:-$${OBJECT_STORAGE_ACCESS_KEY_ID}}"
      backup_secret_key="$${BACKUP_OBJECT_STORAGE_SECRET_ACCESS_KEY:-$${OBJECT_STORAGE_SECRET_ACCESS_KEY}}"
      mc mb --ignore-existing "local/$${OBJECT_STORAGE_BUCKET}"
      mc mb --ignore-existing "local/$${backup_bucket}"
      cat >/tmp/object-storage-policy.json <<POLICY
      {
        "Version": "2012-10-17",
        "Statement": [
          {"Effect": "Allow", "Action": ["s3:ListBucket"], "Resource": ["arn:aws:s3:::$${OBJECT_STORAGE_BUCKET}"]},
          {"Effect": "Allow", "Action": ["s3:GetBucketLocation"], "Resource": ["arn:aws:s3:::$${OBJECT_STORAGE_BUCKET}"]},
          {"Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"], "Resource": ["arn:aws:s3:::$${OBJECT_STORAGE_BUCKET}/*"]}
        ]
      }
      POLICY
      cat >/tmp/backup-storage-policy.json <<POLICY
      {
        "Version": "2012-10-17",
        "Statement": [
          {"Effect": "Allow", "Action": ["s3:ListBucket"], "Resource": ["arn:aws:s3:::$${backup_bucket}"]},
          {"Effect": "Allow", "Action": ["s3:GetBucketLocation"], "Resource": ["arn:aws:s3:::$${backup_bucket}"]},
          {"Effect": "Allow", "Action": ["s3:GetObject", "s3:PutObject", "s3:DeleteObject"], "Resource": ["arn:aws:s3:::$${backup_bucket}/*"]}
        ]
      }
      POLICY
      mc admin policy create local stuhelper-object-storage /tmp/object-storage-policy.json >/dev/null 2>&1 || true
      mc admin policy create local stuhelper-backup-storage /tmp/backup-storage-policy.json >/dev/null 2>&1 || true
      mc admin user add local "$${OBJECT_STORAGE_ACCESS_KEY_ID}" "$${OBJECT_STORAGE_SECRET_ACCESS_KEY}" >/dev/null 2>&1 || true
      mc admin user add local "$${backup_access_key}" "$${backup_secret_key}" >/dev/null 2>&1 || true
      mc admin policy attach local stuhelper-object-storage --user "$${OBJECT_STORAGE_ACCESS_KEY_ID}" >/dev/null
      mc admin policy attach local stuhelper-backup-storage --user "$${backup_access_key}" >/dev/null
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:?OBJECT_STORAGE_ACCESS_KEY_ID is required}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:?OBJECT_STORAGE_SECRET_ACCESS_KEY is required}
      BACKUP_OBJECT_STORAGE_BUCKET: ${BACKUP_OBJECT_STORAGE_BUCKET:-}
      BACKUP_OBJECT_STORAGE_ACCESS_KEY_ID: ${BACKUP_OBJECT_STORAGE_ACCESS_KEY_ID:-}
      BACKUP_OBJECT_STORAGE_SECRET_ACCESS_KEY: ${BACKUP_OBJECT_STORAGE_SECRET_ACCESS_KEY:-}
      MC_CONFIG_DIR: /tmp/.mc
    depends_on:
      minio:
        condition: service_healthy

    networks:
    - backend
    restart: no
    read_only: true
    tmpfs:
    - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    security_opt:
    - no-new-privileges:true
  migrate-dev:
    profiles: [dev-full]
    image: ${GOLANG_IMAGE_REF:-golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651}
    container_name: ${STACK_NAME:-stuhelper}-migrate-dev
    working_dir: /workspace/server
    command: >-
      /usr/local/go/bin/go run ./cmd/migrate-runtime
    env_file:
    - ${ENV_FILE_PATH:-.env}
    - ${GENERATED_ENV_FILE_PATH:-.env.generated}
    environment:
      PATH: /usr/local/go/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      DATABASE_URL: postgresql://${POSTGRES_USER:-stuhelper}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stuhelper}?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable}
    volumes:
    - ./server:/workspace/server:ro
    - ./infra/generated/postgres:/tls:ro
    depends_on:
      postgres:
        condition: service_healthy

    networks:
    - backend
    restart: no
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    security_opt:
    - no-new-privileges:true
  migrate:
    profiles: [prod]
    image: ${BACKEND_IMAGE_REF:?BACKEND_IMAGE_REF is required}
    entrypoint: ["/app/migrate-runtime"]
    container_name: ${STACK_NAME:-stuhelper}-migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-stuhelper}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stuhelper}?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-verify-full}&sslrootcert=/tls/ca.crt
    volumes:
    - ./infra/generated/postgres:/tls:ro
    depends_on:
      postgres:
        condition: service_healthy

    networks:
    - backend
    restart: no
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    security_opt:
    - no-new-privileges:true
  seed-dev:
    profiles: [dev-full]
    image: ${POSTGRES_IMAGE_REF:-postgres:18.3-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7}
    container_name: ${STACK_NAME:-stuhelper}-seed-dev
    command:
    - /bin/sh
    - -c
    - psql "postgresql://${POSTGRES_USER:-stuhelper}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-stuhelper}?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable}" -v ON_ERROR_STOP=1 -f /seed/seed.sql
    volumes:
    - ./server/scripts/seed.sql:/seed/seed.sql:ro
    depends_on:
      migrate-dev:
        condition: service_completed_successfully

    networks:
    - backend
    restart: no
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    security_opt:
    - no-new-privileges:true
  resource-seed-dev:
    profiles: [dev-full]
    image: ${MINIO_MC_IMAGE_REF:-minio/mc:RELEASE.2025-03-12T17-29-24Z@sha256:470f5546b596e16c7816b9c3fa7a78ce4076bb73c2c73f7faeec0c8043923123}
    container_name: ${STACK_NAME:-stuhelper}-resource-seed-dev
    entrypoint:
    - /bin/sh
    - -ec
    - |
      mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
      mc cp --attr "Content-Type=text/markdown; charset=utf-8" \
        /seed/resources/course-8-final-review-guide.md \
        "local/$${OBJECT_STORAGE_BUCKET}/resources/dev-seed/course-8-final-review-guide.md"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:?OBJECT_STORAGE_BUCKET is required}
      MC_CONFIG_DIR: /tmp/.mc
    volumes:
    - ./server/scripts/dev-seed/resources:/seed/resources:ro
    depends_on:
      minio-init:
        condition: service_completed_successfully

    networks:
    - backend
    restart: no
    read_only: true
    tmpfs:
    - /tmp
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    security_opt:
    - no-new-privileges:true
  casdoor:
    profiles: [dev-full]
    image: ${CASDOOR_IMAGE_REF:-casbin/casdoor:3.31.1@sha256:a9c9bca53ccf94a96f3f8b4ca40298dbe00c114ef0100b742d2085b9368a6a0b}
    container_name: ${STACK_NAME:-stuhelper}-casdoor
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    environment:
      GIN_MODE: release
      appname: casdoor
      httpport: "8000"
      runmode: prod
      driverName: postgres
      dataSourceName: "user=casdoor password=${CASDOOR_DB_PASSWORD:-} host=postgres port=5432 sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable} dbname=casdoor sslrootcert=/tls/ca.crt"
      dbName: casdoor
      origin: ${CASDOOR_ISSUER:-http://localhost:8085}
    ports:
    - "127.0.0.1:${CASDOOR_EXTERNALPORT:-8085}:8000"
    volumes:
    - ./infra/generated/postgres:/tls:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8000/api/get-default-application >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
    - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.50'
          memory: 512M
  openfga-migrate:
    image: ${OPENFGA_IMAGE_REF:-openfga/openfga:v1.8.12@sha256:e2c06000981774a7a02d8aa2292df800ea80a8bc4df61a7ed5f098738b53b1ff}
    container_name: ${STACK_NAME:-stuhelper}-openfga-migrate
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgresql://openfga:${OPENFGA_DB_PASSWORD}@postgres:5432/openfga?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable}&sslrootcert=/tls/ca.crt
    volumes:
    - ./infra/generated/postgres:/tls:ro
    depends_on:
      postgres:
        condition: service_healthy

    networks:
    - backend
    restart: no
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
    security_opt:
    - no-new-privileges:true
  openfga:
    image: ${OPENFGA_IMAGE_REF:-openfga/openfga:v1.8.12@sha256:e2c06000981774a7a02d8aa2292df800ea80a8bc4df61a7ed5f098738b53b1ff}
    container_name: ${STACK_NAME:-stuhelper}-openfga
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgresql://openfga:${OPENFGA_DB_PASSWORD}@postgres:5432/openfga?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable}&sslrootcert=/tls/ca.crt
      OPENFGA_PLAYGROUND_ENABLED: "${OPENFGA_PLAYGROUND_ENABLED:-false}"
    ports:
    - "127.0.0.1:${OPENFGA_HTTP_EXTERNAL_PORT:-8081}:8080"
    - "127.0.0.1:${OPENFGA_GRPC_EXTERNAL_PORT:-8082}:8081"
    - "127.0.0.1:${OPENFGA_PLAYGROUND_EXTERNAL_PORT:-3002}:3000"
    volumes:
    - ./infra/generated/postgres:/tls:ro
    depends_on:
      openfga-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/usr/local/bin/grpc_health_probe", "-addr=:8081"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

    networks:
    - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
  app-dev:
    profiles: [dev-full]
    build:
      context: ./server
      dockerfile: Dockerfile.dev
    container_name: ${STACK_NAME:-stuhelper}-app-dev
    env_file:
    - ${ENV_FILE_PATH:-.env}
    - ${GENERATED_ENV_FILE_PATH:-.env.generated}
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://stuhelper_app:${STUHELPER_APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB:-stuhelper}?sslmode=disable
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_USERNAME: ${REDIS_USERNAME:-stuhelper_app}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_TLS_ENABLED: ${REDIS_TLS_ENABLED:-true}
      REDIS_TLS_CA: /redis-tls/ca.crt
      EMAIL_SMTP_HOST: mailpit
      EMAIL_SMTP_PORT: "1025"
      EMAIL_SMTP_STARTTLS: "false"
    extra_hosts:
    - "host.docker.internal:host-gateway"
    volumes:
    - ./server:/app
    - ./infra/generated/postgres:/tls:ro
    - ./infra/generated/redis:/redis-tls:ro
    ports:
    - "127.0.0.1:8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      migrate-dev:
        condition: service_completed_successfully
      seed-dev:
        condition: service_completed_successfully
      openfga:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

    networks:
    - backend
    - observability
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.50'
          memory: 512M
    security_opt:
    - no-new-privileges:true
  frontend-dev:
    profiles: [dev-full]
    image: ${NODE_ALPINE_IMAGE_REF:-node:24.18.0-alpine@sha256:a0b9bf06e4e6193cf7a0f58816cc935ff8c2a908f81e6f1a95432d679c54fbfd}
    container_name: ${STACK_NAME:-stuhelper}-frontend-dev
    working_dir: /app
    command: sh -c "corepack enable && pnpm install && pnpm --filter @stuhelper/web dev --host 0.0.0.0 --port 3000"
    volumes:
    - ./clients:/app
    - frontend_dev_node_modules:/app/node_modules
    ports:
    - "127.0.0.1:3000:3000"
    environment:
    - NODE_ENV=development
    - VITE_API_URL=${WEB_VITE_API_URL:-/api}
    - VITE_SSO_URL=${WEB_VITE_SSO_URL:-http://localhost:8085}
    - VITE_WEB_URL=${WEB_VITE_WEB_URL:-http://localhost:3000}
    - VITE_ADMIN_URL=${ADMIN_PUBLIC_URL:-http://localhost:3001}
    - VITE_API_TIMEOUT_MS=${WEB_VITE_API_TIMEOUT_MS:-15000}
    - VITE_QQ_BOT_ENTRY=${WEB_VITE_QQ_BOT_ENTRY:-}
    - VITE_QQ_BIND_COMMAND=${WEB_VITE_QQ_BIND_COMMAND:-绑定}
    - VITE_DEV_PROXY_TARGET=http://app-dev:8080
    extra_hosts:
    - "host.docker.internal:host-gateway"
    depends_on:
      app-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 45s

    networks:
    - frontend
    - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    security_opt:
    - no-new-privileges:true
  admin-dev:
    profiles: [dev-full]
    image: ${NODE_BOOKWORM_IMAGE_REF:-node:24.18.0-bookworm@sha256:5711a0d445a1af54af9589066c646df387d1831a608226f4cd694fc59e745059}
    container_name: ${STACK_NAME:-stuhelper}-admin-dev
    working_dir: /workspace
    command: sh -c "corepack enable && corepack prepare pnpm@10 --activate && CI=1 pnpm install && pnpm dev:ele -- --host 0.0.0.0 --port 3001"
    volumes:
    - ./clients/admin:/workspace
    - admin_dev_node_modules:/workspace/node_modules
    - admin_dev_pnpm_store:/pnpm/store
    ports:
    - "127.0.0.1:${ADMIN_EXTERNAL_PORT:-3001}:3001"
    environment:
    - NODE_ENV=development
    - VITE_DEV_PROXY_TARGET=http://app-dev:8080
    extra_hosts:
    - "host.docker.internal:host-gateway"
    depends_on:
      app-dev:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3001/admin/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

    networks:
    - frontend
    - backend
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    security_opt:
    - no-new-privileges:true
