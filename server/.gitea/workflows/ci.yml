name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v4
        with:
          version: v1.62.0
          args: --timeout=5m
          working-directory: server

  openapi:
    name: OpenAPI Spec
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Lint OpenAPI spec
        working-directory: server
        run: npx --yes @redocly/cli@latest lint api/openapi.yaml

      - name: Bundle OpenAPI spec
        working-directory: server
        run: npx --yes @redocly/cli@latest bundle api/openapi.yaml -o api/openapi.bundled.yaml

      - name: Regenerate Go code
        working-directory: server
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.5.1
          go generate ./internal/api/gen/...

      - name: Regenerate TypeScript types
        working-directory: clients/web
        run: |
          npm ci
          npm run generate:types

      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated code is out of date. Run 'make generate' in server/ and commit the changes."
            exit 1
          fi

  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        working-directory: server
        run: go mod download

      - name: Validate init.sql against test database
        working-directory: server
        run: |
          PGPASSWORD=test psql -h localhost -U test -d test -f scripts/init.sql
        env:
          PGPASSWORD: test

      - name: Run tests
        working-directory: server
        run: go test -v -race -timeout=10m -coverprofile=coverage.out ./...
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: server/coverage.out

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, openapi]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        working-directory: server
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/stuhelper ./cmd/stuhelper

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: stuhelper-linux-amd64
          path: server/bin/stuhelper

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run Gosec
        working-directory: server
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
          gosec -exclude-generated ./...
