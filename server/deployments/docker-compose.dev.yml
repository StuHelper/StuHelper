# Docker Compose 开发环境配置
# 使用方法: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  postgres:
    # 开发环境：使用独立命名卷，与生产数据隔离
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ../scripts/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro

  redis:
    # 开发环境：使用独立命名卷
    # 本地开发如需免密访问，可在 .env 中设置 REDIS_PASSWORD='' 或注释掉 base compose 中的 --requirepass
    volumes:
      - redis_dev_data:/data

volumes:
  postgres_dev_data:
    name: stuhelper_postgres_dev
  redis_dev_data:
    name: stuhelper_redis_dev
