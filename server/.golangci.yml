version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - bodyclose
    - noctx
    - sqlclosecheck
    - gocritic
    - misspell
    - unconvert

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
    gosec:
      excludes:
        - G104
        - G115
    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - hugeParam
        - rangeValCopy
        - exitAfterDefer
        - httpNoBody
        - unnamedResult
        - paramTypeCombine
        - unnecessaryBlock

  exclusions:
    # The files listed here are the checksum-pinned go-ora v2.9.0 upstream
    # snapshot. Keep the two StuHelper policy files outside this expression so
    # the repository-owned SELECT-only gate and its tests receive full linting.
    # Compatibility-sensitive upstream code is covered by the policy test and
    # full race/build gates instead of being mechanically rewritten for style.
    paths:
      - internal/thirdparty/goora/(auth_object|bfile|bulk_copy|command|connection|connection_string|custom_types|data_set|data_type_nego|db_version|driver|lob|number|oracle_type|oracletype_string|parameter|parameter_encode|ref_cursor|result_set|rowid|simple_object|tcp_protocol_nego|timestamp|timestampTZ|transaction|udt|urowid|utils|value_getter|value_setter|vector)\.go
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - noctx
      - path: test/
        linters:
          - errcheck
          - gosec
          - noctx
      - path: cmd/stuhelper/main\.go
        linters:
          - gocritic
        text: "exitAfterDefer"

formatters:
  enable:
    - gofmt
    - goimports

  exclusions:
    # Same exact upstream snapshot as linters.exclusions.paths; the
    # StuHelper-owned policy files are intentionally still formatted.
    paths:
      - internal/thirdparty/goora/(auth_object|bfile|bulk_copy|command|connection|connection_string|custom_types|data_set|data_type_nego|db_version|driver|lob|number|oracle_type|oracletype_string|parameter|parameter_encode|ref_cursor|result_set|rowid|simple_object|tcp_protocol_nego|timestamp|timestampTZ|transaction|udt|urowid|utils|value_getter|value_setter|vector)\.go

  settings:
    goimports:
      local-prefixes:
        - github.com/StuHelper/StuHelper/server

issues:
  max-issues-per-linter: 50
  max-same-issues: 10

output:
  formats:
    text:
      path: stdout
      print-linter-name: true
  sort-order:
    - linter
    - file
