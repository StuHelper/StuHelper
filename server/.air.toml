root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/stuhelper"
  cmd = "go build -o ./tmp/stuhelper ./cmd/stuhelper"
  delay = 1000
  exclude_dir = ["tmp", "vendor", "node_modules", "bin", "build", "deployments", "scripts"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  exclude_unchanged = false
  follow_symlink = false
  full_bin = ""
  include_dir = []
  include_ext = ["go", "toml", "yaml"]
  include_file = []
  kill_delay = 0
  log = "build-errors.log"
  poll = false
  poll_interval = 0
  rerun = false
  rerun_delay = 500
  send_interrupt = true
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  main_only = false
  time = false

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
  keep_scroll = true
