            $ref: '../components/schemas/student-verification.yaml#/VerifySchoolSSORequest'
    responses:
      '200':
        $ref: '#/components/responses/ApplicationResponse'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '429':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

