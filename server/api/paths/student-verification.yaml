/api/v1/student-verification/manual-camera-handoffs/{token}/camera-capture:
  post:
    tags: [StudentVerification]
    operationId: uploadManualReviewHandoffCameraCapture
    summary: 手机端通过一次性交接 token 上传实时摄像头拍摄材料
    security: []
    parameters:
      - $ref: '#/components/parameters/HandoffToken'
