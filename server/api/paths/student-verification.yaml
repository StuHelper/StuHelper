/api/v1/student-verification/eligibility:
  get:
    tags: [StudentVerification]
    operationId: getStudentVerificationEligibility
    summary: 获取当前用户在指定学校的实时学生资格
    parameters:
      - name: schoolCode
        in: query
        required: true
        schema:
          type: string
          pattern: '^[0-9]{10}$'
    responses:
      '200':
        description: 实时派生的最小资格结果
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/student-verification.yaml#/StudentEligibility'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/webhooks/student-verification/inbound-email:
  post:
    tags: [StudentVerificationWebhook]
    operationId: receiveStudentVerificationInboundEmail
    summary: 接收可信邮件入口转发的最小入站邮件事件
    description: 请求必须由已配置的邮件入口使用时间戳、事件 ID 和 HMAC 签名；原始邮件头和正文不会持久化。
    parameters:
      - name: X-StuHelper-Webhook-Timestamp
        in: header
        required: true
        schema:
          type: string
          pattern: '^[0-9]{10,13}$'
      - name: X-StuHelper-Webhook-ID
        in: header
        required: true
        schema:
          type: string
          minLength: 8
          maxLength: 500
      - name: X-StuHelper-Webhook-Signature
        in: header
        required: true
        schema:
          type: string
          pattern: '^v1=[0-9a-f]{64}$'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/student-verification.yaml#/InboundEmailWebhookRequest'
    responses:
      '202':
        description: 事件已幂等接收；不向调用方泄露挑战匹配结果
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      additionalProperties: false
                      required: [status]
                      properties:
                        status:
                          type: string
                          enum: [accepted]
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '429':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/student-verification/schools:
  get:
    tags: [StudentVerificationAdmin]
    operationId: listAdminVerificationSchools
