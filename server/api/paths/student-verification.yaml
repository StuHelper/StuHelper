/api/v1/student-verification/schools:
  get:
    tags: [StudentVerification]
    operationId: listVerificationSchools
    summary: 列出当前可创建学生认证申请的学校与方法
    responses:
      '200':
        description: 已验证配置且至少有一个可用方法的学校
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/student-verification.yaml#/VerificationSchool'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/student-verification/applications:
  post:
    tags: [StudentVerification]
    operationId: createVerificationApplication
    summary: 创建与 QQ 和群聊会话无关的学生认证申请
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/student-verification.yaml#/CreateVerificationApplicationRequest'
    responses:
      '201':
        description: 申请已创建
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/student-verification.yaml#/VerificationApplication'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/student-verification/applications/{applicationID}:
  get:
    tags: [StudentVerification]
    operationId: getVerificationApplication
    summary: 获取当前用户的一次学生认证申请
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    responses:
      '200':
        description: 申请当前状态
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/student-verification.yaml#/VerificationApplication'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '410':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
  delete:
    tags: [StudentVerification]
    operationId: cancelVerificationApplication
    summary: 取消当前用户尚未完成的学生认证申请
    description: 已结束的申请不可取消；重复取消返回当前已取消状态，便于客户端安全重试。
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    responses:
      '200':
        $ref: '#/components/responses/ApplicationResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/student-verification/applications/{applicationID}/real-name/verify:
  post:
    tags: [StudentVerification]
    operationId: verifyApplicationRealName
    summary: 提交一次实名信息校验
    parameters:
      - $ref: '#/components/parameters/ApplicationID'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/student-verification.yaml#/VerifyRealNameRequest'
