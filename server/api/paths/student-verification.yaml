/api/v1/student-verification/manual-camera-handoffs/{token}/continue:
  post:
    tags: [StudentVerification]
    operationId: chooseManualReviewCameraContinuation
    summary: 手机上传完成后原子选择在手机或桌面继续
    security: []
    parameters:
      - $ref: '#/components/parameters/HandoffToken'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/student-verification.yaml#/ManualCameraContinuationRequest'
    responses:
      '200':
        $ref: '#/components/responses/ManualHandoffResponse'
