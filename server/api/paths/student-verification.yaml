/api/v1/admin/student-verification/credentials:
  get:
    tags: [StudentVerificationAdmin]
    operationId: listAdminStudentCredentials
    summary: 按学校范围列出最小化学生凭据，不返回原始证明
    parameters:
      - name: schoolCode
        in: query
        required: true
        schema:
          type: string
          pattern: '^[0-9]{10}$'
      - name: status
        in: query
        schema:
          $ref: '../components/schemas/student-verification.yaml#/VerificationCredentialStatus'
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
    responses:
      '200':
        description: 学校范围凭据列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/student-verification.yaml#/AdminStudentCredential'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/student-verification/credentials/{credentialID}/revoke:
  post:
    tags: [StudentVerificationAdmin]
    operationId: revokeAdminStudentCredential
    summary: 在学校范围授权和近期 MFA step-up 后撤销学生凭据
    parameters:
      - name: credentialID
        in: path
        required: true
        schema:
          type: string
          maxLength: 64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/student-verification.yaml#/AdminCredentialRevokeRequest'
    responses:
      '200':
        description: 已撤销凭据
        content:
          application/json:
            schema:
              allOf:
