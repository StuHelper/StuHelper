/api/v1/student-verification/manual-camera-handoffs/{token}/resume:
  post:
    tags: [StudentVerification]
    operationId: resumeManualReviewCameraHandoff
    summary: 登录后在已选择的手机端恢复本人学生认证申请
    description: 只有一次性交接所属用户且已原子选择 mobile 时可恢复；不向其他账号暴露申请是否存在。
    parameters:
      - $ref: '#/components/parameters/HandoffToken'
    responses:
      '200':
        $ref: '#/components/responses/ApplicationResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '410':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/student-verification/manual-reviews:
  get:
    tags: [StudentVerificationAdmin]
    operationId: listAdminManualStudentReviews
    summary: 按学校范围列出脱敏人工审核队列，不加载原图
    parameters:
      - name: schoolCode
        in: query
        required: true
        schema:
          type: string
          pattern: '^[0-9]{10}$'
      - name: status
        in: query
        schema:
          type: string
          enum: [pending, supplement_required, approved, rejected]
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - name: offset
        in: query
        schema:
          type: integer
          minimum: 0
          default: 0
    responses:
      '200':
        description: 稳定排序的脱敏队列
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/student-verification.yaml#/AdminManualReviewSummary'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/student-verification/manual-reviews/{caseID}:
  get:
    tags: [StudentVerificationAdmin]
    operationId: getAdminManualStudentReview
    summary: 在学校范围授权和近期 MFA step-up 后查看必要表单详情
    parameters:
      - $ref: '#/components/parameters/CaseID'
    responses:
      '200':
        description: 审核详情；材料只含元数据，不含对象 key 或 URL
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/student-verification.yaml#/AdminManualReviewDetail'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '412':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/student-verification/manual-reviews/{caseID}/materials/{materialID}/access:
  post:
    tags: [StudentVerificationAdmin]
    operationId: accessAdminManualStudentReviewMaterial
    summary: 为一个已授权材料生成短期、只读签名 URL 并写安全审计
    parameters:
      - $ref: '#/components/parameters/CaseID'
      - $ref: '#/components/parameters/MaterialID'
    responses:
      '200':
        description: 单对象短期访问地址
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/student-verification.yaml#/AdminManualMaterialAccess'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '412':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/student-verification/manual-reviews/{caseID}/decision:
  post:
    tags: [StudentVerificationAdmin]
    operationId: decideAdminManualStudentReview
    summary: 请求补充、批准或驳回人工审核；审核员不能处理自己的申请
    parameters:
      - $ref: '#/components/parameters/CaseID'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/student-verification.yaml#/AdminManualReviewDecisionRequest'
    responses:
      '200':
        $ref: '#/components/responses/ManualReviewResponse'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '412':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/internal/phone-gates/users/{userID}:
  get:
    tags: [AccountSecurity]
    operationId: getInternalPhoneGateEligibility
    summary: 消费方读取用户是否满足账号级手机号门槛
    security:
      - serviceTokenAuth: []
    parameters:
      - name: userID
        in: path
        required: true
        schema:
          type: integer
          format: int64
          minimum: 1
    responses:
      '200':
        description: 最小手机号门槛结果，不含完整号码
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/student-verification.yaml#/PhoneGateEligibility'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

components:
  parameters:
    ApplicationID:
      name: applicationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CredentialID:
      name: credentialID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SchoolCode:
      name: schoolCode
      in: path
      required: true
      schema:
        type: string
        pattern: '^[0-9]{10}$'
    SnapshotID:
      name: snapshotID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PhoneOperationID:
      name: operationID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CaseID:
      name: caseID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HandoffID:
      name: handoffID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MaterialID:
      name: materialID
      in: path
      required: true
      schema:
        type: string
        format: uuid
    HandoffToken:
      name: token
      in: path
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
        pattern: '^[A-Za-z0-9_-]+$'
  responses:
    ApplicationResponse:
      description: 学生认证申请的最新状态
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/common.yaml#/SuccessResponse'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '../components/schemas/student-verification.yaml#/VerificationApplication'
    RosterSnapshotResponse:
      description: 快照状态与聚合质量门禁
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/common.yaml#/SuccessResponse'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '../components/schemas/student-verification.yaml#/RosterSnapshot'
    ManualReviewResponse:
      description: 人工审核脱敏状态
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/common.yaml#/SuccessResponse'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '../components/schemas/student-verification.yaml#/ManualReviewCase'
    ManualHandoffResponse:
      description: 拍摄交接状态
      content:
        application/json:
          schema:
            allOf:
              - $ref: '../components/schemas/common.yaml#/SuccessResponse'
              - type: object
                required: [data]
                properties:
                  data:
                    $ref: '../components/schemas/student-verification.yaml#/ManualCameraHandoff'
