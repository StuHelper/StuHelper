      - $ref: '#/components/parameters/ApplicationID'
    responses:
      '200':
        description: 验证码已发送
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/student-verification.yaml#/ManualEmailOTPChallenge'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '429':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/student-verification/applications/{applicationID}/manual-review/email/verify:
  post:
    tags: [StudentVerification]
    operationId: verifyManualReviewEmailOTP
    summary: 校验人工审核联系邮箱验证码并仅记录辅助证据
