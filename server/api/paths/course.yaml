/api/v1/course/courses:
  get:
    tags: [Course]
    operationId: getCourses
    summary: 获取课程列表
    security: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
      - name: q
        in: query
        schema:
          type: string
          maxLength: 100
        description: 按课程名称或课程代码搜索
      - name: departmentID
        in: query
        schema:
          type: integer
          format: int64
        description: 按院系筛选
      - name: category
        in: query
        schema:
          type: string
        description: 按分类筛选
      - name: sort
        in: query
        schema:
          type: string
          enum: [name, credits, reviewCount]
          default: name
        description: 排序方式
    responses:
      '200':
        description: 课程分页列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [list, total]
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '../components/schemas/course.yaml#/Course'
                        total:
                          type: integer
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/course/courses/grouped:
  get:
    tags: [Course]
    operationId: getCoursesGrouped
    summary: 按院系分组获取全部课程（课程目录页专用）
    security: []
    responses:
      '200':
        description: 按院系分组的课程列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [groups]
                      properties:
                        groups:
                          type: array
                          items:
                            $ref: '../components/schemas/course.yaml#/DepartmentGroup'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/course/courses/search:
  get:
    tags: [Course]
    operationId: searchCourses
    summary: 搜索课程
    security: []
    parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: 搜索关键词
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
    responses:
      '200':
        description: 搜索结果
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [list, total]
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '../components/schemas/course.yaml#/Course'
                        total:
                          type: integer
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

