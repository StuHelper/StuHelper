/api/v1/course/departments:
  get:
    tags: [Course]
    operationId: getDepartments
    summary: 获取院系列表
    security: []
    parameters:
      - name: category
        in: query
        schema:
          type: string
        description: 按分类筛选
    responses:
      '200':
        description: 院系列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/course.yaml#/Department'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/course/terms:
  get:
