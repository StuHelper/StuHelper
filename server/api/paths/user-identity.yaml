/api/v1/user/qq-binding:
  get:
    tags: [User]
    operationId: getUserQQBinding
    summary: 获取当前用户 QQ 绑定状态
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: 用户 QQ 绑定信息；未绑定 QQ 时 data 为 null。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      oneOf:
                        - $ref: '../components/schemas/user-system.yaml#/QQBinding'
                        - type: 'null'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/user/qq-binding/code:
  post:
    tags: [User]
    operationId: createUserQQBindingCode
    summary: 生成当前用户的 QQ 绑定码
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '201':
        description: QQ 绑定码已生成
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/user-system.yaml#/QQBindingCode'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/user/me:
  get:
    tags: [User]
    operationId: getUserSurface
    summary: 获取当前用户聚合信息
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: 用户聚合信息
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/user-system.yaml#/UserSurface'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
