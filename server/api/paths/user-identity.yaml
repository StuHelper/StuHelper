/api/v1/user/identity:
  get:
    tags: [User]
    operationId: getUserIdentity
    summary: 获取当前用户实名认证状态
    security:
      - cookieAuth: []
    responses:
      '200':
        description: 用户实名认证信息
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/user-system.yaml#/UserIdentity'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
  post:
    tags: [User]
    operationId: submitIdentity
    summary: 提交实名认证
    security:
      - cookieAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user-system.yaml#/SubmitIdentityRequest'
    responses:
      '201':
        description: 实名认证提交成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/user-system.yaml#/UserIdentity'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

