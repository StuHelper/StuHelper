/api/v1/user/schools:
  get:
    tags: [User]
    operationId: listSchools
    summary: 获取可用学校列表
    security: []
    responses:
      '200':
        description: 学校配置列表（不含敏感字段）
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/user-system.yaml#/SchoolConfig'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
