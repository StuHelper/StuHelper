/api/v1/course/review/user/notifications:
  get:
    tags: [Notification]
    operationId: getNotifications
    summary: 获取通知列表
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
    responses:
      '200':
        description: 通知分页列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [list, total, unread]
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '../components/schemas/notification.yaml#/Notification'
                        total:
                          type: integer
                        unread:
                          type: integer
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/course/review/user/notifications/stream:
  get:
    tags: [Notification]
    operationId: streamNotifications
    summary: 通知 SSE 实时推送
    description: 通过 Server-Sent Events 推送用户通知和未读数更新。
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: SSE 事件流
        content:
          text/event-stream:
            schema:
              type: string
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/course/review/user/notifications/unread-count:
  get:
    tags: [Notification]
    operationId: getUnreadCount
    summary: 获取未读通知数量
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: 未读数量
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/notification.yaml#/UnreadCountData'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/course/review/user/notifications/{notificationID}/read:
  put:
    tags: [Notification]
    operationId: markNotificationRead
    summary: 标记通知已读
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/NotificationIDPath'
    responses:
      '200':
        description: 标记成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/MessageData'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/course/review/user/notifications/read-all:
  put:
    tags: [Notification]
    operationId: markAllNotificationsRead
    summary: 标记所有通知已读
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: 全部标记成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/MessageData'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
