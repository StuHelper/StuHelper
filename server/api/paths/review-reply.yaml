/api/v1/course/review/reviews/{id}/replies:
  get:
    tags: [Review]
    operationId: getReplies
    summary: 获取回复列表
    security: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/ReviewIDPath'
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
    responses:
      '200':
        description: 回复分页列表
        content:
          application/json:
            schema:
              type: object
              required: [success, data]
              properties:
                success:
                  type: boolean
                  enum: [true]
                data:
                  type: object
                  required: [list, total]
                  properties:
                    list:
                      type: array
                      items:
                        $ref: '../components/schemas/review.yaml#/Reply'
                    total:
                      type: integer
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
  post:
    tags: [Review]
    operationId: createReply
    summary: 创建回复
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/ReviewIDPath'
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/review.yaml#/CreateReplyRequest'
    responses:
      '201':
        description: 回复创建成功
        content:
          application/json:
            schema:
              type: object
              required: [success, data]
              properties:
                success:
                  type: boolean
                  enum: [true]
                data:
                  $ref: '../components/schemas/review.yaml#/Reply'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '429':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/course/review/replies/{id}:
  delete:
    tags: [Review]
    operationId: deleteReply
    summary: 删除回复
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 回复 ID
        schema:
          type: string
          format: uuid
    responses:
      '200':
        description: 删除成功
        content:
          application/json:
            schema:
              type: object
              required: [success, data]
              properties:
                success:
                  type: boolean
                  enum: [true]
                data:
                  $ref: '../components/schemas/common.yaml#/MessageData'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '429':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
