/api/v1/course/review/courses/{courseID}/favorites:
  post:
    tags: [Favorite]
    operationId: addFavorite
    summary: 添加课程收藏
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/CourseIDPath'
    responses:
      '200':
        description: 收藏成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/MessageData'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
  delete:
    tags: [Favorite]
    operationId: removeFavorite
    summary: 取消课程收藏
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/CourseIDPath'
    responses:
      '200':
        description: 取消收藏成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/MessageData'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
