  post:
    tags: [Admin, OpenPlatform]
    operationId: revokeOpenPlatformApp
    summary: 吊销开放平台应用
    description: 吊销用于永久下线应用；吊销后该 app 的 client secret 不再可用，后续不能继续轮换。
    security:
      - cookieAuth: []
      - bearerAuth: []
