/api/v1/admin/open-platform/apps/{appID}/resume:
  post:
    tags: [Admin, OpenPlatform]
    operationId: resumeOpenPlatformApp
    summary: 恢复已暂停开放平台应用
    description: |
      将 suspended 应用恢复为 approved。恢复后该应用可以重新完成 client secret 校验、
      授权码换 token、token introspection 和 disclosure；已被用户撤销的 consent 不会自动恢复。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: appID
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformLifecycleActionRequest'
    responses:
      '200':
        description: 应用已恢复。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformAppLifecycleResult'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

