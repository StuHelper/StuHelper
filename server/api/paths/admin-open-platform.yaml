/api/v1/admin/open-platform/apps/{appID}/scopes/{scope}/approve:
  post:
    tags: [Admin, OpenPlatform]
    operationId: approveOpenPlatformScope
    summary: 批准开放平台应用申请的 scope
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: appID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: scope
        in: path
        required: true
        schema:
          $ref: '../components/schemas/open-platform.yaml#/OpenPlatformScope'
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformApproveScopeRequest'
    responses:
      '200':
        description: scope 已批准。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/MessageData'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/open-platform/apps/{appID}/approve:
  post:
    tags: [Admin, OpenPlatform]
    operationId: approveOpenPlatformApp
    summary: 批准开放平台应用并签发 id.stuhelper.com client secret
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: appID
        in: path
        required: true
        schema:
          type: integer
          format: int64
    responses:
      '200':
        description: 应用已批准，并返回第三方 client secret。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformApprovedApp'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/open-platform/apps/import-casdoor:
  post:
    tags: [Admin, OpenPlatform]
    operationId: importOpenPlatformCasdoorApp
    summary: 导入 legacy Casdoor 应用到 id.stuhelper.com
    description: |
      用于把历史上直接接入 sso.stuhelper.com/Casdoor 的应用导入 StuHelper Identity。
      导入后应用应把 OIDC issuer/discovery 从 sso.stuhelper.com 切换到 id.stuhelper.com。
      若未提供 clientSecret 且 Casdoor 可返回原 secret，则保留原 client_id/client_secret；
      否则服务端生成新的 client secret 并只在本响应中返回一次。
    security:
      - cookieAuth: []
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformImportCasdoorAppRequest'
    responses:
      '201':
        description: 应用已导入并处于 approved 状态。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformImportedApp'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
