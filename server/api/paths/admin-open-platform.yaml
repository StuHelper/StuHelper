    tags: [Admin, OpenPlatform]
    operationId: rotateAdminOpenPlatformAppSecret
    summary: 管理员轮换开放平台应用 client secret
    description: |
      用于泄漏处置或例行轮换。旧 secret 会立即失效，新 secret 只在本次响应中返回一次。
      应用处于 approved 或 suspended 时可以轮换；revoked 应用不可轮换。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: appID
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformSecretRotationRequest'
    responses:
      '200':
        description: Secret 已轮换。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformRotatedSecret'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

