/api/v1/admin/admission/policies:
  get:
    tags: [Admin]
    operationId: listAdmissionPolicies
    summary: 获取入群认证策略
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: 策略列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/admission.yaml#/AdmissionPolicy'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/admission/policies/{id}:
  put:
    tags: [Admin]
    operationId: updateAdmissionPolicy
    summary: 更新入群认证策略
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/AdmissionPolicy'
    responses:
      '200':
        description: 策略已更新
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionPolicy'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/admission/sessions:
  get:
    tags: [Admin]
    operationId: listAdmissionSessions
    summary: 获取入群认证会话
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: status
        in: query
        schema:
          $ref: '../components/schemas/admission.yaml#/AdmissionStatus'
      - name: platform
        in: query
        schema:
          type: string
      - name: botSelfID
        in: query
        schema:
          type: string
      - name: guildID
        in: query
        schema:
          type: string
      - name: qqID
        in: query
        schema:
          type: string
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
    responses:
      '200':
        description: 入群认证会话分页列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [list, total]
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '../components/schemas/admission.yaml#/AdmissionSession'
                        total:
                          type: integer
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/freshman-verifications:
  get:
    tags: [Admin]
    operationId: listFreshmanVerifications
    summary: 获取新生材料审核列表
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: status
        in: query
        schema:
          $ref: '../components/schemas/admission.yaml#/FreshmanApplicationStatus'
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
    responses:
      '200':
        description: 新生材料审核分页列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [list, total]
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '../components/schemas/admission.yaml#/FreshmanApplication'
                        total:
                          type: integer
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/freshman-verifications/{id}:
  get:
    tags: [Admin]
    operationId: getFreshmanVerification
    summary: 获取新生材料审核详情
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 新生材料审核详情
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/FreshmanApplication'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
  put:
    tags: [Admin]
    operationId: reviewFreshmanVerification
    summary: Admin 审核新生材料
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/FreshmanReviewRequest'
    responses:
      '200':
        description: 审核成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/FreshmanApplication'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
