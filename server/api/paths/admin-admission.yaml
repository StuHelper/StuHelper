/api/v1/admin/admission/policies:
  get:
    tags: [Admin]
    operationId: listAdmissionPolicies
    summary: 获取入群认证策略
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: 策略列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/admission.yaml#/AdmissionPolicy'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
  post:
    tags: [Admin]
    operationId: createAdmissionPolicy
    summary: 创建入群认证策略
    description: |
      从已有入群认证策略复制运行参数，并使用新的平台与群号创建一个新生认证目标群。
      `managementGuildIDs` 不会从源策略复制，默认保持为空，避免把认证目标群误当材料审核管理群。
    security:
      - cookieAuth: []
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/AdmissionPolicyCreateRequest'
    responses:
      '201':
        description: 策略已创建
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionPolicy'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/admission/policies/{id}:
  put:
    tags: [Admin]
    operationId: updateAdmissionPolicy
    summary: 更新入群认证策略
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/AdmissionPolicy'
    responses:
      '200':
        description: 策略已更新
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionPolicy'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/admission/sessions:
  get:
    tags: [Admin]
    operationId: listAdmissionSessions
    summary: 获取入群认证会话
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: status
        in: query
        schema:
          $ref: '../components/schemas/admission.yaml#/AdmissionStatus'
      - name: platform
        in: query
        schema:
          type: string
      - name: botSelfID
        in: query
        schema:
          type: string
      - name: guildID
        in: query
        schema:
          type: string
      - name: qqID
        in: query
        schema:
          type: string
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
    responses:
      '200':
        description: 入群认证会话分页列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [list, total]
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '../components/schemas/admission.yaml#/AdmissionSession'
                        total:
                          type: integer
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/admission/sessions/{id}/resend:
  post:
    tags: [Admin]
    operationId: resendAdminAdmissionSession
    summary: Admin 请求重发入群认证链接
    description: |
      将指定 admission session 标记为需要机器人提醒。后端不直接向 QQ 群发消息；
      Koishi 会通过 pending action 扫描发送现有认证链接，并回写 remind 事件。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 入群认证会话已进入待提醒队列
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/admission/sessions/{id}/regenerate:
  post:
    tags: [Admin]
    operationId: regenerateAdminAdmissionSession
    summary: Admin 重新生成入群认证链接
    description: |
      取消指定成员当前 in-progress admission session，并用原运行时上下文创建新的
      canonical join 链接。新 session 会立即进入 Koishi 待提醒队列。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '201':
        description: 入群认证会话已重新生成
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/CreatedAdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/admission/sessions/{id}/cancel:
  post:
    tags: [Admin]
    operationId: cancelAdminAdmissionSession
    summary: Admin 取消入群认证会话
    description: 取消指定 in-progress admission session，不会创建新链接。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 入群认证会话已取消
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

