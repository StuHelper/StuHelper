/api/v1/bot/admission/sessions:
  post:
    tags: [Bot]
    operationId: createBotAdmissionSession
    summary: 机器人创建入群认证会话
    security:
      - serviceTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotAdmissionSessionCreateRequest'
    responses:
      '201':
        description: 入群认证会话已创建
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/CreatedAdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/sessions/member:
  get:
    tags: [Bot]
    operationId: getBotAdmissionSessionByMember
    summary: 机器人按群成员查询最新入群认证会话
    security:
      - serviceTokenAuth: []
    parameters:
      - name: platform
        in: query
        required: true
        schema:
          type: string
      - name: guildID
        in: query
        required: true
        schema:
          type: string
      - name: qqID
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 最新入群认证会话
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/sessions/member/resend:
  post:
    tags: [Bot]
    operationId: resendBotAdmissionSessionLink
    summary: 机器人重发当前入群认证链接
    security:
      - serviceTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotAdmissionSessionSubjectRequest'
    responses:
      '200':
        description: 可继续的入群认证会话
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/sessions/member/regenerate:
  post:
    tags: [Bot]
    operationId: regenerateBotAdmissionSessionLink
    summary: 机器人取消旧会话并重新生成入群认证链接
    security:
      - serviceTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotAdmissionSessionCreateRequest'
    responses:
      '201':
        description: 入群认证会话已重新生成
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/CreatedAdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/join-requests/events:
  post:
    tags: [Bot]
    operationId: recordBotAdmissionJoinRequestEvent
    summary: 机器人上报入群申请处理结果
    security:
      - serviceTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotAdmissionJoinRequestEvent'
    responses:
      '200':
        description: 事件已记录
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/SuccessResponse'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/sessions/pending:
  get:
    tags: [Bot]
    operationId: listBotPendingAdmissionActions
    summary: 机器人拉取待执行 admission 动作
    security:
      - serviceTokenAuth: []
    parameters:
      - name: platform
        in: query
        required: true
        schema:
          type: string
      - name: botSelfID
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    responses:
      '200':
        description: 待执行动作列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        required: [sessionID, action]
                        properties:
                          sessionID:
                            type: string
                          action:
                            type: string
                            enum: [remind, release, kick, blacklist]
                          platform:
                            type: string
                          botSelfID:
                            type: string
                          guildID:
                            type: string
                          channelID:
                            type: string
                          qqID:
                            type: string
                          authURL:
                            type: string
                            format: uri
                          deadlineAt:
                            type: string
                            format: date-time
                          reason:
                            type: string
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/sessions/{id}/events:
  post:
    tags: [Bot]
    operationId: recordBotAdmissionEvent
    summary: 机器人上报 admission 动作执行结果
    security:
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotAdmissionEventRequest'
    responses:
      '200':
        description: 事件已记录
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/SuccessResponse'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/freshman/applications/pending-forward:
  get:
    tags: [Bot]
    operationId: listBotPendingFreshmanForwards
    summary: 机器人拉取待转发的新生材料
    security:
      - serviceTokenAuth: []
    responses:
      '200':
        description: 待转发材料列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        required: [application, materialURL, managementGuildIDs]
                        properties:
                          application:
                            $ref: '../components/schemas/admission.yaml#/FreshmanApplication'
                          materialURL:
                            type: string
                            format: uri
                          managementGuildIDs:
                            type: array
                            items:
                              type: string
                          platform:
                            type: string
                          botSelfID:
                            type: string
                          schoolName:
                            type: string
                          qqID:
                            type: string
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/freshman/applications/{id}/forwarded:
  post:
    tags: [Bot]
    operationId: markBotFreshmanApplicationForwarded
    summary: 标记新生材料已转发到管理群
    security:
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 转发状态已记录
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/SuccessResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/freshman/applications/{id}/view:
  post:
    tags: [Bot]
    operationId: viewBotFreshmanApplication
    summary: QQ 管理群查看新生材料申请
    security:
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotFreshmanCommandContext'
    responses:
      '200':
        description: 查询成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/FreshmanApplication'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/freshman/applications/{id}/review:
  post:
    tags: [Bot]
    operationId: reviewBotFreshmanApplication
    summary: QQ 管理群审核新生材料
    security:
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotFreshmanReviewRequest'
    responses:
      '200':
        description: 审核成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/FreshmanApplication'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
