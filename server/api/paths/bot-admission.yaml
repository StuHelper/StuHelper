/api/v1/bot/admission/freshman/applications/pending-forward:
  get:
    tags: [Bot]
    operationId: listBotPendingFreshmanForwards
    summary: 机器人拉取待转发的新生材料
    security:
      - serviceTokenAuth: []
    responses:
      '200':
        description: 待转发材料列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        type: object
                        required: [application, materialURL, managementGuildIDs]
                        properties:
                          application:
                            $ref: '../components/schemas/admission.yaml#/FreshmanApplication'
                          materialURL:
                            type: string
                            format: uri
                          managementGuildIDs:
                            type: array
                            items:
                              type: string
                          platform:
                            type: string
                          botSelfID:
                            type: string
                          schoolName:
                            type: string
                          qqID:
                            type: string
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/freshman/applications/{id}/forwarded:
  post:
    tags: [Bot]
    operationId: markBotFreshmanApplicationForwarded
    summary: 标记新生材料已转发到管理群
    security:
      - serviceTokenAuth: []
    parameters:
      - name: id
