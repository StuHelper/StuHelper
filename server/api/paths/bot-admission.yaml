/api/v1/bot/admission/sessions:
  post:
    tags: [Bot]
    operationId: createBotAdmissionSession
    summary: 机器人创建入群认证会话
    security:
      - serviceTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotAdmissionSessionCreateRequest'
    responses:
      '201':
        description: 入群认证会话已创建
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/CreatedAdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/sessions/member:
  get:
    tags: [Bot]
    operationId: getBotAdmissionSessionByMember
    summary: 机器人按群成员查询最新入群认证会话
    security:
      - serviceTokenAuth: []
    parameters:
      - name: platform
        in: query
        required: true
        schema:
          type: string
      - name: guildID
        in: query
        required: true
        schema:
          type: string
      - name: qqID
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 最新入群认证会话
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/sessions/member/resend:
  post:
    tags: [Bot]
    operationId: resendBotAdmissionSessionLink
    summary: 机器人重发当前入群认证链接
    security:
      - serviceTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotAdmissionSessionSubjectRequest'
    responses:
      '200':
        description: 可继续的入群认证会话
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/sessions/member/regenerate:
  post:
    tags: [Bot]
    operationId: regenerateBotAdmissionSessionLink
    summary: 机器人取消旧会话并重新生成入群认证链接
    security:
      - serviceTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotAdmissionSessionCreateRequest'
    responses:
      '201':
        description: 入群认证会话已重新生成
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/CreatedAdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/sessions/member/skip:
  post:
    tags: [Bot]
    operationId: skipBotAdmissionSessionForMember
    summary: 机器人跳过当前群成员的入群认证
    description: 仅取消当前群入群认证会话，不创建 StuHelper 学生认证凭据。
    security:
      - serviceTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotAdmissionSessionOperatorRequest'
    responses:
      '200':
        description: 当前群入群认证会话已取消
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/failures/reset:
  post:
    tags: [Bot]
    operationId: resetBotAdmissionFailureCount
    summary: 机器人清空当前群成员的入群认证失败次数
    security:
      - serviceTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotAdmissionSessionOperatorRequest'
    responses:
      '200':
        description: 失败次数已清空
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/BotAdmissionFailureResetResult'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/join-requests/events:
  post:
    tags: [Bot]
    operationId: recordBotAdmissionJoinRequestEvent
    summary: 机器人上报入群申请处理结果
    security:
