            $ref: '../components/schemas/admission.yaml#/BotAdmissionJoinRequestEvent'
    responses:
      '200':
        description: 事件已记录
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/SuccessResponse'
