/api/v1/bot/admission/join-requests/decision:
  post:
    tags: [Bot]
    operationId: resolveBotAdmissionJoinRequestDecision
    summary: 机器人获取入群申请处理策略
    security:
      - serviceTokenAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotAdmissionJoinRequestDecisionRequest'
    responses:
      '200':
        description: 入群申请处理策略
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/BotAdmissionJoinRequestDecision'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/policies/targets:
  get:
    tags: [Bot]
    operationId: listBotAdmissionPolicyTargets
    summary: 获取后端 admission 策略目标群
    description: |
      Koishi 使用该接口把后端 `group_admission_policies` 同步为本地 guard 绑定。
      返回值只包含目标群身份与守卫启用状态，不包含管理群或审核材料配置。
    security:
      - serviceTokenAuth: []
    responses:
      '200':
        description: admission 策略目标群列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/admission.yaml#/BotAdmissionPolicyTarget'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/sessions/pending:
  get:
    tags: [Bot]
    operationId: listBotPendingAdmissionActions
    summary: 机器人拉取待执行 admission 动作
    security:
      - serviceTokenAuth: []
    parameters:
      - name: platform
        in: query
        required: true
        schema:
          type: string
      - name: botSelfID
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    responses:
      '200':
        description: 待执行动作列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/admission.yaml#/BotAdmissionPendingAction'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/actions/stream:
  get:
    tags: [Bot]
    operationId: streamBotAdmissionActions
    summary: 机器人订阅 admission action SSE 下行流
    description: |
      该接口返回 `text/event-stream`。服务端会发送 `event: action`，`data` 为
      `BotAdmissionPendingAction` JSON；机器人执行后必须调用
      `/api/v1/bot/admission/actions/{id}/events` ACK。`event: keepalive` 用于保活。
    security:
      - serviceTokenAuth: []
    parameters:
      - name: platform
        in: query
        required: true
        schema:
          type: string
      - name: botSelfID
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    responses:
      '200':
        description: Admission action SSE stream
        content:
          text/event-stream:
            schema:
              type: string
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/actions/claim:
  post:
    tags: [Bot]
    operationId: claimBotAdmissionActions
    summary: 机器人短轮询领取 admission action
    description: |
      该接口用于无法保持 SSE 长连接的机器人运行时或兜底扫描。服务端会从
      `admission_bot_action_outbox` 领取到期 action，并返回带 `actionID` 的
      `BotAdmissionPendingAction`；机器人执行后必须调用
      `/api/v1/bot/admission/actions/{id}/events` ACK。
    security:
      - serviceTokenAuth: []
    parameters:
      - name: platform
        in: query
        required: true
        schema:
          type: string
      - name: botSelfID
        in: query
        required: true
        schema:
          type: string
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    responses:
      '200':
        description: 已领取的待执行 action 列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/admission.yaml#/BotAdmissionPendingAction'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/actions/{id}/events:
  post:
    tags: [Bot]
    operationId: recordBotAdmissionActionEvent
    summary: 机器人 ACK admission action 执行结果
    security:
      - serviceTokenAuth: []
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admission.yaml#/BotAdmissionEventRequest'
    responses:
      '200':
        description: Action 事件已记录
        content:
          application/json:
            schema:
              $ref: '../components/schemas/common.yaml#/SuccessResponse'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/bot/admission/sessions/{id}/events:
  post:
    tags: [Bot]
