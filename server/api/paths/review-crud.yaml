      content:
        application/json:
          schema:
            $ref: '../components/schemas/review.yaml#/PostReviewRequest'
    responses:
      '201':
        description: 测评发布成功
        content:
          application/json:
            schema:
              type: object
              required: [success, data]
              properties:
                success:
                  type: boolean
                  enum: [true]
                data:
                  $ref: '../components/schemas/review.yaml#/Review'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
