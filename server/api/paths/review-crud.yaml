/api/v1/course/review/reviews/search:
  get:
    tags: [Review]
    operationId: searchReviews
    summary: 搜索测评（支持课程、院系、教师、学期筛选）
    security:
      - {}
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
      - name: q
        in: query
        schema:
          type: string
        description: 课程名或课号关键字
      - name: departmentID
        in: query
        schema:
          type: integer
          format: int64
        description: 院系 ID
      - name: teacherName
        in: query
        schema:
          type: string
        description: 教师姓名模糊匹配
      - name: termID
        in: query
        schema:
          type: string
          pattern: '^\d{4}-[12]$'
        description: 按学期筛选（YYYY-S）
      - name: sort
        in: query
        schema:
          type: string
          enum: [time, likes, rating]
          default: time
    responses:
      '200':
        description: 搜索测评分页列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [list, total, page, pageSize]
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '../components/schemas/review.yaml#/Review'
                        total:
                          type: integer
                        page:
                          type: integer
                          minimum: 1
                        pageSize:
                          type: integer
                          minimum: 1
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '429':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/course/review/reviews/batch:
  get:
    tags: [Review]
    operationId: getBatchCourseReviews
    summary: 批量获取多个课程的测评列表（支持可选认证）
    description: 通过重复的 courseIDs 查询参数批量获取测评，避免N+1查询；服务端兼容旧逗号格式
    security:
      - {}
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: courseIDs
        in: query
        required: true
        schema:
          type: array
          items:
            type: integer
            format: int64
          maxItems: 20
        style: form
        explode: true
        description: 课程ID列表（最多20个）
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
      - name: sort
        in: query
        schema:
          type: string
          enum: [time, likes, rating]
          default: time
    responses:
      '200':
        description: 按课程ID分组的测评列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      additionalProperties:
                        type: object
                        required: [list, total, page, pageSize]
                        properties:
                          list:
                            type: array
                            items:
                              $ref: '../components/schemas/review.yaml#/Review'
                          total:
                            type: integer
                          page:
                            type: integer
                            minimum: 1
                          pageSize:
                            type: integer
                            minimum: 1
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '429':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

