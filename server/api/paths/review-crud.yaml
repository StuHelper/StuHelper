/api/v1/course/review/courses/{id}/reviews:
  get:
    tags: [Review]
    operationId: getCourseReviews
    summary: 获取课程测评列表
    security: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/CourseIDPath'
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
      - name: sort
        in: query
        schema:
          type: string
          enum: [time, likes, rating]
          default: time
      - name: termID
        in: query
        schema:
          type: string
        description: 按学期筛选
      - name: teacherID
        in: query
        schema:
          type: integer
          format: int64
        description: 按教师筛选
    responses:
      '200':
        description: 测评分页列表
        content:
          application/json:
            schema:
              type: object
              required: [success, data]
              properties:
                success:
                  type: boolean
                  enum: [true]
                data:
                  type: object
                  required: [list, total]
                  properties:
                    list:
                      type: array
                      items:
                        $ref: '../components/schemas/review.yaml#/Review'
                    total:
                      type: integer
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

