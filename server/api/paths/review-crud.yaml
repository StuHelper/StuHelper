/api/v1/course/review/reviews/batch:
  get:
    tags: [Review]
    operationId: getBatchCourseReviews
    summary: 批量获取多个课程的测评列表
    description: 通过逗号分隔的课程ID列表批量获取测评，避免N+1查询
    security: []
    parameters:
      - name: courseIDs
        in: query
        required: true
        schema:
          type: string
        description: 逗号分隔的课程ID列表（最多20个）
        example: "1,2,3"
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
      - name: sort
        in: query
        schema:
          type: string
          enum: [time, likes, rating]
          default: time
    responses:
      '200':
        description: 按课程ID分组的测评列表
        content:
          application/json:
            schema:
              type: object
              required: [success, data]
              properties:
                success:
                  type: boolean
                  enum: [true]
                data:
                  type: object
                  additionalProperties:
                    type: object
                    required: [list, total]
                    properties:
                      list:
                        type: array
                        items:
                          $ref: '../components/schemas/review.yaml#/Review'
                      total:
                        type: integer
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

