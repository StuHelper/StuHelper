/api/v1/admin/system-configs:
  get:
    tags: [Admin]
    operationId: listSystemConfigs
    summary: 获取系统配置列表
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: 系统配置列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: array
                      items:
                        $ref: '../components/schemas/user-system.yaml#/SystemConfig'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/system-configs/{key}:
  put:
    tags: [Admin]
    operationId: updateSystemConfig
    summary: 更新系统配置
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: key
        in: path
        required: true
        description: 配置键名
        schema:
          type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/user-system.yaml#/UpdateSystemConfigRequest'
    responses:
      '200':
        description: 更新成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/MessageData'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
