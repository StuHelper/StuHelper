/api/v1/auth/phone/request-otp:
  post:
    tags: [Auth]
    operationId: requestPhoneOTP
    summary: 发送手机验证码
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone]
            properties:
              phone:
                type: string
                pattern: '^1[3-9]\d{9}$'
                description: 中国大陆手机号（11 位）
    responses:
      '200':
        description: 验证码发送成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [message, cooldown]
                      properties:
                        message:
                          type: string
                        cooldown:
                          type: integer
                          description: 冷却时间（秒）
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '429':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/auth/phone/verify-otp:
  post:
    tags: [Auth]
    operationId: verifyPhoneOTP
    summary: 验证手机验证码并登录
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone, code]
            properties:
              phone:
                type: string
                pattern: '^1[3-9]\d{9}$'
              code:
                type: string
                minLength: 6
                maxLength: 6
                description: 6 位数字验证码
    responses:
      '200':
        description: 验证通过，登录成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [user, expiresIn]
                      properties:
                        user:
                          $ref: '../components/schemas/auth.yaml#/UserInfo'
                        expiresIn:
                          type: integer
                          description: Access Token 有效期（秒）
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '429':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/auth/exchange-native:
  post:
    tags: [Auth]
    operationId: exchangeNative
    summary: 原生 App 令牌交换（用一次性 state 换取 token）
    description: |
      原生 App 完成浏览器 SSO 后，通过 deep link 回传 code + state，
      由本端点完成 code → token 交换并以 JSON 返回（不写 cookie）。
      PKCE `code_verifier` 只保存在服务端 Redis，并随 state 一次性消费，客户端无需传递。
    security: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [code, state]
            properties:
              code:
                type: string
                description: OIDC authorization code
              state:
                type: string
                description: 登录时生成的一次性 state（同时用于服务端查找并消费 PKCE verifier）
    responses:
      '200':
        description: 令牌交换成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [accessToken, refreshToken, sessionID, expiresIn]
                      properties:
                        accessToken:
                          type: string
                        refreshToken:
                          type: string
                        sessionID:
                          type: string
                          description: 原生会话唯一标识；refresh 时用于保留 token family 追踪语义
                        expiresIn:
                          type: integer
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '429':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
