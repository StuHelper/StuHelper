/api/v1/auth/step-up:
  get:
    tags: [Auth]
    operationId: getStepUpURL
    summary: 获取 MFA step-up 重认证 URL
    description: |
      已登录会话在访问敏感操作收到 `412 step_up_required` 后调用本端点。
      服务端生成带 `prompt=login`、`max_age=0`、`acr_values=mfa` 的 Casdoor OIDC authorize URL，
      并复用 `/api/v1/auth/callback` 完成真实 code exchange 和新 token 写入。

      本端点只发起真实 OIDC reauth，不签发本地伪 `mfa_proof`。如果 Casdoor 未签发可用
      `amr` / `auth_time` claim，后续 MFA gate 仍会 fail-closed。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: redirect
        in: query
        required: false
        description: step-up 完成后的前端回跳地址；支持以 `/` 开头的站内相对路径，或命中服务端 allowlist 的绝对 URL。
        schema:
          type: string
          format: uri-reference
      - name: platform
        in: query
        required: false
        description: step-up 发起平台；`native` 会把 callback 标记为 deep-link 回传流程，其他值按 Web 处理。
        schema:
          type: string
          enum: [web, native]
          x-enum-varnames:
            - GetStepUpURLParamsPlatformWeb
            - GetStepUpURLParamsPlatformNative
    responses:
      '200':
        description: 返回 Casdoor OIDC step-up 授权 URL 和 state
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/LoginURLResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/auth/callback:
  get:
    tags: [Auth]
    operationId: handleCallback
    summary: 处理 OIDC 回调并完成 302 跳转
    description: |
      服务端消费一次性 state 后完成 OIDC code exchange。
      - Web/H5 state：写入会话 cookie，然后 302 到前端页面
      - Native state：不写 cookie，而是 302 到 `stuhelper://auth/callback?...` deep link 交回 App
    security: []
    parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
    responses:
      '302':
        description: 登录成功后的重定向；Web/H5 返回前端 URL，native 返回 `stuhelper://auth/callback?...` deep link
        headers:
          Location:
            description: Web/H5 为前端回跳地址；native 为 App deep link
            schema:
              type: string
              format: uri-reference
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/auth/refresh:
  post:
    tags: [Auth]
    operationId: refreshToken
    summary: 刷新 Access Token
    description: |
      支持两种传递 refresh token 的方式：
      - **Web 浏览器**：通过 HttpOnly cookie 自动携带（cookieAuth）
      - **原生 App**：通过请求体 JSON 传递（无 cookie 环境）

      原生 App 请求时，响应额外包含 accessToken 和 refreshToken 字段，
      供客户端更新本地存储。
      如果 token 来源于 `/api/v1/auth/exchange-native`，客户端还必须在请求头
      `X-Stuhelper-Session-ID` 中回传交换时获得的 session ID，以便服务端在
      refresh rotation 时继续追踪同一 session family。
    security:
      - cookieAuth: []   # Web 浏览器：refresh_token 通过 cookie 自动携带
      - {}               # 原生 App：refresh token 通过请求体传递，无需 cookie
    parameters:
      - $ref: '../components/parameters/common.yaml#/NativeSessionIDHeader'
    requestBody:
      description: 原生 App 通过请求体传递 refresh token（Web 浏览器通过 cookie 自动携带，无需此字段）
      required: false
      content:
        application/json:
          schema:
            type: object
            properties:
              refreshToken:
                type: string
                description: 原生 App 的 refresh token
    responses:
      '200':
        description: Token 刷新成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [message, expiresIn]
                      properties:
                        message:
                          type: string
                        expiresIn:
                          type: integer
                        accessToken:
                          type: string
                          description: 仅原生 App 请求时返回
                        refreshToken:
                          type: string
                          description: 仅原生 App 请求时返回
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

