/api/v1/auth/login:
  get:
    tags: [Auth]
    operationId: getLoginURL
    summary: 获取 SSO 登录 URL
    security: []
    parameters:
      - name: redirect
        in: query
        required: false
        description: 登录完成后的前端回跳地址；支持以 `/` 开头的站内相对路径，或命中服务端 allowlist 的绝对 URL。
        schema:
          type: string
          format: uri-reference
      - name: platform
        in: query
        required: false
        description: 登录发起平台；`native` 会把 callback 标记为 deep-link 回传流程，其他值按 Web 处理。
        schema:
          type: string
          enum: [web, native]
      - name: app
        in: query
        required: false
        description: 发起登录的一方应用；默认 `web`，原生流程默认 `uniapp`。
        schema:
          type: string
          enum: [web, admin, uniapp]
    responses:
      '200':
        description: 返回 Casdoor OIDC 授权 URL 和 state
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [url, state]
                      properties:
                        url:
                          type: string
                          format: uri
                        state:
                          type: string
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

