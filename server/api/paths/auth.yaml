/api/v1/auth/logout:
  post:
    tags: [Auth]
    operationId: logout
    summary: 登出当前设备
    description: |
      浏览器请求通过服务端 `session_id` cookie 定位会话。
      原生 OIDC 客户端如果没有 `session_id` cookie，必须在请求头
      `X-Stuhelper-Session-ID` 中回传交换时获得的 session ID。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/NativeSessionIDHeader'
    responses:
      '200':
        description: 登出成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/MessageData'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

