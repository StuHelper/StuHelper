/api/v1/admin/auth/account-locks/unlock:
  post:
    tags: [Admin]
    operationId: unlockAuthAccount
    summary: 解除认证失败账户锁
    description: 仅允许具备全局 user:system:update 能力的管理员清除手机号维度的认证失败软锁 / 硬锁；审计日志只记录脱敏账户。
