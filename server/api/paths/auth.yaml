    tags: [Auth]
    operationId: getCurrentUser
    summary: 获取当前用户信息
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: 当前用户信息
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
