/api/v1/auth/login:
  get:
    tags: [Auth]
    operationId: getLoginURL
    summary: 获取 SSO 登录 URL
    security: []
    parameters:
      - name: redirect
        in: query
        required: false
        description: 登录完成后的前端回跳地址（绝对 URL）
        schema:
          type: string
          format: uri
    responses:
      '200':
        description: 返回 Zitadel OIDC 授权 URL 和 state
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [url, state]
                      properties:
                        url:
                          type: string
                          format: uri
                        state:
                          type: string
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/auth/signup:
  get:
    tags: [Auth]
    operationId: getSignupURL
    summary: 获取 SSO 注册 URL
    security: []
    parameters:
      - name: redirect
        in: query
        required: false
        description: 注册完成后的前端回跳地址（绝对 URL）
        schema:
          type: string
          format: uri
    responses:
      '200':
        description: 返回 Zitadel OIDC 授权 URL 和 state
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [url, state]
                      properties:
                        url:
                          type: string
                          format: uri
                        state:
                          type: string
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/auth/callback:
  get:
    tags: [Auth]
    operationId: handleCallback
    summary: 处理 OIDC 回调并重定向回前端
    security: []
    parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
    responses:
      '302':
        description: 登录成功，写入 Cookie 后重定向到前端页面
        headers:
          Location:
            description: 前端回跳地址
            schema:
              type: string
              format: uri
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/auth/refresh:
  post:
    tags: [Auth]
    operationId: refreshToken
    summary: 刷新 Access Token
    security:
      - cookieAuth: []
    responses:
      '200':
        description: Token 刷新成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [message, expiresIn]
                      properties:
                        message:
                          type: string
                        expiresIn:
                          type: integer
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/auth/me:
  get:
    tags: [Auth]
    operationId: getCurrentUser
    summary: 获取当前用户信息
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: 当前用户信息
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/auth.yaml#/UserInfo'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

