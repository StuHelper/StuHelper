/api/v1/open-platform/authorize:
  get:
    tags: [OpenPlatform]
    operationId: openPlatformAuthorize
    summary: 发起开放平台授权
    description: |
      Legacy 授权辅助接口。新应用应直接接入 id.stuhelper.com 的 OIDC discovery；
      该接口保留给站内授权页与历史调用方。若用户已授予全部 scope，
      返回下一步 redirect URL；否则返回 StuHelper 授权确认页或资料补全页 URL。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
          format: uri
      - name: scope
        in: query
        required: true
        description: 空格分隔的开放平台 scope。
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: 已授权时返回 redirectURL，需授权时返回 consentURL 和 scopes。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformAuthorizeResponse'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/open-platform/consent:
  get:
    tags: [OpenPlatform]
    operationId: getOpenPlatformConsent
    summary: 获取开放平台授权页数据
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: token
        in: query
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 授权页展示所需的应用信息、scope 字段说明和回调地址。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformConsentPage'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

