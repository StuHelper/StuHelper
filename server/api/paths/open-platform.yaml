        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/open-platform/apps/{appID}/redirect-uri-requests/{requestID}/withdraw:
  post:
    tags: [OpenPlatform]
    operationId: withdrawOpenPlatformRedirectURIRequest
    summary: 开发者撤回待审核 redirect URI 变更申请
    description: |
      当前登录用户必须是应用 owner。只能撤回仍处于 pending 状态的 redirect URI 变更申请；
      撤回后管理员不能再批准该申请，开发者可以重新提交新的变更申请。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: appID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: requestID
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformWithdrawalRequest'
    responses:
      '200':
        description: redirect URI 变更申请已撤回。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformRedirectURIRequest'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

