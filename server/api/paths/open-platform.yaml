        application/json:
          schema:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformWithdrawalRequest'
    responses:
      '200':
        description: 应用已撤回。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformAppLifecycleResult'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/open-platform/consents:
  get:
    tags: [OpenPlatform]
    operationId: listOpenPlatformConsents
    summary: 查看当前用户已授权的开放平台应用
    description: 返回当前用户仍处于 active 状态的第三方应用授权，用户中心可据此展示应用、scope、授权时间并提供撤销入口。
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: 当前用户的 active 授权应用列表。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformUserConsents'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/open-platform/consents/audit-events:
  get:
    tags: [OpenPlatform]
    operationId: listOpenPlatformConsentAuditEvents
    summary: 查看当前用户开放平台授权活动记录
    description: |
      返回当前登录用户自己的 Open Platform consent grant/deny/revoke、disclosure granted/denied 和 replay_detected 审计摘要。
      该接口不接受 userID 参数，也不会返回其他用户或管理员级全量审计事件。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: appID
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: eventType
        in: query
        required: false
        description: 限定用户可见的 consent/disclosure 事件类型。
        schema:
          type: string
          enum:
            - open_platform.consent.granted
            - open_platform.consent.denied
            - open_platform.consent.revoked
            - open_platform.disclosure.granted
            - open_platform.disclosure.denied
            - open_platform.disclosure.replay_detected
      - name: scope
        in: query
        required: false
        schema:
          $ref: '../components/schemas/open-platform.yaml#/OpenPlatformScope'
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
    responses:
      '200':
        description: 当前用户自己的开放平台授权活动记录。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformUserConsentAuditEventList'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/open-platform/consents/{appID}:
  delete:
    tags: [OpenPlatform]
    operationId: revokeOpenPlatformConsent
    summary: 撤销当前用户授予某个开放平台应用的授权
    description: |
      不传 scope 时撤销当前用户对该应用的全部 active 授权；传 `scope` 查询参数时只撤销指定 scope。
      撤销后下一次 disclosure / UserInfo 会立即重新进入 consent required。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: appID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: scope
        in: query
        required: false
        description: 可重复传入的开放平台 scope；为空时撤销该 app 全部授权。
        schema:
          type: array
          items:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformScope'
        style: form
        explode: true
    responses:
      '200':
        description: 授权已撤销。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/common.yaml#/MessageData'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '412':
        $ref: '../components/responses/open-platform.yaml#/ConsentRequired'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/open-platform/resources/access/check:
  post:
    tags: [OpenPlatform]
    operationId: checkOpenPlatformResourceAccess
    summary: 第三方应用检查具体资源访问权限
    description: |
      首选使用 `Authorization: Bearer <client_credentials access_token>` 认证应用身份。
      兼容模式下也可使用开放平台应用的 clientID/clientSecret 认证应用身份。
      Bearer token 与 body clientID/clientSecret 互斥；携带 Bearer token 时请求体不得再包含应用密钥。
      携带非 Bearer 的 Authorization 头会被拒绝；使用兼容 body credential 时应省略 Authorization 头。
      `resource.read` / `resource.write` scope 只表示应用可申请资源类能力；
      是否能访问某个具体资源由 OpenFGA 中的 app -> resource tuple 决定。
      该接口不读取或写入用户 consent 表。
    security:
      - bearerAuth: []
      - {}
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformResourceAccessCheckRequest'
    responses:
      '200':
        description: 返回资源访问决策。缺少资源 tuple 或未批准对应 scope 时 allowed=false。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformResourceAccessDecision'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/open-platform/consent/deny:
  post:
    tags: [OpenPlatform]
    operationId: denyOpenPlatformConsent
    summary: 拒绝开放平台授权
    security:
      - cookieAuth: []
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformConsentDecisionRequest'
