/api/v1/open-platform/apps:
  get:
    tags: [OpenPlatform]
    operationId: listOpenPlatformApps
    summary: 查看当前用户提交的开放平台应用
    description: 返回当前用户作为 owner 提交的第三方应用及其 scope 审核状态，用于开发者门户展示应用生命周期。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum: [pending, approved, suspended, revoked, all]
          default: all
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
    responses:
      '200':
        description: 当前用户提交的开放平台应用分页列表。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformAppList'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

  post:
    tags: [OpenPlatform]
    operationId: registerOpenPlatformApp
    summary: 注册开放平台第三方应用
    security:
      - cookieAuth: []
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformRegisterAppRequest'
    responses:
      '201':
        description: 应用已提交审核。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformRegisteredApp'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
