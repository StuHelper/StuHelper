/api/v1/open-platform/authorize:
  get:
    tags: [OpenPlatform]
    operationId: openPlatformAuthorize
    summary: 发起开放平台授权
    description: |
      Legacy 授权辅助接口。新应用应直接接入 sso.stuhelper.com 的 OIDC discovery，
      并通过 StuHelper Open API 读取业务数据。该接口保留给站内授权页与历史调用方。若用户已授予全部 scope，
      返回下一步 redirect URL；否则返回 StuHelper 授权确认页或资料补全页 URL。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: client_id
        in: query
        required: true
        schema:
          type: string
      - name: redirect_uri
        in: query
        required: true
        schema:
          type: string
          format: uri
      - name: scope
        in: query
        required: true
        description: 空格分隔的开放平台 scope。
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
    responses:
      '200':
        description: 已授权时返回 redirectURL，需授权时返回 consentURL 和 scopes。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformAuthorizeResponse'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/open-platform/apps/{appID}/secret/rotate:
  post:
    tags: [OpenPlatform]
    operationId: rotateOpenPlatformAppSecret
    summary: 开发者轮换自己应用的 client secret
    description: |
      当前登录用户必须是应用 owner，且应用必须处于 approved 状态。轮换成功后旧 secret 立即失效；
      新 secret 只在本次响应中返回一次。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: appID
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformSecretRotationRequest'
    responses:
      '200':
        description: Secret 已轮换。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformRotatedSecret'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/open-platform/apps/{appID}:
  patch:
    tags: [OpenPlatform]
    operationId: updateOpenPlatformAppProfile
    summary: 开发者更新自己应用的展示资料
    description: |
      当前登录用户必须是应用 owner，且应用不能处于 revoked 状态。该接口只允许更新展示名、
      描述、主页和隐私政策 URL；redirect URI 仍需通过独立变更申请进入管理员审核。
      更新会写入 `open_platform.app.profile_updated` 审计事件。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: appID
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformUpdateAppProfileRequest'
    responses:
      '200':
        description: 应用展示资料已更新。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformAppLifecycleResult'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/open-platform/apps/{appID}/audit-events:
  get:
    tags: [OpenPlatform]
    operationId: listOpenPlatformAppAuditEvents
    summary: 开发者查看自己应用的开放平台审计摘要
    description: |
      当前登录用户必须是应用 owner。返回该应用的生命周期、审批、redirect URI、secret 轮换、
      consent/disclosure、资源授权和 token 探针审计摘要；响应不包含用户 ID、管理员全量 metadata 或原始 token claim payload。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: appID
        in: path
        required: true
        schema:
          type: integer
          format: int64
      - name: eventType
        in: query
        required: false
        description: 限定开发者可见的 Open Platform app 审计事件类型。
        schema:
          type: string
      - name: scope
        in: query
        required: false
        schema:
          $ref: '../components/schemas/open-platform.yaml#/OpenPlatformScope'
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
    responses:
      '200':
        description: 自有应用的开放平台审计摘要。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformDeveloperAppAuditEventList'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

