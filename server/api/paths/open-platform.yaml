      当前登录用户必须是应用 owner，且应用不能处于 pending 或 revoked 状态。
      该接口提交新的完整 redirect URI 列表；管理员批准后会整体替换应用当前 redirect URI。
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: appID
        in: path
        required: true
        schema:
          type: integer
          format: int64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/open-platform.yaml#/OpenPlatformRedirectURIChangeRequest'
    responses:
      '201':
        description: redirect URI 变更申请已提交。
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/open-platform.yaml#/OpenPlatformRedirectURIRequest'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
