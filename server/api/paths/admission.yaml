/api/v1/admission/school-sso/{schoolCode}/login:
  get:
    tags: [Admission]
    operationId: startAdmissionSchoolSSO
    summary: 跳转学校官方 SSO 登录
    security: []
    parameters:
      - name: schoolCode
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9]{10}$'
      - name: return
        in: query
        schema:
          type: string
          format: uri
      - name: admissionSessionID
        in: query
        schema:
          type: string
        description: 当前 Join 页面绑定的 admission session ID；SSO 回调会用该值继续同一 admission session。
    responses:
      '302':
        description: Redirect to school SSO provider
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admission/school-sso/{schoolCode}/callback:
  get:
    tags: [Admission]
    operationId: completeAdmissionSchoolSSO
    summary: 学校官方 SSO 回调
    security: []
    parameters:
      - name: schoolCode
        in: path
        required: true
        schema:
          type: string
          pattern: '^[0-9]{10}$'
      - name: code
        in: query
        schema:
          type: string
      - name: state
        in: query
        schema:
          type: string
    responses:
      '302':
        description: Redirect back to admission return URL
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '503':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
