/api/v1/admission/sessions/{token}:
  get:
    tags: [Admission]
    operationId: previewAdmissionSession
    summary: 预览入群认证 token 状态
    security: []
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 入群认证会话
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '410':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admission/sessions/{token}/link:
  post:
    tags: [Admission]
    operationId: linkAdmissionSession
    summary: 已登录用户消费 admission token 并绑定 QQ 会话
    parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
    responses:
      '200':
        description: 绑定后的 admission 状态
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionSession'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '410':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admission/me:
  get:
    tags: [Admission]
    operationId: getAdmissionMe
    summary: 获取当前登录用户 admission 状态
    parameters:
      - name: admissionSessionID
        in: query
        schema:
          type: string
        description: 当前 Join 页面绑定的 admission session ID；传入后只返回该登录用户名下的指定 session 状态。
    responses:
      '200':
        description: 当前 admission 状态
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/AdmissionMe'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admission/freshman/applications:
  post:
    tags: [Admission]
    operationId: createFreshmanApplication
    summary: 创建新生材料认证申请
    requestBody:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [schoolCode, applicantName, materialType]
            properties:
              schoolCode:
                type: string
                pattern: '^[0-9]{10}$'
                description: 教育部学校标识码；公开新生材料申请必须以此字段识别学校。
              admissionSessionID:
                type: string
                description: 当前 Join 页面绑定的 admission session ID；用于多群/多会话时把新生申请绑定到当前页面 session。
              applicantName:
                type: string
              departmentOrMajor:
                type: string
              materialType:
                type: string
                enum: [admission_notice, admission_certificate]
    responses:
      '201':
        description: 新生申请已创建
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/admission.yaml#/FreshmanApplication'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '409':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

