/api/v1/admin/storage/mounts:
  get:
    tags: [Storage, Admin]
    operationId: listStorageMounts
    summary: 管理员查看存储挂载点
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: 存储挂载点列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [items]
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '../components/schemas/storage.yaml#/StorageMount'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
  post:
    tags: [Storage, Admin]
    operationId: createStorageMount
    summary: 管理员创建存储挂载点
    security:
      - cookieAuth: []
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/storage.yaml#/CreateStorageMountRequest'
    responses:
      '201':
        description: 存储挂载点创建成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/storage.yaml#/StorageMount'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/admin/storage/mounts/{mountID}/health-check:
  post:
    tags: [Storage, Admin]
    operationId: checkStorageMountHealth
    summary: 管理员触发挂载点健康检查
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/MountIDPath'
    responses:
      '200':
        description: 健康检查结果
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/storage.yaml#/StorageMount'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
