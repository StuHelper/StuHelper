/api/v1/course/review/admin/reports:
  get:
    tags: [Admin]
    operationId: listReports
    summary: 获取举报列表
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: status
        in: query
        schema:
          type: string
          enum: [pending, resolved, rejected, all]
          default: pending
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
    responses:
      '200':
        description: 举报分页列表
        content:
          application/json:
            schema:
              type: object
              required: [success, data]
              properties:
                success:
                  type: boolean
                  enum: [true]
                data:
                  type: object
                  required: [list, total]
                  properties:
                    list:
                      type: array
                      items:
                        $ref: '../components/schemas/admin.yaml#/ReviewReport'
                    total:
                      type: integer
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/course/review/admin/reports/{id}:
  put:
    tags: [Admin]
    operationId: processReport
    summary: 处理举报
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - name: id
        in: path
        required: true
        description: 举报 ID
        schema:
          type: string
          format: uuid
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/admin.yaml#/ProcessReportRequest'
    responses:
      '200':
        description: 处理成功
        content:
          application/json:
            schema:
              type: object
              required: [success, data]
              properties:
                success:
                  type: boolean
                  enum: [true]
                data:
                  $ref: '../components/schemas/common.yaml#/MessageData'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '500':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

