            schema:
              type: object
              required: [success, data]
              properties:
                success:
                  type: boolean
                  enum: [true]
                data:
                  type: object
                  required: [list, total]
                  properties:
                    list:
                      type: array
                      items:
                        $ref: '../components/schemas/review.yaml#/Review'
