/api/v1/admin/academics/import-jobs:
  get:
    tags: [Academics, Admin]
    operationId: listAcademicImportJobs
    summary: 管理员查看导入作业
    security:
      - cookieAuth: []
      - bearerAuth: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
    responses:
      '200':
        description: 导入作业列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [items, total, page, pageSize]
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '../components/schemas/academics.yaml#/AcademicImportJob'
                        total:
                          type: integer
                        page:
                          type: integer
                        pageSize:
                          type: integer
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
  post:
    tags: [Academics, Admin]
    operationId: triggerAcademicImport
    summary: 管理员触发一次导入
    security:
      - cookieAuth: []
      - bearerAuth: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../components/schemas/academics.yaml#/AcademicImportRequest'
    responses:
      '201':
        description: 导入作业创建成功
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/academics.yaml#/AcademicImportJob'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
