/api/v1/admin/academics/sources:
  get:
    tags: [Academics, Admin]
    operationId: listAcademicSources
    summary: 管理员查看导入源
    security:
      - cookieAuth: []
      - bearerAuth: []
    responses:
      '200':
        description: 导入源列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [items]
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '../components/schemas/academics.yaml#/AcademicSource'
      '401':
        $ref: '../components/responses/common.yaml#/ErrorResponse'
      '403':
