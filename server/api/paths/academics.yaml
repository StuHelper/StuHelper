/api/v1/academics/terms:
  get:
    tags: [Academics]
    operationId: listAcademicTerms
    summary: 获取教务学期列表
    security: []
    responses:
      '200':
        description: 学期列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [items]
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '../components/schemas/academics.yaml#/AcademicTerm'
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/academics/offerings:
  get:
    tags: [Academics]
    operationId: listAcademicOfferings
    summary: 查询开课列表
    security: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/PageParam'
      - $ref: '../components/parameters/common.yaml#/PageSizeParam'
      - name: termCode
        in: query
        schema:
          type: string
      - name: schoolName
        in: query
        schema:
          type: string
      - name: departmentName
        in: query
        schema:
          type: string
      - name: query
        in: query
        schema:
          type: string
      - name: teacherName
        in: query
        schema:
          type: string
    responses:
      '200':
        description: 开课列表
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      type: object
                      required: [items, total, page, pageSize]
                      properties:
                        items:
                          type: array
                          items:
                            $ref: '../components/schemas/academics.yaml#/AcademicOffering'
                        total:
                          type: integer
                        page:
                          type: integer
                        pageSize:
                          type: integer
      '400':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

/api/v1/academics/offerings/{offeringID}:
  get:
    tags: [Academics]
    operationId: getAcademicOffering
    summary: 获取开课详情
    security: []
    parameters:
      - $ref: '../components/parameters/common.yaml#/OfferingIDPath'
    responses:
      '200':
        description: 开课详情
        content:
          application/json:
            schema:
              allOf:
                - $ref: '../components/schemas/common.yaml#/SuccessResponse'
                - type: object
                  required: [data]
                  properties:
                    data:
                      $ref: '../components/schemas/academics.yaml#/AcademicOffering'
      '404':
        $ref: '../components/responses/common.yaml#/ErrorResponse'

