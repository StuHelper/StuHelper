components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceTokenAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
  responses:
    ErrorResponse:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseBody'
    DisclosureResponse:
      description: 按已授权 scope 返回用户字段。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/SuccessResponse'
              - type: object
                required:
                  - data
                properties:
                  data:
                    $ref: '#/components/schemas/OpenPlatformDisclosure'
    ConsentRequired:
      description: 用户尚未授权该应用读取请求的 scope。
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/ErrorResponseBody'
              - type: object
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                      - details
                    properties:
                      code:
                        type: string
                        example: A0400005
                      message:
                        type: string
                      details:
                        type: object
                        required:
                          - consentURL
                          - scopes
                        properties:
                          consentURL:
                            type: string
                            format: uri-reference
                          scopes:
                            type: array
                            items:
                              $ref: '#/components/schemas/OpenPlatformScopeDefinition'
  schemas:
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          enum:
            - true
    ErrorResponseBody:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          $ref: '#/components/schemas/APIError'
    APIError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: A00400
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    MessageData:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    LoginURLResponse:
      type: object
      required:
        - url
        - state
      properties:
        url:
          type: string
          format: uri
        state:
          type: string
          description: OAuth state parameter for CSRF protection
    CallbackResponse:
      type: object
      required:
        - user
        - expiresIn
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
        expiresIn:
          type: integer
          description: Access token TTL in seconds
    RefreshResponse:
      type: object
      required:
        - expiresIn
      properties:
        expiresIn:
          type: integer
    UserInfo:
      type: object
      required:
        - id
        - name
        - displayName
        - roles
        - capabilities
        - globalCapabilities
        - capabilityGrants
        - canAccessAdmin
        - isPlatformAdmin
      properties:
        id:
          type: string
        name:
          type: string
        displayName:
          type: string
        avatar:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
          description: OIDC Token 中解析出的粗粒度角色列表
        isPlatformAdmin:
          type: boolean
          description: 是否持有平台级 super_admin 角色，不直接等于业务资源授权
        capabilities:
          type: array
          items:
            type: string
          description: 当前用户拥有的能力集合（由 roles 在应用侧静态展开）
        globalCapabilities:
          type: array
          items:
            type: string
          description: 当前前端可直接消费的全局能力集合，不含学校或角色范围限制
        capabilityGrants:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityGrant'
          description: 完整能力授权明细，保留学校范围和角色范围等约束信息
        canAccessAdmin:
          type: boolean
          description: 当前用户是否拥有至少一个可直接进入现有后台界面的全局能力
        accountSettingsUrl:
          type: string
          format: uri
          description: 身份提供方账户设置页，用于修改密码等账号安全设置
    Course:
      type: object
      required:
        - id
        - name
        - credits
        - departmentID
        - reviewCount
      properties:
        id:
          type: integer
          format: int64
        schoolID:
          type: integer
          format: int64
        departmentID:
          type: integer
          format: int64
        departmentName:
          type: string
        code:
          type: string
        name:
          type: string
        credits:
          type: number
          format: double
        category:
          type: string
        reviewCount:
          type: integer
        isFavorited:
          type: boolean
          description: 当前登录用户是否已收藏（未登录时不返回此字段）
    Department:
      type: object
      required:
        - id
        - name
        - category
      properties:
        id:
          type: integer
          format: int64
        schoolID:
          type: integer
          format: int64
        name:
          type: string
        shortName:
          type: string
        category:
          type: string
        sortOrder:
          type: integer
    Term:
      type: object
      required:
        - id
        - name
        - isCurrent
      properties:
        id:
          type: string
        schoolID:
          type: integer
          format: int64
        name:
          type: string
        isCurrent:
          type: boolean
    CourseCategory:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        schoolID:
          type: integer
          format: int64
        name:
          type: string
        sortOrder:
          type: integer
    FavoriteCourse:
      allOf:
        - $ref: '#/components/schemas/Course'
        - type: object
          required:
            - favoritedAt
          properties:
            favoritedAt:
              type: string
              format: date-time
    CourseStats:
      type: object
      required:
        - courseCount
        - departmentCount
      properties:
        courseCount:
          type: integer
        departmentCount:
          type: integer
    DepartmentGroup:
      type: object
      required:
        - departmentID
        - departmentName
        - courses
      properties:
        departmentID:
          type: integer
          format: int64
        departmentName:
          type: string
        courses:
          type: array
          items:
            $ref: '#/components/schemas/Course'
    Review:
      type: object
      required:
        - id
        - courseID
        - title
        - termID
        - content
        - ratings
        - likeCount
        - dislikeCount
        - replyCount
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        courseID:
          type: integer
          format: int64
        courseName:
          type: string
        teacherID:
          type:
            - integer
            - 'null'
          format: int64
        teacherName:
          type: string
        termID:
          type: string
        termName:
          type: string
        title:
          type: string
        content:
          type: string
        grade:
          type: string
          enum:
            - A+
            - A
            - A-
            - B+
            - B
            - B-
            - C+
            - C
            - C-
            - D
            - F
        ratings:
          $ref: '#/components/schemas/ReviewRatings'
        likeCount:
          type: integer
        dislikeCount:
          type: integer
        replyCount:
          type: integer
        status:
          type: string
          enum:
            - published
            - pending_review
            - hidden
            - deleted
        contentFlag:
          type: string
          enum:
            - warn
            - review
            - cleared
          description: 内容审核标记；review 表示待人工复核，warn 表示已发布但需关注
        moderationReason:
          type:
            - string
            - 'null'
          description: 屏蔽原因（仅 hidden 状态时存在）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReviewRatings:
      type: object
      additionalProperties:
        type: integer
        minimum: 1
        maximum: 5
      description: Map of dimension key to rating value (1-5)
    PostReviewRequest:
      type: object
      required:
        - courseID
        - title
        - termID
        - content
        - ratings
      properties:
        courseID:
          type: integer
          format: int64
          minimum: 1
        teacherID:
          type: integer
          format: int64
          minimum: 1
        termID:
          type: string
          maxLength: 20
          pattern: ^\d{4}-[12]$
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 10
          maxLength: 5000
        grade:
          type: string
          enum:
            - A+
            - A
            - A-
            - B+
            - B
            - B-
            - C+
            - C
            - C-
            - D
            - F
        ratings:
          $ref: '#/components/schemas/ReviewRatings'
    UpdateReviewRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        content:
          type: string
          minLength: 10
          maxLength: 5000
        grade:
          type: string
          enum:
            - A+
            - A
            - A-
            - B+
            - B
            - B-
            - C+
            - C
            - C-
            - D
            - F
        ratings:
          $ref: '#/components/schemas/ReviewRatings'
    VoteRequest:
      type: object
      required:
        - voteType
      properties:
        voteType:
          type: string
          enum:
            - like
            - dislike
    ReportReviewRequest:
      type: object
