openapi: 3.1.0
info:
  title: StuHelper API
  version: 1.0.0
  description: StuHelper 学习助手平台 API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://127.0.0.1:8080
    description: Development
  - url: https://api.stuhelper.com
    description: Production
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Health
    description: 健康检查
  - name: Auth
    description: 认证与授权
  - name: Academics
    description: 教务数据导入与展示
  - name: Resource
    description: 校园资源共享
  - name: Storage
    description: 存储挂载与驱动管理
  - name: Course
    description: 课程实体
  - name: Review
    description: 测评
  - name: Rating
    description: 评分统计
  - name: Notification
    description: 通知
  - name: Draft
    description: 草稿
  - name: Favorite
    description: 收藏
  - name: User
    description: 用户中心
  - name: Admission
    description: QQ 入群认证与新生身份审核
  - name: Bot
    description: 机器人内部接口
  - name: Identity
    description: 实名认证
  - name: Profile
    description: 学生认证
  - name: OpenPlatform
    description: 开放平台 OAuth 授权、scope consent 与用户信息披露
  - name: Admin
    description: 管理后台
  - name: Metrics
    description: 前端可观测性指标上报
paths:
  /health/live:
    get:
      tags:
        - Health
      operationId: healthLive
      summary: 存活探针
      description: Kubernetes 使用此端点判断是否需要重启容器
      security: []
      responses:
        '200':
          description: 应用正在运行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - status
                          - timestamp
                        properties:
                          status:
                            type: string
                            example: ok
                          timestamp:
                            type: string
                            format: date-time
        '404':
          description: 路径不存在
  /health/ready:
    get:
      tags:
        - Health
      operationId: healthReady
      summary: 就绪探针
      description: Kubernetes 使用此端点判断是否将流量路由到此实例
      security: []
      responses:
        '200':
          description: 应用就绪，可接收流量
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - status
                          - timestamp
                        properties:
                          status:
                            type: string
                            enum:
                              - ok
                              - degraded
                          checks:
                            type: object
                            description: 各依赖检查结果（仅开发环境返回）
                            additionalProperties:
                              type: object
                              properties:
                                status:
                                  type: string
                                latency:
                                  type: string
                                error:
                                  type: string
                          info:
                            type: object
                            description: 系统信息（仅开发环境返回）
                            additionalProperties: true
                          timestamp:
                            type: string
                            format: date-time
        '404':
          description: 路径不存在
        '503':
          description: 服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBody'
  /api/v1/auth/login:
    get:
      tags:
        - Auth
      operationId: getLoginURL
      summary: 获取 SSO 登录 URL
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: 登录完成后的前端回跳地址；支持以 `/` 开头的站内相对路径，或命中服务端 allowlist 的绝对 URL。
          schema:
            type: string
            format: uri-reference
        - name: platform
          in: query
          required: false
          description: 登录发起平台；`native` 会把 callback 标记为 deep-link 回传流程，其他值按 Web 处理。
          schema:
            type: string
            enum:
              - web
              - native
        - name: app
          in: query
          required: false
          description: 发起登录的一方应用；默认 `web`，原生流程默认 `uniapp`。
          schema:
            type: string
            enum:
              - web
              - admin
              - uniapp
      responses:
        '200':
          description: 返回 Casdoor OIDC 授权 URL 和 state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - url
                          - state
                        properties:
                          url:
                            type: string
                            format: uri
                          state:
                            type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/signup:
    get:
      tags:
        - Auth
      operationId: getSignupURL
      summary: 获取 SSO 注册 URL
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: 注册完成后的前端回跳地址；支持以 `/` 开头的站内相对路径，或命中服务端 allowlist 的绝对 URL。
          schema:
            type: string
            format: uri-reference
        - name: platform
          in: query
          required: false
          description: 注册发起平台；`native` 会把 callback 标记为 deep-link 回传流程，其他值按 Web 处理。
          schema:
            type: string
            enum:
              - web
              - native
        - name: app
          in: query
          required: false
          description: 发起注册的一方应用；默认 `web`，原生流程默认 `uniapp`。
          schema:
            type: string
            enum:
              - web
              - admin
              - uniapp
      responses:
        '200':
          description: 返回 Casdoor OIDC 授权 URL 和 state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - url
                          - state
                        properties:
                          url:
                            type: string
                            format: uri
                          state:
                            type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/step-up:
    get:
      tags:
        - Auth
      operationId: getStepUpURL
      summary: 获取 MFA step-up 重认证 URL
      description: |
        已登录会话在访问敏感操作收到 `412 step_up_required` 后调用本端点。
        服务端生成带 `prompt=login`、`max_age=0`、`acr_values=mfa` 的 Casdoor OIDC authorize URL，
        并复用 `/api/v1/auth/callback` 完成真实 code exchange 和新 token 写入。

        本端点只发起真实 OIDC reauth，不签发本地伪 `mfa_proof`。如果 Casdoor 未签发可用
        `amr` / `auth_time` claim，后续 MFA gate 仍会 fail-closed。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: step-up 完成后的前端回跳地址；支持以 `/` 开头的站内相对路径，或命中服务端 allowlist 的绝对 URL。
          schema:
            type: string
            format: uri-reference
        - name: platform
          in: query
          required: false
          description: step-up 发起平台；`native` 会把 callback 标记为 deep-link 回传流程，其他值按 Web 处理。
          schema:
            type: string
            enum:
              - web
              - native
            x-enum-varnames:
              - GetStepUpURLParamsPlatformWeb
              - GetStepUpURLParamsPlatformNative
      responses:
        '200':
          description: 返回 Casdoor OIDC step-up 授权 URL 和 state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/LoginURLResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/callback:
    get:
      tags:
        - Auth
      operationId: handleCallback
      summary: 处理 OIDC 回调并完成 302 跳转
      description: |
        服务端消费一次性 state 后完成 OIDC code exchange。
        - Web/H5 state：写入会话 cookie，然后 302 到前端页面
        - Native state：不写 cookie，而是 302 到 `stuhelper://auth/callback?...` deep link 交回 App
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: 登录成功后的重定向；Web/H5 返回前端 URL，native 返回 `stuhelper://auth/callback?...` deep link
          headers:
            Location:
              description: Web/H5 为前端回跳地址；native 为 App deep link
              schema:
                type: string
                format: uri-reference
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: 刷新 Access Token
      description: |
        支持两种传递 refresh token 的方式：
        - **Web 浏览器**：通过 HttpOnly cookie 自动携带（cookieAuth）
        - **原生 App**：通过请求体 JSON 传递（无 cookie 环境）

        原生 App 请求时，响应额外包含 accessToken 和 refreshToken 字段，
        供客户端更新本地存储。
        如果 token 来源于 `/api/v1/auth/exchange-native`，客户端还必须在请求头
        `X-Stuhelper-Session-ID` 中回传交换时获得的 session ID，以便服务端在
        refresh rotation 时继续追踪同一 session family。
      security:
        - cookieAuth: []
        - {}
      parameters:
        - $ref: '#/components/parameters/NativeSessionIDHeader'
      requestBody:
        description: 原生 App 通过请求体传递 refresh token（Web 浏览器通过 cookie 自动携带，无需此字段）
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: 原生 App 的 refresh token
      responses:
        '200':
          description: Token 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - message
                          - expiresIn
                        properties:
                          message:
                            type: string
                          expiresIn:
                            type: integer
                          accessToken:
                            type: string
                            description: 仅原生 App 请求时返回
                          refreshToken:
                            type: string
                            description: 仅原生 App 请求时返回
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: 获取当前用户信息
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: 登出当前设备
      description: |
        浏览器请求通过服务端 `session_id` cookie 定位会话。
        原生 OIDC 客户端如果没有 `session_id` cookie，必须在请求头
        `X-Stuhelper-Session-ID` 中回传交换时获得的 session ID。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/NativeSessionIDHeader'
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageData'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/logout-all:
    post:
      tags:
        - Auth
      operationId: logoutAll
      summary: 全设备登出
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: 全设备登出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageData'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/admin/auth/account-locks/unlock:
    post:
      tags:
        - Admin
      operationId: unlockAuthAccount
      summary: 解除认证失败账户锁
      description: 仅允许具备全局 user:system:update 能力的管理员清除手机号维度的认证失败软锁 / 硬锁；审计日志只记录脱敏账户。
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnlockAuthAccountRequest'
      responses:
        '200':
          description: 账户锁已清除
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageData'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/exchange-native:
    post:
      tags:
        - Auth
      operationId: exchangeNative
      summary: 原生 App 令牌交换（用一次性 state 换取 token）
      description: |
        原生 App 完成浏览器 SSO 后，通过 deep link 回传 code + state，
        由本端点完成 code → token 交换并以 JSON 返回（不写 cookie）。
        PKCE `code_verifier` 只保存在服务端 Redis，并随 state 一次性消费，客户端无需传递。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - state
              properties:
                code:
                  type: string
                  description: OIDC authorization code
                state:
                  type: string
                  description: 登录时生成的一次性 state（同时用于服务端查找并消费 PKCE verifier）
      responses:
        '200':
          description: 令牌交换成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - accessToken
                          - refreshToken
                          - sessionID
                          - expiresIn
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          sessionID:
                            type: string
                            description: 原生会话唯一标识；refresh 时用于保留 token family 追踪语义
                          expiresIn:
                            type: integer
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/open-platform/authorize:
    get:
      tags:
        - OpenPlatform
      operationId: openPlatformAuthorize
      summary: 发起开放平台授权
      description: |
        第三方应用发起 StuHelper Connect 登录时调用。若用户已授予全部 scope，
        返回 Casdoor OIDC authorize URL；否则返回 StuHelper 授权确认页 URL 和本次请求的字段清单。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: client_id
          in: query
          required: true
          schema:
            type: string
        - name: redirect_uri
          in: query
          required: true
          schema:
            type: string
            format: uri
        - name: scope
          in: query
          required: true
          description: 空格分隔的开放平台 scope。
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: 已授权时返回 redirectURL，需授权时返回 consentURL 和 scopes。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/OpenPlatformAuthorizeResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/open-platform/consent:
    get:
      tags:
        - OpenPlatform
      operationId: getOpenPlatformConsent
      summary: 获取开放平台授权页数据
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 授权页展示所需的应用信息、scope 字段说明和回调地址。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/OpenPlatformConsentPage'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/open-platform/consent/accept:
    post:
      tags:
        - OpenPlatform
      operationId: acceptOpenPlatformConsent
      summary: 同意开放平台授权
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenPlatformConsentDecisionRequest'
      responses:
        '200':
          description: 返回允许后的第三方 redirect URL。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/OpenPlatformRedirectResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/open-platform/consent/deny:
    post:
      tags:
        - OpenPlatform
      operationId: denyOpenPlatformConsent
      summary: 拒绝开放平台授权
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenPlatformConsentDecisionRequest'
      responses:
        '200':
          description: 返回带 access_denied 的第三方 redirect URL。
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/OpenPlatformRedirectResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/open-platform/userinfo:
    get:
      tags:
        - OpenPlatform
      operationId: getOpenPlatformUserInfo
      summary: 获取授权用户基本信息
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DisclosureRedirectURI'
        - $ref: '#/components/parameters/DisclosureScope'
        - $ref: '#/components/parameters/ConsentBaseURL'
      responses:
        '200':
          $ref: '#/components/responses/DisclosureResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '412':
          $ref: '#/components/responses/ConsentRequired'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/open-platform/verification:
    get:
      tags:
        - OpenPlatform
      operationId: getOpenPlatformVerification
      summary: 获取授权用户实名认证状态
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DisclosureRedirectURI'
        - $ref: '#/components/parameters/DisclosureScope'
        - $ref: '#/components/parameters/ConsentBaseURL'
      responses:
        '200':
          $ref: '#/components/responses/DisclosureResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '412':
          $ref: '#/components/responses/ConsentRequired'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/open-platform/student:
    get:
      tags:
        - OpenPlatform
      operationId: getOpenPlatformStudent
      summary: 获取授权用户学生认证信息
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/DisclosureRedirectURI'
        - $ref: '#/components/parameters/DisclosureScope'
        - $ref: '#/components/parameters/ConsentBaseURL'
      responses:
        '200':
          $ref: '#/components/responses/DisclosureResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
