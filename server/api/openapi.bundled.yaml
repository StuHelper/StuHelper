components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErrorResponse:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseBody'
  schemas:
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          enum:
            - true
    ErrorResponseBody:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          $ref: '#/components/schemas/APIError'
    APIError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: A00400
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    MessageData:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    LoginURLResponse:
      type: object
      required:
        - url
        - state
      properties:
        url:
          type: string
          format: uri
        state:
          type: string
          description: OAuth state parameter for CSRF protection
    CallbackResponse:
      type: object
      required:
        - user
        - expiresIn
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
        expiresIn:
          type: integer
          description: Access token TTL in seconds
    RefreshResponse:
      type: object
      required:
        - expiresIn
      properties:
        expiresIn:
          type: integer
    UserInfo:
      type: object
      required:
        - id
        - name
        - displayName
        - roles
        - capabilities
        - globalCapabilities
        - capabilityGrants
        - canAccessAdmin
        - isPlatformAdmin
      properties:
        id:
          type: string
        name:
          type: string
        displayName:
          type: string
        avatar:
          type: string
        email:
          type: string
        roles:
          type: array
          items:
            type: string
          description: OIDC Token 中解析出的粗粒度角色列表
        isPlatformAdmin:
          type: boolean
