components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ErrorResponse:
      description: 统一错误响应
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponseBody'
  schemas:
    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          enum:
            - true
    ErrorResponseBody:
      type: object
      required:
        - success
        - error
      properties:
        success:
          type: boolean
          enum:
            - false
        error:
          $ref: '#/components/schemas/APIError'
    APIError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: A00400
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    MessageData:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    LoginURLResponse:
      type: object
      required:
        - url
        - state
      properties:
        url:
          type: string
          format: uri
        state:
          type: string
          description: OAuth state parameter for CSRF protection
    CallbackResponse:
      type: object
      required:
        - user
        - expiresIn
      properties:
        user:
          $ref: '#/components/schemas/UserInfo'
        expiresIn:
          type: integer
          description: Access token TTL in seconds
    RefreshResponse:
      type: object
      required:
        - expiresIn
      properties:
        expiresIn:
          type: integer
    UserInfo:
      type: object
      required:
        - id
        - name
        - displayName
      properties:
        id:
          type: string
        name:
          type: string
        displayName:
          type: string
        avatar:
          type: string
        email:
          type: string
        isAdmin:
          type: boolean
    Course:
      type: object
      required:
        - id
        - name
        - credits
        - departmentID
        - reviewCount
      properties:
        id:
          type: integer
          format: int64
        schoolID:
          type: integer
          format: int64
        departmentID:
          type: integer
          format: int64
        departmentName:
          type: string
        code:
          type: string
        name:
          type: string
        credits:
          type: number
          format: double
        category:
          type: string
        reviewCount:
          type: integer
    Department:
      type: object
      required:
        - id
        - name
        - category
      properties:
        id:
          type: integer
          format: int64
        schoolID:
          type: integer
          format: int64
        name:
          type: string
        shortName:
          type: string
        category:
          type: string
        sortOrder:
          type: integer
    CourseCategory:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          format: int64
        schoolID:
          type: integer
          format: int64
        name:
          type: string
        sortOrder:
          type: integer
    FavoriteCourse:
      type: object
      required:
        - id
        - name
        - credits
        - departmentID
        - reviewCount
        - favoritedAt
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        code:
          type: string
        credits:
          type: number
          format: double
        departmentID:
          type: integer
          format: int64
        departmentName:
          type: string
        reviewCount:
          type: integer
        favoritedAt:
          type: string
          format: date-time
    CourseStats:
      type: object
      required:
        - courseCount
        - departmentCount
      properties:
        courseCount:
          type: integer
        departmentCount:
          type: integer
    Review:
      type: object
      required:
        - id
        - courseID
        - content
        - ratings
        - likeCount
        - dislikeCount
        - replyCount
        - status
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        courseID:
          type: integer
          format: int64
        courseName:
          type: string
        teacherID:
          type: integer
          format: int64
          nullable: true
        teacherName:
          type: string
        termID:
          type: string
        termName:
          type: string
        title:
          type: string
        content:
          type: string
        grade:
          type: string
          enum:
            - A+
            - A
            - A-
            - B+
            - B
            - B-
            - C+
            - C
            - C-
            - D
            - F
        ratings:
          $ref: '#/components/schemas/ReviewRatings'
        likeCount:
          type: integer
        dislikeCount:
          type: integer
        replyCount:
          type: integer
        status:
          type: string
          enum:
            - published
            - hidden
            - deleted
        moderationReason:
          type: string
          nullable: true
          description: 屏蔽原因（仅 hidden 状态时存在）
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ReviewRatings:
      type: object
      additionalProperties:
        type: integer
        minimum: 1
        maximum: 5
      description: Map of dimension key to rating value (1-5)
    PostReviewRequest:
      type: object
      required:
        - courseID
        - content
        - ratings
      properties:
        courseID:
          type: integer
          format: int64
          minimum: 1
        teacherID:
          type: integer
          format: int64
          minimum: 1
        termID:
          type: string
          maxLength: 20
          pattern: ^\d{4}-[12]$
        title:
          type: string
          maxLength: 200
        content:
          type: string
          minLength: 10
          maxLength: 5000
        grade:
          type: string
          enum:
            - A+
            - A
            - A-
            - B+
            - B
            - B-
            - C+
            - C
            - C-
            - D
            - F
        ratings:
          $ref: '#/components/schemas/ReviewRatings'
    UpdateReviewRequest:
      type: object
      required:
        - content
        - ratings
      properties:
        title:
          type: string
          maxLength: 200
        content:
          type: string
          minLength: 10
          maxLength: 5000
        grade:
          type: string
          enum:
            - A+
            - A
            - A-
            - B+
            - B
            - B-
            - C+
            - C
            - C-
            - D
            - F
        ratings:
          $ref: '#/components/schemas/ReviewRatings'
    VoteRequest:
      type: object
      required:
        - voteType
      properties:
        voteType:
          type: string
          enum:
            - like
            - dislike
    ReportReviewRequest:
      type: object
      required:
        - reason
      properties:
        reason:
          type: string
          enum:
            - spam
            - inappropriate
            - harassment
            - false_info
            - other
        description:
          type: string
          maxLength: 500
    Reply:
      type: object
      required:
        - id
        - reviewID
        - content
        - likeCount
        - status
        - isOwner
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        reviewID:
          type: string
          format: uuid
        parentID:
          type: string
          format: uuid
          nullable: true
        content:
          type: string
        likeCount:
          type: integer
        status:
          type: string
        isOwner:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateReplyRequest:
      type: object
      required:
        - content
      properties:
        parentID:
          type: string
          format: uuid
        content:
          type: string
          minLength: 1
          maxLength: 1000
    ReviewDraft:
      type: object
      required:
        - id
        - courseID
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        courseID:
          type: integer
          format: int64
        teacherID:
          type: integer
          format: int64
          nullable: true
        termID:
          type: string
        title:
          type: string
        content:
          type: string
        grade:
          type: string
        ratings:
          $ref: '#/components/schemas/ReviewRatings'
        updatedAt:
          type: string
          format: date-time
    SaveDraftRequest:
      type: object
      required:
        - courseID
      properties:
        courseID:
          type: integer
          format: int64
          minimum: 1
        teacherID:
          type: integer
          format: int64
          minimum: 1
        termID:
          type: string
          maxLength: 20
          pattern: ^\d{4}-[12]$
        title:
          type: string
          maxLength: 200
        content:
          type: string
          maxLength: 5000
        grade:
          type: string
          enum:
            - A+
            - A
            - A-
            - B+
            - B
            - B-
            - C+
            - C
            - C-
            - D
            - F
        ratings:
          $ref: '#/components/schemas/ReviewRatings'
    ContentCheckRequest:
      type: object
      required:
        - content
      properties:
        content:
          type: string
    ContentCheckResult:
      type: object
      required:
        - isValid
      properties:
        isValid:
          type: boolean
        level:
          type: string
          enum:
            - block
            - warn
        matchCount:
          type: integer
    QualityCheckResult:
      type: object
      properties:
        score:
          type: integer
          minimum: 0
          maximum: 100
        suggestions:
          type: array
          items:
            type: string
    ContentCheckResponse:
      type: object
      properties:
        sensitive:
          $ref: '#/components/schemas/ContentCheckResult'
        quality:
          $ref: '#/components/schemas/QualityCheckResult'
    HotCourse:
      type: object
      required:
        - courseID
        - courseName
        - reviewCount
        - avgRating
      properties:
        courseID:
          type: integer
          format: int64
        courseName:
          type: string
        reviewCount:
          type: integer
        avgRating:
          type: number
          format: double
    ReviewStats:
      type: object
      required:
        - courseCount
        - reviewCount
        - departmentCount
      properties:
        courseCount:
          type: integer
        reviewCount:
          type: integer
        departmentCount:
