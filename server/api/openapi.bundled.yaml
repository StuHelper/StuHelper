      tags:
        - OpenPlatform
      operationId: revokeOpenPlatformConsent
      summary: 撤销当前用户授予某个开放平台应用的授权
      description: |
        不传 scope 时撤销当前用户对该应用的全部 active 授权；传 `scope` 查询参数时只撤销指定 scope。
        撤销后下一次 disclosure / UserInfo 会立即重新进入 consent required。
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: appID
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: scope
          in: query
          required: false
          description: 可重复传入的开放平台 scope；为空时撤销该 app 全部授权。
          schema:
            type: array
            items:
              $ref: '#/components/schemas/OpenPlatformScope'
          style: form
          explode: true
