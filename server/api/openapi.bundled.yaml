  parameters:
    PageParam:
      name: page
      in: query
      description: 页码
      schema:
        type: integer
        default: 1
        minimum: 1
    PageSizeParam:
      name: pageSize
      in: query
      description: 每页数量
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    CourseIDPath:
      name: courseID
      in: path
      required: true
      description: 课程 ID
      schema:
        type: integer
        format: int64
    ReviewIDPath:
      name: reviewID
      in: path
      required: true
      description: 测评 ID
      schema:
        type: string
        format: uuid
    TeacherIDPath:
      name: teacherID
      in: path
      required: true
      description: 教师 ID
      schema:
        type: integer
        format: int64
    NotificationIDPath:
      name: notificationID
      in: path
      required: true
      description: 通知 ID
      schema:
        type: string
        format: uuid
    ReplyIDPath:
      name: replyID
      in: path
      required: true
      description: 回复 ID
      schema:
        type: string
        format: uuid
    ReportIDPath:
      name: reportID
      in: path
      required: true
      description: 举报 ID
      schema:
        type: string
        format: uuid
    SensitiveWordIDPath:
      name: sensitiveWordID
      in: path
      required: true
      description: 敏感词 ID
      schema:
        type: string
        format: uuid
    NativeSessionIDHeader:
      name: X-Stuhelper-Session-ID
      in: header
      required: false
      description: 原生 OIDC 客户端在 `exchange-native` 后拿到的服务端 session ID，用于 refresh/logout 保持同一 token family 追踪
      schema:
        type: string
    DisclosureRedirectURI:
      name: redirect_uri
      in: query
      required: true
      schema:
        type: string
        format: uri
    DisclosureScope:
      name: scope
      in: query
      required: true
      description: 空格分隔的开放平台 scope。
      schema:
        type: string
    ConsentBaseURL:
      name: consent_base_url
      in: query
      required: false
      description: 第三方客户端希望用户跳转查看授权页时使用的前端 base URL；为空时返回站内相对地址。
      schema:
        type: string
        format: uri-reference
    OfferingIDPath:
      name: offeringID
      in: path
      required: true
      description: 开课实例 ID
      schema:
        type: integer
        format: int64
    ResourceIDPath:
      name: resourceID
      in: path
      required: true
      description: 资源 ID
      schema:
        type: integer
        format: int64
    MountIDPath:
      name: mountID
      in: path
      required: true
      description: 存储挂载点 ID
      schema:
        type: integer
        format: int64
