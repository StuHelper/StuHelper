openapi: 3.0.3
info:
  title: StuHelper API
  version: 1.0.0
  description: StuHelper 学习助手平台 API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://localhost:8080
    description: Development
  - url: https://api.stuhelper.com
    description: Production
tags:
  - name: Health
    description: 健康检查
  - name: Auth
    description: 认证与授权
  - name: Course
    description: 课程实体
  - name: Review
    description: 测评
  - name: Rating
    description: 评分统计
  - name: Notification
    description: 通知
  - name: Draft
    description: 草稿
  - name: Favorite
    description: 收藏
  - name: User
    description: 用户中心
  - name: Admin
    description: 管理后台
paths:
  /health/live:
    get:
      tags:
        - Health
      operationId: healthLive
      summary: 存活探针
      description: Kubernetes 使用此端点判断是否需要重启容器
      security: []
      responses:
        '200':
          description: 应用正在运行
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                properties:
                  status:
                    type: string
                    example: ok
                  timestamp:
                    type: string
                    format: date-time
        '404':
          description: 路径不存在
  /health/ready:
    get:
      tags:
        - Health
      operationId: healthReady
      summary: 就绪探针
      description: Kubernetes 使用此端点判断是否将流量路由到此实例
      security: []
      responses:
        '200':
          description: 应用就绪，可接收流量
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                properties:
                  status:
                    type: string
                    enum:
                      - ok
                      - degraded
                  checks:
                    type: object
                    description: 各依赖检查结果（仅开发环境返回）
                    additionalProperties:
                      type: object
                      properties:
                        status:
                          type: string
                        latency:
                          type: string
                        error:
                          type: string
                  info:
                    type: object
                    description: 系统信息（仅开发环境返回）
                    additionalProperties: true
                  timestamp:
                    type: string
                    format: date-time
        '404':
          description: 路径不存在
        '503':
          description: 服务不可用
          content:
            application/json:
              schema:
                type: object
                required:
                  - status
                  - timestamp
                properties:
                  status:
                    type: string
                    example: degraded
                  timestamp:
                    type: string
                    format: date-time
  /api/v1/auth/login:
    get:
      tags:
        - Auth
      operationId: getLoginURL
      summary: 获取 SSO 登录 URL
      security: []
      responses:
        '200':
          description: 返回 Casdoor 登录 URL 和 state
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - url
                      - state
                    properties:
                      url:
                        type: string
                        format: uri
                      state:
                        type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/signup:
    get:
      tags:
        - Auth
      operationId: getSignupURL
      summary: 获取 SSO 注册 URL
      security: []
      responses:
        '200':
          description: 返回 Casdoor 注册 URL 和 state
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - url
                      - state
                    properties:
                      url:
                        type: string
                        format: uri
                      state:
                        type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/callback:
    get:
      tags:
        - Auth
      operationId: handleCallback
      summary: 处理 OAuth 回调
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 登录成功，返回用户信息和 token 过期时间
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - user
                      - expiresIn
                    properties:
                      user:
                        type: object
                        required:
                          - id
                          - name
                          - displayName
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          displayName:
                            type: string
                          email:
                            type: string
                          avatar:
                            type: string
                      expiresIn:
                        type: integer
                        description: Access token TTL（秒）
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: 刷新 Access Token
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Token 刷新成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - message
                      - expiresIn
                    properties:
                      message:
                        type: string
                      expiresIn:
                        type: integer
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: 获取当前用户信息
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - id
                      - name
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      email:
                        type: string
                      displayName:
                        type: string
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: 登出当前设备
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - message
                      - ssoLogoutURL
                    properties:
                      message:
                        type: string
                      ssoLogoutURL:
                        type: string
                        format: uri
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/logout-all:
    post:
      tags:
        - Auth
      operationId: logoutAll
      summary: 全设备登出
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: 全设备登出成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/MessageData'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/departments:
    get:
      tags:
        - Course
      operationId: getDepartments
      summary: 获取院系列表
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: 按分类筛选
      responses:
        '200':
          description: 院系列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/categories:
    get:
      tags:
        - Course
      operationId: getCourseCategories
      summary: 获取课程分类列表
      security: []
      responses:
        '200':
          description: 课程分类列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseCategory'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/courses:
    get:
      tags:
        - Course
      operationId: getCourses
      summary: 获取课程列表
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: departmentID
          in: query
          schema:
            type: integer
            format: int64
          description: 按院系筛选
        - name: category
          in: query
          schema:
            type: string
          description: 按分类筛选
      responses:
        '200':
          description: 课程分页列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/Course'
                      total:
                        type: integer
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/courses/search:
    get:
      tags:
        - Course
      operationId: searchCourses
      summary: 搜索课程
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: 搜索关键词
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/Course'
                      total:
                        type: integer
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/courses/{id}:
    get:
      tags:
        - Course
      operationId: getCourse
      summary: 获取课程详情
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseIDPath'
      responses:
        '200':
          description: 课程详情
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/stats:
    get:
      tags:
        - Course
      operationId: getCourseStats
      summary: 获取学习中心统计
      security: []
      responses:
        '200':
          description: 统计数据
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/CourseStats'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/rating-dimensions:
    get:
      tags:
        - Rating
      operationId: getRatingDimensions
      summary: 获取评分维度配置
      security: []
      responses:
        '200':
          description: 评分维度列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/RatingDimension'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/courses/{id}/rating-stats:
    get:
      tags:
        - Rating
      operationId: getCourseRatingStats
      summary: 获取课程评分统计（雷达图数据）
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseIDPath'
      responses:
        '200':
          description: 课程评分统计
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/CourseRatingStatsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/courses/{id}/rating-trend:
    get:
      tags:
        - Rating
      operationId: getRatingTrend
      summary: 获取课程评分趋势
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseIDPath'
      responses:
        '200':
          description: 评分趋势数据
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - trend
                    properties:
                      trend:
                        type: array
                        items:
                          $ref: '#/components/schemas/RatingTrendItem'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/courses/{id}/teachers:
    get:
      tags:
        - Rating
      operationId: getCourseTeachers
      summary: 获取课程的授课教师列表
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseIDPath'
      responses:
        '200':
          description: 教师统计列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CourseTeacherStats'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/courses/{id}/reviews:
    get:
      tags:
        - Review
      operationId: getCourseReviews
      summary: 获取课程测评列表（支持可选认证）
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIDPath'
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - time
              - likes
              - rating
            default: time
        - name: termID
          in: query
          schema:
            type: string
          description: 按学期筛选
        - name: teacherID
          in: query
          schema:
            type: integer
            format: int64
          description: 按教师筛选
      responses:
        '200':
          description: 测评分页列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/Review'
                      total:
                        type: integer
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/reviews/latest:
    get:
      tags:
        - Review
      operationId: getLatestReviews
      summary: 获取最新测评（支持可选认证）
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - time
              - likes
              - rating
            default: time
      responses:
        '200':
          description: 最新测评分页列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    required:
                      - list
                      - total
                    properties:
                      list:
                        type: array
                        items:
                          $ref: '#/components/schemas/Review'
                      total:
                        type: integer
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/reviews/batch:
    get:
      tags:
        - Review
      operationId: getBatchCourseReviews
      summary: 批量获取多个课程的测评列表（支持可选认证）
      description: 通过逗号分隔的课程ID列表批量获取测评，避免N+1查询
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - name: courseIDs
          in: query
          required: true
          schema:
            type: string
          description: 逗号分隔的课程ID列表（最多20个）
          example: 1,2,3
        - $ref: '#/components/parameters/PageSizeParam'
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - time
              - likes
              - rating
            default: time
      responses:
        '200':
          description: 按课程ID分组的测评列表
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    type: object
                    additionalProperties:
                      type: object
                      required:
                        - list
                        - total
                      properties:
                        list:
                          type: array
                          items:
                            $ref: '#/components/schemas/Review'
                        total:
                          type: integer
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/reviews:
    post:
      tags:
        - Review
      operationId: postReview
      summary: 发布测评
      security:
        - cookieAuth: []
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostReviewRequest'
      responses:
        '201':
          description: 测评发布成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/Review'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/reviews/{id}:
    put:
      tags:
        - Review
      operationId: updateReview
      summary: 更新测评
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReviewIDPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateReviewRequest'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/MessageData'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - Review
      operationId: deleteReview
      summary: 删除测评
      security:
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ReviewIDPath'
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                type: object
                required:
                  - success
                  - data
                properties:
                  success:
                    type: boolean
                    enum:
                      - true
                  data:
                    $ref: '#/components/schemas/MessageData'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/reviews/{id}/votes:
    post:
