openapi: 3.1.0
info:
  title: StuHelper API
  version: 1.0.0
  description: StuHelper 学习助手平台 API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
  - url: http://127.0.0.1:8080
    description: Development
  - url: https://api.stuhelper.com
    description: Production
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Health
    description: 健康检查
  - name: Auth
    description: 认证与授权
  - name: Course
    description: 课程实体
  - name: Review
    description: 测评
  - name: Rating
    description: 评分统计
  - name: Notification
    description: 通知
  - name: Draft
    description: 草稿
  - name: Favorite
    description: 收藏
  - name: User
    description: 用户中心
  - name: Identity
    description: 实名认证
  - name: Profile
    description: 学生认证
  - name: Admin
    description: 管理后台
  - name: Metrics
    description: 前端可观测性指标上报
paths:
  /health/live:
    get:
      tags:
        - Health
      operationId: healthLive
      summary: 存活探针
      description: Kubernetes 使用此端点判断是否需要重启容器
      security: []
      responses:
        '200':
          description: 应用正在运行
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - status
                          - timestamp
                        properties:
                          status:
                            type: string
                            example: ok
                          timestamp:
                            type: string
                            format: date-time
        '404':
          description: 路径不存在
  /health/ready:
    get:
      tags:
        - Health
      operationId: healthReady
      summary: 就绪探针
      description: Kubernetes 使用此端点判断是否将流量路由到此实例
      security: []
      responses:
        '200':
          description: 应用就绪，可接收流量
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - status
                          - timestamp
                        properties:
                          status:
                            type: string
                            enum:
                              - ok
                              - degraded
                          checks:
                            type: object
                            description: 各依赖检查结果（仅开发环境返回）
                            additionalProperties:
                              type: object
                              properties:
                                status:
                                  type: string
                                latency:
                                  type: string
                                error:
                                  type: string
                          info:
                            type: object
                            description: 系统信息（仅开发环境返回）
                            additionalProperties: true
                          timestamp:
                            type: string
                            format: date-time
        '404':
          description: 路径不存在
        '503':
          description: 服务不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseBody'
  /api/v1/auth/login:
    get:
      tags:
        - Auth
      operationId: getLoginURL
      summary: 获取 SSO 登录 URL
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: 登录完成后的前端回跳地址（绝对 URL）
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: 返回 Zitadel OIDC 授权 URL 和 state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - url
                          - state
                        properties:
                          url:
                            type: string
                            format: uri
                          state:
                            type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/signup:
    get:
      tags:
        - Auth
      operationId: getSignupURL
      summary: 获取 SSO 注册 URL
      security: []
      parameters:
        - name: redirect
          in: query
          required: false
          description: 注册完成后的前端回跳地址（绝对 URL）
          schema:
            type: string
            format: uri
      responses:
        '200':
          description: 返回 Zitadel OIDC 授权 URL 和 state
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - url
                          - state
                        properties:
                          url:
                            type: string
                            format: uri
                          state:
                            type: string
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/callback:
    get:
      tags:
        - Auth
      operationId: handleCallback
      summary: 处理 OIDC 回调并重定向回前端
      security: []
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        '302':
          description: 登录成功，写入 Cookie 后重定向到前端页面
          headers:
            Location:
              description: 前端回跳地址
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/refresh:
    post:
      tags:
        - Auth
      operationId: refreshToken
      summary: 刷新 Access Token
      description: |
        支持两种传递 refresh token 的方式：
        - **Web 浏览器**：通过 HttpOnly cookie 自动携带（cookieAuth）
        - **原生 App**：通过请求体 JSON 传递（无 cookie 环境）

        原生 App 请求时，响应额外包含 accessToken 和 refreshToken 字段，
        供客户端更新本地存储。
      security:
        - cookieAuth: []
        - {}
      requestBody:
        description: 原生 App 通过请求体传递 refresh token（Web 浏览器通过 cookie 自动携带，无需此字段）
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: 原生 App 的 refresh token
      responses:
        '200':
          description: Token 刷新成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - message
                          - expiresIn
                        properties:
                          message:
                            type: string
                          expiresIn:
                            type: integer
                          accessToken:
                            type: string
                            description: 仅原生 App 请求时返回
                          refreshToken:
                            type: string
                            description: 仅原生 App 请求时返回
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/me:
    get:
      tags:
        - Auth
      operationId: getCurrentUser
      summary: 获取当前用户信息
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: 当前用户信息
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/UserInfo'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/logout:
    post:
      tags:
        - Auth
      operationId: logout
      summary: 登出当前设备
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageData'
        '401':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/logout-all:
    post:
      tags:
        - Auth
      operationId: logoutAll
      summary: 全设备登出
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: 全设备登出成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/MessageData'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/phone/request-otp:
    post:
      tags:
        - Auth
      operationId: requestPhoneOTP
      summary: 发送手机验证码
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
                  pattern: ^1[3-9]\d{9}$
                  description: 中国大陆手机号（11 位）
      responses:
        '200':
          description: 验证码发送成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - message
                          - cooldown
                        properties:
                          message:
                            type: string
                          cooldown:
                            type: integer
                            description: 冷却时间（秒）
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/phone/verify-otp:
    post:
      tags:
        - Auth
      operationId: verifyPhoneOTP
      summary: 验证手机验证码并登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                  pattern: ^1[3-9]\d{9}$
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  description: 6 位数字验证码
      responses:
        '200':
          description: 验证通过，登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - user
                          - expiresIn
                        properties:
                          user:
                            $ref: '#/components/schemas/UserInfo'
                          expiresIn:
                            type: integer
                            description: Access Token 有效期（秒）
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '503':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/auth/exchange-native:
    post:
      tags:
        - Auth
      operationId: exchangeNative
      summary: 原生 App 令牌交换（用一次性 state 换取 token）
      description: |
        原生 App 完成浏览器 SSO 后，通过 deep link 回传 code + state，
        由本端点完成 code → token 交换并以 JSON 返回（不写 cookie）。
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - state
              properties:
                code:
                  type: string
                  description: OIDC authorization code
                state:
                  type: string
                  description: 登录时生成的一次性 state
                code_verifier:
                  type: string
                  description: PKCE code verifier
      responses:
        '200':
          description: 令牌交换成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - accessToken
                          - expiresIn
                        properties:
                          accessToken:
                            type: string
                          refreshToken:
                            type: string
                          expiresIn:
                            type: integer
                          user:
                            type: object
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/departments:
    get:
      tags:
        - Course
      operationId: getDepartments
      summary: 获取院系列表
      security: []
      parameters:
        - name: category
          in: query
          schema:
            type: string
          description: 按分类筛选
      responses:
        '200':
          description: 院系列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Department'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/terms:
    get:
      tags:
        - Course
      operationId: getTerms
      summary: 获取学期列表
      security: []
      responses:
        '200':
          description: 学期列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/Term'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/categories:
    get:
      tags:
        - Course
      operationId: getCourseCategories
      summary: 获取课程分类列表
      security: []
      responses:
        '200':
          description: 课程分类列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CourseCategory'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/courses:
    get:
      tags:
        - Course
      operationId: getCourses
      summary: 获取课程列表
      security: []
      parameters:
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
        - name: q
          in: query
          schema:
            type: string
            maxLength: 100
          description: 按课程名称或课程代码搜索
        - name: departmentID
          in: query
          schema:
            type: integer
            format: int64
          description: 按院系筛选
        - name: category
          in: query
          schema:
            type: string
          description: 按分类筛选
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - name
              - credits
              - reviewCount
            default: name
          description: 排序方式
      responses:
        '200':
          description: 课程分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - list
                          - total
                        properties:
                          list:
                            type: array
                            items:
                              $ref: '#/components/schemas/Course'
                          total:
                            type: integer
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/courses/grouped:
    get:
      tags:
        - Course
      operationId: getCoursesGrouped
      summary: 按院系分组获取全部课程（课程目录页专用）
      security: []
      responses:
        '200':
          description: 按院系分组的课程列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - groups
                        properties:
                          groups:
                            type: array
                            items:
                              $ref: '#/components/schemas/DepartmentGroup'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/courses/search:
    get:
      tags:
        - Course
      operationId: searchCourses
      summary: 搜索课程
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: 搜索关键词
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/PageSizeParam'
      responses:
        '200':
          description: 搜索结果
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - list
                          - total
                        properties:
                          list:
                            type: array
                            items:
                              $ref: '#/components/schemas/Course'
                          total:
                            type: integer
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/courses/{courseID}:
    get:
      tags:
        - Course
      operationId: getCourse
      summary: 获取课程详情
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseIDPath'
      responses:
        '200':
          description: 课程详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/Course'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/stats:
    get:
      tags:
        - Course
      operationId: getCourseStats
      summary: 获取学习中心统计
      security: []
      responses:
        '200':
          description: 统计数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/CourseStats'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/rating-dimensions:
    get:
      tags:
        - Rating
      operationId: getRatingDimensions
      summary: 获取评分维度配置
      security: []
      responses:
        '200':
          description: 评分维度列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/RatingDimension'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/courses/{courseID}/rating-stats:
    get:
      tags:
        - Rating
      operationId: getCourseRatingStats
      summary: 获取课程评分统计（雷达图数据）
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseIDPath'
      responses:
        '200':
          description: 课程评分统计
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        $ref: '#/components/schemas/CourseRatingStatsResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/courses/{courseID}/rating-trend:
    get:
      tags:
        - Rating
      operationId: getRatingTrend
      summary: 获取课程评分趋势
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseIDPath'
      responses:
        '200':
          description: 评分趋势数据
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: object
                        required:
                          - trend
                        properties:
                          trend:
                            type: array
                            items:
                              $ref: '#/components/schemas/RatingTrendItem'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/courses/{courseID}/teachers:
    get:
      tags:
        - Rating
      operationId: getCourseTeachers
      summary: 获取课程的授课教师列表
      security: []
      parameters:
        - $ref: '#/components/parameters/CourseIDPath'
      responses:
        '200':
          description: 教师统计列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
                  - type: object
                    required:
                      - data
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '#/components/schemas/CourseTeacherStats'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
  /api/v1/course/review/courses/{courseID}/reviews:
    get:
      tags:
        - Review
      operationId: getCourseReviews
      summary: 获取课程测评列表（支持可选认证）
      security:
        - {}
        - cookieAuth: []
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/CourseIDPath'
        - $ref: '#/components/parameters/PageParam'
