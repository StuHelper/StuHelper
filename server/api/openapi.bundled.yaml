          in: query
          description: 导出格式。json 和 ndjson 均返回 NDJSON 流（每行一个 JSON 对象）
          schema:
            type: string
            enum:
              - json
              - ndjson
              - csv
            default: json
        - name: status
          in: query
          schema:
            type: string
            enum:
              - all
              - published
              - pending_review
              - hidden
              - deleted
            default: all
      responses:
        '200':
          description: |
            流式导出数据。NDJSON 格式每行一个 JSON 对象，末尾追加 `# EXPORT_COMPLETE` 标记行；
            CSV 格式包含 UTF-8 BOM 头，末尾同样追加完成标记。客户端应检查标记判断导出完整性。
          content:
            application/x-ndjson:
              schema:
                type: string
                description: 每行一个 Review JSON 对象，末尾 `# EXPORT_COMPLETE`
            text/csv:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
