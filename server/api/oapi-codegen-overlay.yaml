overlay: 1.0.0
x-speakeasy-jsonpath: rfc9535
info:
  title: StuHelper oapi-codegen compatibility overlay
  version: 1.0.0
actions:
  - target: "$.openapi"
    description: Downgrade the spec version for oapi-codegen's OpenAPI 3.0 parser only.
    update: "3.0.3"
  - target: "$.components.schemas.*.properties[?(@.type && length(@.type) == 2 && ((@.type[0] == 'string' && @.type[1] == 'null') || (@.type[0] == 'null' && @.type[1] == 'string')))]"
    description: Convert nullable string unions back to OpenAPI 3.0 nullable strings for Go codegen.
    update:
      type: string
      nullable: true
  - target: "$.components.schemas.*.properties[?(@.type && length(@.type) == 2 && ((@.type[0] == 'integer' && @.type[1] == 'null') || (@.type[0] == 'null' && @.type[1] == 'integer')))]"
    description: Convert nullable integer unions back to OpenAPI 3.0 nullable integers for Go codegen.
    update:
      type: integer
      nullable: true
  - target: "$.components.schemas.*.properties[?(@.type && length(@.type) == 2 && ((@.type[0] == 'number' && @.type[1] == 'null') || (@.type[0] == 'null' && @.type[1] == 'number')))]"
    description: Convert nullable number unions back to OpenAPI 3.0 nullable numbers for Go codegen.
    update:
      type: number
      nullable: true
  - target: "$.components.schemas.*.properties[?(@.type && length(@.type) == 2 && ((@.type[0] == 'array' && @.type[1] == 'null') || (@.type[0] == 'null' && @.type[1] == 'array')))]"
    description: Convert nullable array unions back to OpenAPI 3.0 nullable arrays for Go codegen.
    update:
      type: array
      nullable: true
  - target: "$.components.schemas.*.properties[?(@.type && length(@.type) == 2 && ((@.type[0] == 'object' && @.type[1] == 'null') || (@.type[0] == 'null' && @.type[1] == 'object')))]"
    description: Convert nullable object unions back to OpenAPI 3.0 nullable objects for Go codegen.
    update:
      type: object
      nullable: true
  - target: "$.components.schemas.MemberBlacklistEntry.properties.releasedByType"
    description: |
      Collapse the OAS 3.1 `oneOf: [$ref, type: null]` form into the
      OAS 3.0 `allOf + nullable: true` form so oapi-codegen accepts a
      nullable enum reference. Spec keeps the 3.1 form for Redocly lint
      and openapi-typescript; this overlay only retargets the Go path.
    update:
      oneOf: null
      allOf:
        - $ref: '#/components/schemas/MemberBlacklistActorType'
      nullable: true
  - target: "$.components.schemas.MemberBlacklistEntry.properties.releaseReasonCode"
    description: |
      Same nullable-$ref collapse as releasedByType, applied to the
      release reason code field.
    update:
      oneOf: null
      allOf:
        - $ref: '#/components/schemas/MemberBlacklistReleaseReasonCode'
      nullable: true
  - target: "$.paths['/api/v1/user/identity'].get.responses['200'].content['application/json'].schema.allOf[1].properties.data"
    description: Collapse nullable identity status response data for oapi-codegen.
    update:
      oneOf: null
      allOf:
        - $ref: '#/components/schemas/UserIdentity'
      nullable: true
  - target: "$.paths['/api/v1/user/qq-binding'].get.responses['200'].content['application/json'].schema.allOf[1].properties.data"
    description: Collapse nullable QQ binding response data for oapi-codegen.
    update:
      oneOf: null
      allOf:
        - $ref: '#/components/schemas/QQBinding'
      nullable: true
  - target: "$.paths['/api/v1/user/profile'].get.responses['200'].content['application/json'].schema.allOf[1].properties.data"
    description: Collapse nullable student profile response data for oapi-codegen.
    update:
      oneOf: null
      allOf:
        - $ref: '#/components/schemas/UserProfile'
      nullable: true
