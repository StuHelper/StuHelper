    $ref: "paths/review-teacher.yaml#/~1api~1v1~1course~1review~1teachers"
  /api/v1/course/review/teachers/hot:
    $ref: "paths/review-teacher.yaml#/~1api~1v1~1course~1review~1teachers~1hot"

