  # ── Metrics ──
  /api/v1/metrics/vitals:
    post:
      operationId: reportWebVitals
      summary: Report Web Vitals metrics
      tags: [Metrics]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value, rating]
              properties:
                name:
                  type: string
                  enum: [CLS, FCP, INP, LCP, TTFB]
                value:
                  type: number
                rating:
                  type: string
                  enum: [good, needs-improvement, poor]
          text/plain:
            schema:
              type: string
              maxLength: 1024
              description: JSON-encoded Web Vitals payload sent by navigator.sendBeacon.
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "components/responses/common.yaml#/ErrorResponse"

  /api/v1/metrics/frontend-errors:
    post:
      operationId: reportFrontendError
      summary: Report frontend errors
      tags: [Metrics]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [error, unhandledrejection, vue-error]
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "components/responses/common.yaml#/ErrorResponse"

