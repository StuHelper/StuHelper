openapi: 3.1.0
info:
  title: StuHelper API
  version: "1.0.0"
  description: StuHelper 学习助手平台 API
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://127.0.0.1:8080
    description: Development
  - url: https://api.stuhelper.com
    description: Production

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: Health
    description: 健康检查
  - name: Auth
    description: 认证与授权
  - name: Course
    description: 课程实体
  - name: Review
    description: 测评
  - name: Rating
    description: 评分统计
  - name: Notification
    description: 通知
  - name: Draft
    description: 草稿
  - name: Favorite
    description: 收藏
  - name: User
    description: 用户中心
  - name: Identity
    description: 实名认证
  - name: Profile
    description: 学生认证
  - name: Admin
    description: 管理后台
  - name: Metrics
    description: 前端可观测性指标上报

