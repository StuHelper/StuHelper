  /api/v1/course/review/admin/sensitive-words/{sensitiveWordID}:
    $ref: "paths/review-admin.yaml#/~1api~1v1~1course~1review~1admin~1sensitive-words~1{sensitiveWordID}"

  # ── User Identity & Profile ──
  /api/v1/user/identity:
    $ref: "paths/user-identity.yaml#/~1api~1v1~1user~1identity"
  /api/v1/user/identity/uploads:
    $ref: "paths/user-identity.yaml#/~1api~1v1~1user~1identity~1uploads"
  /api/v1/user/profile:
    $ref: "paths/user-identity.yaml#/~1api~1v1~1user~1profile"
  /api/v1/user/profile/verify:
    $ref: "paths/user-identity.yaml#/~1api~1v1~1user~1profile~1verify"
  /api/v1/user/profile/bind-phone/otp:
    $ref: "paths/user-identity.yaml#/~1api~1v1~1user~1profile~1bind-phone~1otp"
  /api/v1/user/profile/bind-phone:
    $ref: "paths/user-identity.yaml#/~1api~1v1~1user~1profile~1bind-phone"
  /api/v1/user/profile/academic-info:
    $ref: "paths/user-identity.yaml#/~1api~1v1~1user~1profile~1academic-info"
  /api/v1/user/schools:
    $ref: "paths/user-identity.yaml#/~1api~1v1~1user~1schools"
  /api/v1/user/me:
    $ref: "paths/user-identity.yaml#/~1api~1v1~1user~1me"

  # ── Admin: User System ──
  /api/v1/admin/identities:
    $ref: "paths/admin-user-system.yaml#/~1api~1v1~1admin~1identities"
  /api/v1/admin/identities/{userID}:
    $ref: "paths/admin-user-system.yaml#/~1api~1v1~1admin~1identities~1{userID}"
  /api/v1/admin/student-verifications:
    $ref: "paths/admin-user-system.yaml#/~1api~1v1~1admin~1student-verifications"
  /api/v1/admin/student-verifications/{userID}:
    $ref: "paths/admin-user-system.yaml#/~1api~1v1~1admin~1student-verifications~1{userID}"
  /api/v1/admin/school-configs:
    $ref: "paths/admin-user-system.yaml#/~1api~1v1~1admin~1school-configs"
  /api/v1/admin/school-configs/{schoolID}:
    $ref: "paths/admin-user-system.yaml#/~1api~1v1~1admin~1school-configs~1{schoolID}"
  /api/v1/admin/system-configs:
    $ref: "paths/admin-user-system.yaml#/~1api~1v1~1admin~1system-configs"
  /api/v1/admin/system-configs/{key}:
    $ref: "paths/admin-user-system.yaml#/~1api~1v1~1admin~1system-configs~1{key}"

  # ── Metrics ──
  /api/v1/metrics/vitals:
    post:
      operationId: reportWebVitals
      summary: Report Web Vitals metrics
      tags: [Metrics]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, value, rating]
              properties:
                name:
                  type: string
                  enum: [CLS, FCP, INP, LCP, TTFB]
                value:
                  type: number
                rating:
                  type: string
                  enum: [good, needs-improvement, poor]
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "components/responses/common.yaml#/ErrorResponse"

  /api/v1/metrics/frontend-errors:
    post:
      operationId: reportFrontendError
      summary: Report frontend errors
      tags: [Metrics]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind]
              properties:
                kind:
                  type: string
                  enum: [error, unhandledrejection]
      responses:
        "204":
          description: Accepted
        "400":
          $ref: "components/responses/common.yaml#/ErrorResponse"

