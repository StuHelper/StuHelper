openapi: 3.1.0
info:
  title: StuHelper API
  version: "1.0.0"
  description: StuHelper 学习助手平台 API
  license:
    name: GNU Affero General Public License v3.0 only
    url: https://www.gnu.org/licenses/agpl-3.0.html

servers:
  - url: http://127.0.0.1:8080
    description: Development
  - url: https://api.stuhelper.com
    description: Production

security:
  - cookieAuth: []
  - bearerAuth: []

tags:
  - name: Health
    description: 健康检查
  - name: Auth
    description: 认证与授权
  - name: Academics
    description: 教务数据导入与展示
  - name: Resource
    description: 校园资源共享
  - name: Storage
    description: 存储挂载与驱动管理
  - name: Course
    description: 课程实体
  - name: Review
    description: 测评
  - name: Rating
    description: 评分统计
  - name: Notification
    description: 通知
  - name: Draft
    description: 草稿
  - name: Favorite
    description: 收藏
  - name: User
    description: 用户中心
  - name: Admission
    description: 只消费学生资格结果的群聊准入与 QQ 平台动作编排
  - name: Bot
    description: 机器人内部接口
  - name: Identity
    description: 实名认证
  - name: Profile
    description: 学生认证
  - name: StudentVerification
    description: 与 QQ 和群聊准入解耦的学生认证、凭据与资格
  - name: AccountSecurity
    description: 账号级手机号等附加安全凭据
  - name: OpenPlatform
    description: 开放平台 OAuth 授权、scope consent 与用户信息披露
  - name: Admin
    description: 管理后台
  - name: Metrics
    description: 前端可观测性指标上报

