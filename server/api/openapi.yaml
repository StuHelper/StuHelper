tags:
  - name: Health
    description: 健康检查
  - name: Auth
    description: 认证与授权
  - name: Academics
    description: 教务数据导入与展示
  - name: Resource
    description: 校园资源共享
  - name: Storage
    description: 存储挂载与驱动管理
