ResourceBinding:
  type: object
  required: [type, value]
  properties:
    type:
      type: string
    value:
      type: string

ResourceVersion:
  type: object
  required: [id, versionNo, mountID, objectKey, filename, contentType, sizeBytes, createdAt]
  properties:
    id:
      type: integer
      format: int64
    versionNo:
      type: integer
    mountID:
      type: integer
      format: int64
    objectKey:
      type: string
    filename:
      type: string
    contentType:
      type: string
      description: 服务端校验后的有效 MIME 类型；声明与内容嗅探相同时使用嗅探值，受支持的容器或文本细分类型使用其规范化声明值。
    sizeBytes:
      type: integer
      format: int64
    createdAt:
      type: string
      format: date-time

ResourceItem:
  type: object
  required: [id, title, visibility, tags, bindings, latestVersion, createdAt, updatedAt]
  properties:
    id:
      type: integer
      format: int64
    ownerUserID:
      type: string
    title:
      type: string
    description:
      type: string
    category:
      type: string
    visibility:
      type: string
      enum: [public, private]
    tags:
      type: array
      items:
        type: string
    bindings:
      type: array
      items:
        $ref: '#/ResourceBinding'
    latestVersion:
      $ref: '#/ResourceVersion'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateResourceRequest:
  type: object
  required: [title, visibility, tags, bindings, filename, contentType, dataBase64]
  properties:
    title:
      type: string
    description:
      type: string
    category:
      type: string
    visibility:
      type: string
      enum: [public, private]
    tags:
      type: array
      items:
        type: string
    bindings:
      type: array
      items:
        $ref: '#/ResourceBinding'
    filename:
      type: string
    contentType:
      type: string
      description: 浏览器声明的 MIME 类型；必须与服务端内容嗅探结果相同，或属于服务端明确支持且可验证的容器或文本细分类型。
    dataBase64:
      type: string
      description: 文件 base64 内容，支持标准 Base64 或 data URL 形式
    mountKey:
      type: string

UpdateResourceRequest:
  type: object
  required: [title, visibility, tags, bindings]
  properties:
    title:
      type: string
    description:
      type: string
    category:
      type: string
    visibility:
      type: string
      enum: [public, private]
    tags:
      type: array
      items:
        type: string
    bindings:
      type: array
      items:
        $ref: '#/ResourceBinding'

ResourceDownloadURL:
  type: object
  required: [url]
  properties:
    url:
      type: string
      format: uri
