NotificationType:
  type: string
  enum:
    - reply
    - like
    - vote
    - review_hidden
    - review_restored
    - report_resolved
    - identity_approved
    - identity_rejected
    - student_approved
    - student_rejected
    - system

NotificationPayload:
  type: object
  additionalProperties: true

Notification:
  type: object
  required: [id, type, title, isRead, createdAt]
  properties:
    id:
      type: string
      format: uuid
    type:
      $ref: "#/NotificationType"
    title:
      type: string
    content:
      type: string
    payload:
      $ref: "#/NotificationPayload"
    sourceModule:
      type: string
      description: 触发通知的业务模块（canonical wire field）
    sourceId:
      type: string
      description: 触发通知的资源 ID（canonical wire field）
    sourceUrl:
      type: string
      description: 前端可直接跳转的目标地址（canonical wire field）
    relatedType:
      type: string
      deprecated: true
      description: 兼容旧前端的 sourceModule 别名；新代码请使用 sourceModule
    relatedID:
      type: string
      deprecated: true
      description: 兼容旧前端的 sourceId 别名；新代码请使用 sourceId
    courseID:
      type: integer
      format: int64
      description: 关联课程 ID，用于前端精准跳转
    isRead:
      type: boolean
    createdAt:
      type: string
      format: date-time

UnreadCountData:
  type: object
  required: [count]
  properties:
    count:
      type: integer
