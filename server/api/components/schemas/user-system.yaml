        - string
        - 'null'
      format: date-time
    docPhotoFront:
      type:
        - string
        - 'null'
    docPhotoBack:
      type:
        - string
        - 'null'
    docPhotoSelfie:
      type:
        - string
        - 'null'
    rejectionReason:
      type:
        - string
        - 'null'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

SubmitIdentityRequest:
  type: object
  required: [docType, docNumber, realName]
  properties:
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    docNumber:
      type: string
    realName:
      type: string
    docPhotoFront:
      type:
        - string
        - 'null'
    docPhotoBack:
      type:
        - string
        - 'null'
    docPhotoSelfie:
      type:
        - string
        - 'null'

UserProfile:
  type: object
  required: [userID, verificationStatus, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    schoolID:
      type: string
    studentIDs:
      type: array
      items:
        type: string
    activeStudentID:
      type: string
    verificationStatus:
      type: string
      enum: [unverified, pending, verified, rejected]
    verificationMethod:
      type: string
    phone:
      type: string
    phoneVerified:
      type: boolean
    consentGivenAt:
      type:
        - string
        - 'null'
      format: date-time
    verifiedAt:
      type:
        - string
        - 'null'
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

SubmitStudentVerificationRequest:
  type: object
  required: [schoolID, studentID, password, consent]
  properties:
    schoolID:
      type: string
    studentID:
      type: string
    password:
      type: string
      writeOnly: true
    consent:
      type: boolean

BindPhoneRequest:
  type: object
  required: [phone]
  properties:
    phone:
      type: string

SchoolConfig:
  type: object
  required: [schoolID, schoolName, verificationMethod, enabled]
  properties:
    schoolID:
      type: string
    schoolName:
      type: string
    verificationMethod:
      type: string
    consentText:
      type: string
    manualFormFields:
      type:
        - object
        - 'null'
      additionalProperties: true
    enabled:
      type: boolean

Role:
  type: object
  required: [id, name, displayName, isSystem, createdAt, updatedAt]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    displayName:
      type: string
    description:
      type: string
    isSystem:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

Permission:
  type: object
  required: [id, name, module, action, displayName, createdAt]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    module:
      type: string
    action:
      type: string
    displayName:
      type: string
    scopeSchoolIDs:
      type:
