      type: integer
      format: int64
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    realName:
      type: string
    verified:
      type: boolean
    verifyMethod:
      type: string
      enum: [academic_db_match, tencent_cloud, manual]
    verifiedAt:
