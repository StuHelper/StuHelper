SystemConfig:
  type: object
  required: [key, value, updatedAt]
  properties:
    key:
      type: string
    value:
      type: string
    description:
      type:
        - string
        - 'null'
    updatedAt:
      type: string
      format: date-time

UpdateSystemConfigRequest:
  type: object
  required: [value]
  properties:
    value:
      type: string

QQBinding:
  type: object
  required: [userID, qqID, boundAt, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    qqID:
      type: string
    boundAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

QQBindingCode:
  type: object
  required: [code, expiresAt]
  properties:
    code:
      type: string
    expiresAt:
      type: string
      format: date-time

ConsumeQQBindingRequest:
  type: object
  required: [code, qqID]
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 32
    qqID:
      type: string
      minLength: 1
      maxLength: 64

QQVerificationStatus:
  type: object
  required: [qqID, verificationState, studentVerified]
  properties:
    qqID:
      type: string
    userID:
      type:
        - integer
        - 'null'
      format: int64
    boundAt:
      type:
        - string
        - 'null'
      format: date-time
    verificationState:
      type: string
      enum: [unbound, bound_unverified, verified]
    studentVerified:
      type: boolean
      description: 由当前有效学生凭据实时派生，不读取旧 user profile 认证状态。

UserSurface:
  type: object
  required: [displayName, studentVerificationStatus, phoneBound, capabilities]
  properties:
    displayName:
      type: string
    avatarURL:
      type: string
    phone:
      type:
        - string
        - 'null'
      description: 账号侧已验证手机号的脱敏展示值；未绑定时为空。
    studentVerificationStatus:
      type: string
      enum: [none, approved]
      description: 由当前有效学生凭据实时派生；不是可写或永久保存的 verified 标志。
    phoneBound:
      type: boolean
    capabilities:
      type: array
      items:
        type: string
