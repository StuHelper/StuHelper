UserIdentity:
  type: object
  required: [userID, docType, realName, verified, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    realName:
      type: string
    verified:
      type: boolean
    verifyMethod:
      type:
        - string
        - "null"
      enum: [academic_db_match, tencent_cloud, manual]
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    rejectionReason:
      type:
        - string
        - "null"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AdminIdentityReviewItem:
  type: object
  required: [userID, docType, realName, verified, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    realName:
      type: string
    verified:
      type: boolean
    verifyMethod:
      type:
        - string
        - "null"
      enum: [academic_db_match, tencent_cloud, manual]
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    rejectionReason:
      type:
        - string
        - "null"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AdminIdentityReviewDetail:
  type: object
  required:
    - userID
    - docType
    - realName
    - verified
    - createdAt
    - updatedAt
    - docPhotoFrontURL
    - docPhotoBackURL
    - docPhotoSelfieURL
  properties:
    userID:
      type: integer
      format: int64
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    realName:
      type: string
    verified:
      type: boolean
    verifyMethod:
      type:
        - string
        - "null"
      enum: [academic_db_match, tencent_cloud, manual]
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    rejectionReason:
      type:
        - string
        - "null"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
    docPhotoFrontURL:
      type:
        - string
        - "null"
      format: uri
      description: 证件正面材料的短期签名 URL；仅管理员详情接口返回。
    docPhotoBackURL:
      type:
        - string
        - "null"
      format: uri
      description: 证件背面材料的短期签名 URL；可能为空。
    docPhotoSelfieURL:
      type:
        - string
        - "null"
      format: uri
      description: 本人手持证件材料的短期签名 URL；仅管理员详情接口返回。

UploadIdentityPhotoRequest:
  type: object
  required: [slot, filename, contentType, dataBase64]
  properties:
    slot:
      type: string
      enum: [front, back, selfie]
    filename:
      type: string
      maxLength: 255
    contentType:
      type: string
      enum: [image/jpeg, image/png, image/webp]
    dataBase64:
      type: string
      description: "不含 data: 前缀的 Base64 内容"

IdentityPhotoUploadResult:
  type: object
  required: [key]
  properties:
    key:
      type: string
      description: 后续提交实名认证时使用的对象存储 key
    rejectionReason:
      type:
        - string
        - "null"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

SubmitIdentityRequest:
  type: object
  required: [docType, docNumber, realName]
  properties:
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    docNumber:
      type: string
      minLength: 1
      maxLength: 50
      description: MAINLAND_ID 使用中国大陆居民身份证号码，服务端会校验证件格式、出生日期和校验位。
    realName:
      type: string
      minLength: 1
      maxLength: 100
    docPhotoFront:
      type:
        - string
        - "null"
    docPhotoBack:
      type:
        - string
        - "null"
    docPhotoSelfie:
      type:
        - string
        - "null"

UserProfile:
  type: object
  required: [userID, verificationStatus, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    schoolID:
      type:
        - integer
        - "null"
      format: int64
    studentIDs:
      type:
        - array
        - "null"
      items:
        type: string
    activeStudentID:
      type:
        - string
        - "null"
    verificationStatus:
      type: string
      enum: [unverified, pending, verified, rejected]
    verificationMethod:
      type:
        - string
        - "null"
      enum: [ldap, manual, school_email_otp, school_sso]
    rejectionReason:
      type:
        - string
        - "null"
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    phone:
      type:
        - string
        - "null"
      description: 掩码手机号（如 138****5678）
    phoneVerified:
      type: boolean
    consentGivenAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AdminStudentVerificationItem:
  type: object
  required: [userID, verificationStatus, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    schoolID:
      type:
        - integer
        - "null"
      format: int64
    studentIDs:
      type:
        - array
        - "null"
      items:
        type: string
    activeStudentID:
      type:
        - string
        - "null"
    manualFormData:
      type:
        - object
        - "null"
      additionalProperties: true
    verificationStatus:
      type: string
      enum: [unverified, pending, verified, rejected]
    verificationMethod:
      type:
        - string
        - "null"
      enum: [ldap, manual, school_email_otp, school_sso]
    rejectionReason:
      type:
        - string
        - "null"
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    phone:
      type:
        - string
        - "null"
      description: 掩码手机号（如 138****5678）
    phoneVerified:
      type: boolean
    consentGivenAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

SubmitStudentVerificationRequest:
  type: object
  required: [schoolCode, consent]
  properties:
    schoolCode:
      type: string
      pattern: '^[0-9]{10}$'
      description: 教育部学校标识码；公开学生认证请求必须以此字段识别学校。
    studentID:
      type: string
      minLength: 1
      maxLength: 50
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,49}$'
    password:
      type: string
      maxLength: 200
      writeOnly: true
    manualFormData:
      type:
        - object
        - "null"
      additionalProperties: true
      description: manual 模式动态表单提交数据
    consent:
      type: boolean

StudentEmailOTPRequest:
  type: object
  required: [schoolCode]
  properties:
    schoolCode:
      type: string
      pattern: '^[0-9]{10}$'
      description: 教育部学校标识码；公开学校邮箱 OTP 请求必须以此字段识别学校。
    email:
      type: string
      format: email
      maxLength: 320
      description: 普通学校邮箱 OTP 可直接提交邮箱；配置学籍邮箱策略时由后端按学号派生并校验不可篡改
    studentID:
      type: string
      minLength: 1
      maxLength: 50
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,49}$'
      description: 配置 academic_student_email 策略的学校必填
    studentName:
      type: string
      minLength: 1
      maxLength: 80
      description: 配置 academic_student_email 且 requireStudentName=true 的学校必填

StudentEmailAcademicMatchRequest:
  type: object
  required: [schoolCode, studentID, studentName]
  properties:
    schoolCode:
      type: string
      pattern: '^[0-9]{10}$'
      description: 教育部学校标识码；即时学籍匹配必须以此字段识别学校。
    studentID:
      type: string
      minLength: 1
      maxLength: 50
      pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,49}$'
      description: 学号。
    studentName:
      type: string
      minLength: 1
      maxLength: 80
      description: 姓名。

StudentEmailAcademicMatchResponse:
  type: object
  required: [matched]
  properties:
    matched:
      type: boolean
      description: 学号和姓名是否在学校学籍数据源中匹配。
    email:
      type: string
      format: email
      maxLength: 320
      description: 匹配通过后由后端按学号派生出的学校邮箱。
    studentID:
      type: string
      description: 规范化后的学号。
    message:
      type: string
      description: 面向前端展示的匹配提示。

StudentEmailOTPVerifyRequest:
  type: object
  required: [schoolCode, code, consent]
  properties:
    schoolCode:
      type: string
      pattern: '^[0-9]{10}$'
      description: 教育部学校标识码；公开学校邮箱 OTP 校验请求必须以此字段识别学校。
    email:
      type: string
      format: email
      maxLength: 320
    code:
      type: string
      minLength: 4
      maxLength: 12
    consent:
      type: boolean

StudentEmailOTPResponse:
  type: object
  required: [email, cooldownSeconds]
  properties:
    email:
      type: string
      format: email
      description: 后端最终锁定并发送验证码的学校邮箱
    studentID:
      type: string
      description: 学籍邮箱策略下已匹配的学号
    cooldownSeconds:
      type: integer
      minimum: 1

ManualFieldDescriptor:
  type: object
  required: [key, label, type, required]
  properties:
    key:
      type: string
      description: 动态字段唯一标识
    label:
      type: string
      description: 字段展示文案
    type:
      type: string
      enum: [text, textarea, select, date]
    required:
      type: boolean
    options:
      type:
        - array
        - "null"
      items:
        type: string
      description: select 类型可选项
    placeholder:
      type:
        - string
        - "null"
      description: 输入占位文案

BindPhoneRequest:
  type: object
  required: [phone, otpCode]
  properties:
    phone:
      type: string
      pattern: '^1[3-9]\d{9}$'
      minLength: 11
      maxLength: 11
    otpCode:
      type: string
      minLength: 6
      maxLength: 6
      description: 短信验证码（6位）

SchoolConfig:
  type: object
  required:
    - schoolID
    - schoolCode
    - schoolName
    - verificationMethod
    - enabled
    - schoolSsoEnabled
    - schoolEmailOtpEnabled
  properties:
    schoolID:
      type: integer
      format: int64
      description: StuHelper 内部学校主键，仅用于后端外键兼容
    schoolCode:
      type: string
      description: 教育部学校标识码；对外选择和展示应优先使用此字段
    schoolName:
      type: string
    verificationMethod:
      type: string
      enum: [ldap, manual]
    consentText:
      type:
        - string
        - "null"
    manualFormFields:
      type:
        - array
        - "null"
      items:
        $ref: "#/ManualFieldDescriptor"
    enabled:
      type: boolean
    schoolSsoEnabled:
      type: boolean
      description: 该学校是否已接入加群验证用的学校官方 SSO
    schoolEmailOtpEnabled:
      type: boolean
      description: 该学校是否已接入加群验证用的学校邮箱 OTP
    schoolEmailIdentityPolicy:
      $ref: "#/SchoolEmailIdentityPolicy"
      description: 学校邮箱认证的可选身份校验策略；BUAA 使用 academic_student_email 派生学号邮箱

SchoolEmailIdentityPolicy:
  type: object
  required: [type, requireStudentName]
  properties:
    type:
      type: string
      enum: [academic_student_email]
    studentIDEmailDomain:
      type: string
      description: 学号邮箱域名，例如 buaa.edu.cn
    requireStudentName:
      type: boolean

SchoolLDAPConfigView:
  type: object
  required: [useTLS, hasSystemBindPassword]
  properties:
    url:
      type:
        - string
        - "null"
    baseDN:
      type:
        - string
        - "null"
    systemBindDN:
      type:
        - string
        - "null"
    useTLS:
      type: boolean
    hasSystemBindPassword:
      type: boolean

SchoolLDAPConfigInput:
  type: object
  properties:
    url:
      type: string
    baseDN:
      type: string
    systemBindDN:
      type: string
    systemBindPassword:
      type: string
    useTLS:
      type: boolean

ReviewIdentityRequest:
  type: object
  required: [approved]
  properties:
    approved:
      type: boolean
    rejectionReason:
      type:
        - string
        - "null"

ReviewStudentVerificationRequest:
  type: object
  required: [approved]
  properties:
    approved:
      type: boolean
    rejectionReason:
      description: 驳回理由，可留空
      type:
        - string
        - "null"

SystemConfig:
  type: object
  required: [key, value, updatedAt]
  properties:
    key:
      type: string
    value:
      type: string
    description:
      type:
        - string
        - "null"
    updatedAt:
      type: string
      format: date-time

UpdateSystemConfigRequest:
  type: object
  required: [value]
  properties:
    value:
      type: string

AcademicStudentInfo:
  type: object
  required: [xh, xm]
  properties:
    xh:
      type: string
      description: Student ID
    xm:
      type: string
      description: Student name
    yxdm:
      type: string
      description: College code
    zydm:
      type: string
      description: Major code
    bjdm:
      type: string
      description: Class code
    xznj:
      type: string
      description: Current grade
    rxnj:
      type: string
      description: Enrollment grade
    pyccdm:
      type: string
      description: Education level code
    sjh:
      type: string
      description: Phone number
    dzxx:
      type: string
      description: Email address

AdminSchoolConfig:
  type: object
  required:
    [
      schoolID,
      schoolCode,
      schoolName,
      verificationMethod,
      approvalPolicy,
      enabled,
      schoolSsoEnabled,
      schoolEmailOtpEnabled,
      createdAt,
    ]
  properties:
    schoolID:
      type: integer
      format: int64
    schoolCode:
      type: string
    schoolName:
      type: string
    verificationMethod:
      type: string
      enum: [ldap, manual]
    approvalPolicy:
      type: string
      enum: [auto, manual]
    ldapConfig:
      $ref: "#/SchoolLDAPConfigView"
      description: LDAP 连接配置，不返回系统绑定密码明文
    academicDbTable:
      type:
        - string
        - "null"
      description: 本地学籍表名
    consentText:
      type:
        - string
        - "null"
    manualFormFields:
      type:
        - array
        - "null"
      items:
        $ref: "#/ManualFieldDescriptor"
    enabled:
      type: boolean
    schoolSsoEnabled:
      type: boolean
      description: 该学校是否已接入加群验证用的学校官方 SSO
    schoolEmailOtpEnabled:
      type: boolean
      description: 该学校是否已接入加群验证用的学校邮箱 OTP
    schoolEmailIdentityPolicy:
      $ref: "#/SchoolEmailIdentityPolicy"
      description: 学校邮箱认证的可选身份校验策略；BUAA 使用 academic_student_email 派生学号邮箱
    createdAt:
      type: string
      format: date-time

UpdateSchoolConfigRequest:
  type: object
  properties:
    schoolName:
      type: string
      maxLength: 100
    verificationMethod:
      type: string
      enum: [ldap, manual]
    approvalPolicy:
      type: string
      enum: [auto, manual]
    ldapConfig:
      $ref: "#/SchoolLDAPConfigInput"
    academicDbTable:
      type: string
      maxLength: 100
    consentText:
      type: string
    manualFormFields:
      type: array
      items:
        $ref: "#/ManualFieldDescriptor"
    enabled:
      type: boolean

QQBinding:
  type: object
  required: [userID, qqID, boundAt, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    qqID:
      type: string
    boundAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

QQBindingCode:
  type: object
  required: [code, expiresAt]
  properties:
    code:
      type: string
    expiresAt:
      type: string
      format: date-time

ConsumeQQBindingRequest:
  type: object
  required: [code, qqID]
  properties:
    code:
      type: string
      minLength: 1
      maxLength: 32
    qqID:
      type: string
      minLength: 1
      maxLength: 64

QQVerificationStatus:
  type: object
  required: [qqID, verificationState, profileVerificationStatus, studentVerified]
  properties:
    qqID:
      type: string
    userID:
      type:
        - integer
        - "null"
      format: int64
    boundAt:
      type:
        - string
        - "null"
      format: date-time
    verificationState:
      type: string
      enum: [unbound, bound_unverified, verified]
    profileVerificationStatus:
      type: string
      enum: [unverified, pending, verified, rejected]
    studentVerified:
      type: boolean

UserSurface:
  type: object
  required: [displayName, identityStatus, verificationStatus, phoneBound, capabilities]
  properties:
    displayName:
      type: string
    avatarURL:
      type: string
    phone:
      type:
        - string
        - "null"
      description: 账号侧已验证手机号的脱敏展示值；未绑定时为空。
    identityStatus:
      type: string
      enum: [none, pending, approved, rejected]
    verificationStatus:
      type: string
      enum: [none, pending, approved, rejected]
    phoneBound:
      type: boolean
    capabilities:
      type: array
      items:
        type: string
