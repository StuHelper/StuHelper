UserIdentity:
  type: object
  required: [userID, docType, realName, verified, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    realName:
      type: string
    verified:
      type: boolean
    verifyMethod:
      type:
        - string
        - "null"
      enum: [academic_db_match, tencent_cloud, manual]
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    rejectionReason:
      type:
        - string
        - "null"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AdminIdentityReviewItem:
  type: object
  required: [userID, docType, realName, verified, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    realName:
      type: string
    verified:
      type: boolean
    verifyMethod:
      type:
        - string
        - "null"
      enum: [academic_db_match, tencent_cloud, manual]
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    docPhotoFront:
      type:
        - string
        - "null"
      description: 已上传到对象存储的正面照片 key
    docPhotoBack:
      type:
        - string
        - "null"
      description: 已上传到对象存储的背面照片 key
    docPhotoSelfie:
      type:
        - string
        - "null"
      description: 已上传到对象存储的手持证件照 key
    rejectionReason:
      type:
        - string
        - "null"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

UploadIdentityPhotoRequest:
  type: object
  required: [slot, filename, contentType, dataBase64]
  properties:
    slot:
      type: string
      enum: [front, back, selfie]
    filename:
      type: string
      maxLength: 255
    contentType:
      type: string
      enum: [image/jpeg, image/png, image/webp]
    dataBase64:
      type: string
      description: "不含 data: 前缀的 Base64 内容"

IdentityPhotoUploadResult:
  type: object
  required: [key]
  properties:
    key:
      type: string
      description: 后续提交实名认证时使用的对象存储 key
    rejectionReason:
      type:
        - string
        - "null"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

SubmitIdentityRequest:
  type: object
  required: [docType, docNumber, realName]
  properties:
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    docNumber:
      type: string
      minLength: 1
      maxLength: 50
    realName:
      type: string
      minLength: 1
      maxLength: 100
    docPhotoFront:
      type:
        - string
        - "null"
    docPhotoBack:
      type:
        - string
        - "null"
    docPhotoSelfie:
      type:
        - string
        - "null"

UserProfile:
  type: object
  required: [userID, verificationStatus, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    schoolID:
      type:
        - integer
        - "null"
      format: int64
    studentIDs:
      type:
        - array
        - "null"
      items:
        type: string
    activeStudentID:
      type:
        - string
        - "null"
    verificationStatus:
      type: string
      enum: [unverified, pending, verified, rejected]
    verificationMethod:
      type:
        - string
        - "null"
      enum: [ldap, manual]
    rejectionReason:
      type:
        - string
        - "null"
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    phone:
      type:
        - string
        - "null"
      description: 掩码手机号（如 138****5678）
    phoneVerified:
      type: boolean
    consentGivenAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AdminStudentVerificationItem:
  type: object
  required: [userID, verificationStatus, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    schoolID:
      type:
        - integer
        - "null"
      format: int64
    studentIDs:
      type:
        - array
        - "null"
      items:
        type: string
    activeStudentID:
      type:
        - string
        - "null"
    manualFormData:
      type:
        - object
        - "null"
      additionalProperties: true
    verificationStatus:
      type: string
      enum: [unverified, pending, verified, rejected]
    verificationMethod:
      type:
        - string
        - "null"
      enum: [ldap, manual]
    rejectionReason:
      type:
        - string
        - "null"
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    phone:
      type:
        - string
        - "null"
      description: 掩码手机号（如 138****5678）
    phoneVerified:
      type: boolean
    consentGivenAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

SubmitStudentVerificationRequest:
  type: object
  required: [schoolID, consent]
  properties:
    schoolID:
      type: integer
      format: int64
      minimum: 1
    studentID:
      type: string
    password:
      type: string
      writeOnly: true
    manualFormData:
      type:
        - object
        - "null"
      additionalProperties: true
      description: manual 模式动态表单提交数据
    consent:
      type: boolean

ManualFieldDescriptor:
  type: object
  required: [key, label, type, required]
  properties:
    key:
      type: string
      description: 动态字段唯一标识
    label:
      type: string
      description: 字段展示文案
    type:
      type: string
      enum: [text, textarea, select, date]
    required:
      type: boolean
    options:
      type:
        - array
        - "null"
      items:
        type: string
      description: select 类型可选项
    placeholder:
      type:
        - string
        - "null"
      description: 输入占位文案

BindPhoneRequest:
  type: object
  required: [phone, otpCode]
  properties:
    phone:
      type: string
      pattern: '^1[3-9]\d{9}$'
      minLength: 11
      maxLength: 11
    otpCode:
      type: string
      minLength: 6
      maxLength: 6
      description: 短信验证码（6位）

SchoolConfig:
  type: object
  required: [schoolID, schoolName, verificationMethod, enabled]
  properties:
    schoolID:
      type: integer
      format: int64
    schoolName:
      type: string
    verificationMethod:
      type: string
      enum: [ldap, manual]
    consentText:
      type:
        - string
        - "null"
    manualFormFields:
      type:
        - array
        - "null"
      items:
        $ref: "#/ManualFieldDescriptor"
    enabled:
      type: boolean

SchoolLDAPConfigView:
  type: object
  required: [useTLS, insecureSkipVerify, hasSystemBindPassword]
  properties:
    url:
      type:
        - string
        - "null"
    baseDN:
      type:
        - string
        - "null"
    systemBindDN:
      type:
        - string
        - "null"
    useTLS:
      type: boolean
    insecureSkipVerify:
      type: boolean
    hasSystemBindPassword:
      type: boolean

SchoolLDAPConfigInput:
  type: object
  properties:
    url:
      type: string
    baseDN:
      type: string
    systemBindDN:
      type: string
    systemBindPassword:
      type: string
    useTLS:
      type: boolean
    insecureSkipVerify:
      type: boolean

ReviewIdentityRequest:
  type: object
  required: [approved]
  properties:
    approved:
      type: boolean
    rejectionReason:
      type:
        - string
        - "null"

ReviewStudentVerificationRequest:
  type: object
  required: [approved]
  properties:
    approved:
      type: boolean
    rejectionReason:
      description: 驳回理由，可留空
      type:
        - string
        - "null"

SystemConfig:
  type: object
  required: [key, value, updatedAt]
  properties:
    key:
      type: string
    value:
      type: string
    description:
      type:
        - string
        - "null"
    updatedAt:
      type: string
      format: date-time

UpdateSystemConfigRequest:
  type: object
  required: [value]
  properties:
    value:
      type: string

AcademicStudentInfo:
  type: object
  required: [xh, xm]
  properties:
    xh:
      type: string
      description: Student ID
    xm:
      type: string
      description: Student name
    yxdm:
      type: string
      description: College code
    zydm:
      type: string
      description: Major code
    bjdm:
      type: string
      description: Class code
    xznj:
      type: string
      description: Current grade
    rxnj:
      type: string
      description: Enrollment grade
    pyccdm:
      type: string
      description: Education level code
    sjh:
      type: string
      description: Phone number
    dzxx:
      type: string
      description: Email address

AdminSchoolConfig:
  type: object
  required: [schoolID, schoolName, verificationMethod, approvalPolicy, enabled, createdAt]
  properties:
    schoolID:
      type: integer
      format: int64
    schoolName:
      type: string
    verificationMethod:
      type: string
      enum: [ldap, manual]
    approvalPolicy:
      type: string
      enum: [auto, manual]
    ldapConfig:
      $ref: "#/SchoolLDAPConfigView"
      description: LDAP 连接配置，不返回系统绑定密码明文
    academicDbTable:
      type:
        - string
        - "null"
      description: 本地学籍表名
    consentText:
      type:
        - string
        - "null"
    manualFormFields:
      type:
        - array
        - "null"
      items:
        $ref: "#/ManualFieldDescriptor"
    enabled:
      type: boolean
    createdAt:
      type: string
      format: date-time

UpdateSchoolConfigRequest:
  type: object
  properties:
    schoolName:
      type: string
      maxLength: 100
    verificationMethod:
      type: string
      enum: [ldap, manual]
    ldapConfig:
      $ref: "#/SchoolLDAPConfigInput"
    academicDbTable:
      type: string
      maxLength: 100
    consentText:
      type: string
    manualFormFields:
      type: array
      items:
        $ref: "#/ManualFieldDescriptor"
    enabled:
      type: boolean

UserSurface:
  type: object
  required: [displayName, identityStatus, verificationStatus, phoneBound, capabilities]
  properties:
    displayName:
      type: string
    avatarURL:
      type: string
    identityStatus:
      type: string
      enum: [none, pending, approved, rejected]
    verificationStatus:
      type: string
      enum: [none, pending, approved, rejected]
    phoneBound:
      type: boolean
    capabilities:
      type: array
      items:
        type: string
