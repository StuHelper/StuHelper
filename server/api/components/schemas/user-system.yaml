AcademicStudentInfo:
  type: object
  required: [xh, xm]
  properties:
    xh:
      type: string
      description: Student ID
    xm:
      type: string
      description: Student name
    yxdm:
      type: string
      description: College code
    zydm:
      type: string
      description: Major code
    bjdm:
      type: string
      description: Class code
    xznj:
      type: string
      description: Current grade
    rxnj:
      type: string
      description: Enrollment grade
    pyccdm:
      type: string
      description: Education level code
    sjh:
      type: string
      description: Phone number
    dzxx:
      type: string
      description: Email address

EffectivePermission:
  type: object
  required: [permissionID, name, module, action, granted, source]
  properties:
    permissionID:
      type: integer
      format: int64
    name:
      type: string
    module:
      type: string
    action:
      type: string
    granted:
      type: boolean
    source:
      type: string
      enum: [role, group, override]
      description: 权限来源

GroupMember:
  type: object
  required: [userID, username]
  properties:
    userID:
      type: integer
      format: int64
    username:
      type: string
    email:
      type:
        - string
        - 'null'
    avatarURL:
      type:
        - string
        - 'null'
    joinedAt:
      type: string
      format: date-time

AdminSchoolConfig:
  type: object
  required: [schoolID, schoolName, verificationMethod, enabled, createdAt]
  properties:
    schoolID:
      type: string
    schoolName:
      type: string
    verificationMethod:
      type: string
      enum: [ldap, manual]
    ldapConfig:
      type:
        - object
        - 'null'
      additionalProperties: true
      description: LDAP 连接配置
    academicDbTable:
      type:
        - string
        - 'null'
      description: 本地学籍表名
    consentText:
      type:
        - string
        - 'null'
    manualFormFields:
      type:
        - object
        - 'null'
      additionalProperties: true
    enabled:
      type: boolean
    createdAt:
      type: string
      format: date-time

UpdateSchoolConfigRequest:
  type: object
  properties:
    schoolName:
      type: string
      maxLength: 100
    verificationMethod:
      type: string
      enum: [ldap, manual]
    ldapConfig:
      type: object
      additionalProperties: true
    academicDbTable:
      type: string
      maxLength: 100
    consentText:
      type: string
    manualFormFields:
      type: object
      additionalProperties: true
    enabled:
      type: boolean

