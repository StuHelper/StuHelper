UserIdentity:
  type: object
  required: [userID, docType, realName, verified, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    realName:
      type: string
    verified:
      type: boolean
    verifyMethod:
      type:
        - string
        - "null"
      enum: [academic_db_match, tencent_cloud, manual]
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    rejectionReason:
      type:
        - string
        - "null"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AdminIdentityReviewItem:
  type: object
  required: [userID, docType, realName, verified, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    realName:
      type: string
    verified:
      type: boolean
    verifyMethod:
      type:
        - string
        - "null"
      enum: [academic_db_match, tencent_cloud, manual]
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    docPhotoFront:
      type:
        - string
        - "null"
    docPhotoBack:
      type:
        - string
        - "null"
    docPhotoSelfie:
      type:
        - string
        - "null"
    rejectionReason:
      type:
        - string
        - "null"
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

SubmitIdentityRequest:
  type: object
  required: [docType, docNumber, realName]
  properties:
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    docNumber:
      type: string
    realName:
      type: string
    docPhotoFront:
      type:
        - string
        - "null"
    docPhotoBack:
      type:
        - string
        - "null"
    docPhotoSelfie:
      type:
        - string
        - "null"

UserProfile:
  type: object
  required: [userID, verificationStatus, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    schoolID:
      type:
        - string
        - "null"
    studentIDs:
      type:
        - array
        - "null"
      items:
        type: string
    activeStudentID:
      type:
        - string
        - "null"
    verificationStatus:
      type: string
      enum: [unverified, pending, verified, rejected]
    verificationMethod:
      type:
        - string
        - "null"
      enum: [ldap, manual]
    rejectionReason:
      type:
        - string
        - "null"
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    phone:
      type:
        - string
        - "null"
    phoneVerified:
      type: boolean
    consentGivenAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AdminStudentVerificationItem:
  type: object
  required: [userID, verificationStatus, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    schoolID:
      type:
        - string
        - "null"
    studentIDs:
      type:
        - array
        - "null"
      items:
        type: string
    activeStudentID:
      type:
        - string
        - "null"
    manualFormData:
      type:
        - object
        - "null"
      additionalProperties: true
    verificationStatus:
      type: string
      enum: [unverified, pending, verified, rejected]
    verificationMethod:
      type:
        - string
        - "null"
      enum: [ldap, manual]
    rejectionReason:
      type:
        - string
        - "null"
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    phone:
      type:
        - string
        - "null"
    phoneVerified:
      type: boolean
    consentGivenAt:
      type:
        - string
        - "null"
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

SubmitStudentVerificationRequest:
  type: object
  required: [schoolID, consent]
  properties:
    schoolID:
      type: string
    studentID:
      type: string
    password:
      type: string
      writeOnly: true
    manualFormData:
      type:
        - object
        - "null"
      additionalProperties: true
      description: manual 模式动态表单提交数据
    consent:
      type: boolean

ManualFieldDescriptor:
  type: object
  required: [key, label, type, required]
  properties:
    key:
      type: string
      description: 动态字段唯一标识
    label:
      type: string
      description: 字段展示文案
    type:
      type: string
      enum: [text, textarea, select, date]
    required:
      type: boolean
    options:
      type:
        - array
        - "null"
      items:
        type: string
      description: select 类型可选项
    placeholder:
      type:
        - string
        - "null"
      description: 输入占位文案

BindPhoneRequest:
  type: object
  required: [phone]
  properties:
    phone:
      type: string

SchoolConfig:
  type: object
  required: [schoolID, schoolName, verificationMethod, enabled]
  properties:
    schoolID:
      type: string
    schoolName:
      type: string
    verificationMethod:
      type: string
      enum: [ldap, manual]
    consentText:
      type:
        - string
        - "null"
    manualFormFields:
      type:
        - array
        - "null"
      items:
        $ref: "#/ManualFieldDescriptor"
    enabled:
      type: boolean

SchoolLDAPConfigView:
  type: object
  required: [useTLS, insecureSkipVerify, hasSystemBindPassword]
  properties:
    url:
      type:
        - string
        - "null"
    baseDN:
      type:
        - string
        - "null"
    systemBindDN:
      type:
        - string
        - "null"
    useTLS:
      type: boolean
    insecureSkipVerify:
      type: boolean
    hasSystemBindPassword:
      type: boolean

SchoolLDAPConfigInput:
  type: object
  properties:
    url:
      type: string
    baseDN:
      type: string
    systemBindDN:
      type: string
    systemBindPassword:
      type: string
    useTLS:
      type: boolean
    insecureSkipVerify:
      type: boolean

Role:
  type: object
  required: [id, name, displayName, isSystem, createdAt, updatedAt]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    displayName:
      type: string
    description:
      type: string
    isSystem:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

Permission:
  type: object
  required: [id, name, module, action, displayName, createdAt]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    module:
      type: string
    action:
      type: string
    displayName:
      type: string
    scopeSchoolIDs:
      type:
        - array
        - "null"
      items:
        type: string
    scopeRoles:
      type:
        - array
        - "null"
      items:
        type: string
    createdAt:
      type: string
      format: date-time

UserGroup:
  type: object
  required: [id, name, displayName, memberCount, createdAt, updatedAt]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    displayName:
      type: string
    description:
      type: string
    memberCount:
      type: integer
    createdBy:
      type: integer
      format: int64
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateRoleRequest:
  type: object
  required: [name, displayName]
  properties:
    name:
      type: string
    displayName:
      type: string
    description:
      type: string

UpdateRoleRequest:
  type: object
  properties:
    displayName:
      type: string
    description:
      type: string

CreateUserGroupRequest:
  type: object
  required: [name, displayName]
  properties:
    name:
      type: string
    displayName:
      type: string
    description:
      type: string

UpdateUserGroupRequest:
  type: object
  properties:
    displayName:
      type: string
    description:
      type: string

AssignRolePermissionsRequest:
  type: object
  required: [permissionIDs]
  properties:
    permissionIDs:
      type: array
      items:
        type: integer
        format: int64
    clearAll:
      type: boolean
      description: 显式确认清空角色全部权限；仅当 permissionIDs 为空时生效

RolePermissionIDsResponse:
  type: object
  required: [permissionIDs]
  properties:
    permissionIDs:
      type: array
      items:
        type: integer
        format: int64

AssignUserRolesRequest:
  type: object
  required: [roleIDs]
  properties:
    roleIDs:
      type: array
      items:
        type: integer
        format: int64

AssignGroupMembersRequest:
  type: object
  required: [userIDs]
  properties:
    userIDs:
      type: array
      items:
        type: integer
        format: int64

AssignGroupPermissionsRequest:
  type: object
  required: [permissionIDs]
  properties:
    permissionIDs:
      type: array
      items:
        type: integer
        format: int64

SetUserPermissionRequest:
  type: object
  required: [permissionID, granted]
  properties:
    permissionID:
      type: integer
      format: int64
    granted:
      type: boolean

ReviewIdentityRequest:
  type: object
  required: [approved]
  properties:
    approved:
      type: boolean
    rejectionReason:
      type:
        - string
        - "null"

ReviewStudentVerificationRequest:
  type: object
  required: [approved]
  properties:
    approved:
      type: boolean
    rejectionReason:
      description: 驳回理由，可留空
      type:
        - string
        - "null"

SystemConfig:
  type: object
  required: [key, value, updatedAt]
  properties:
    key:
      type: string
    value:
      type: string
    description:
      type:
        - string
        - "null"
    updatedAt:
      type: string
      format: date-time

UpdateSystemConfigRequest:
  type: object
  required: [value]
  properties:
    value:
      type: string

AcademicStudentInfo:
  type: object
  required: [xh, xm]
  properties:
    xh:
      type: string
      description: Student ID
    xm:
      type: string
      description: Student name
    yxdm:
      type: string
      description: College code
    zydm:
      type: string
      description: Major code
    bjdm:
      type: string
      description: Class code
    xznj:
      type: string
      description: Current grade
    rxnj:
      type: string
      description: Enrollment grade
    pyccdm:
      type: string
      description: Education level code
    sjh:
      type: string
      description: Phone number
    dzxx:
      type: string
      description: Email address

EffectivePermission:
  type: object
  required: [permissionID, name, module, action, granted, source]
  properties:
    permissionID:
      type: integer
      format: int64
    name:
      type: string
    module:
      type: string
    action:
      type: string
    granted:
      type: boolean
    source:
      type: string
      enum: [role, group, override]
      description: 权限来源

GroupMember:
  type: object
  required: [userID, username]
  properties:
    userID:
      type: integer
      format: int64
    username:
      type: string
    email:
      type:
        - string
        - "null"
    avatarURL:
      type:
        - string
        - "null"
    joinedAt:
      type: string
      format: date-time

AdminSchoolConfig:
  type: object
  required: [schoolID, schoolName, verificationMethod, enabled, createdAt]
  properties:
    schoolID:
      type: string
    schoolName:
      type: string
    verificationMethod:
      type: string
      enum: [ldap, manual]
    ldapConfig:
      $ref: "#/SchoolLDAPConfigView"
      description: LDAP 连接配置，不返回系统绑定密码明文
    academicDbTable:
      type:
        - string
        - "null"
      description: 本地学籍表名
    consentText:
      type:
        - string
        - "null"
    manualFormFields:
      type:
        - array
        - "null"
      items:
        $ref: "#/ManualFieldDescriptor"
    enabled:
      type: boolean
    createdAt:
      type: string
      format: date-time

UpdateSchoolConfigRequest:
  type: object
  properties:
    schoolName:
      type: string
      maxLength: 100
    verificationMethod:
      type: string
      enum: [ldap, manual]
    ldapConfig:
      $ref: "#/SchoolLDAPConfigInput"
    academicDbTable:
      type: string
      maxLength: 100
    consentText:
      type: string
    manualFormFields:
      type: array
      items:
        $ref: "#/ManualFieldDescriptor"
    enabled:
      type: boolean

UserPermissionOverride:
  type: object
  required: [userID, permissionID, permissionName, granted]
  properties:
    userID:
      type: integer
      format: int64
    permissionID:
      type: integer
      format: int64
    permissionName:
      type: string
    granted:
      type: boolean
