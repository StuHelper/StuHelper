UserIdentity:
  type: object
  required: [userID, docType, realName, verified, createdAt, updatedAt]
  properties:
    userID:
      type: integer
      format: int64
    docType:
      type: string
      enum: [MAINLAND_ID, HK_MACAU, TW, PASSPORT]
    realName:
      type: string
    verified:
      type: boolean
    verifyMethod:
      type: string
      enum: [academic_db_match, tencent_cloud, manual]
    verifiedAt:
      type:
        - string
        - 'null'
      format: date-time
    rejectionReason:
      type:
        - string
        - 'null'
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AdminIdentityReviewItem:
  type: object
  required: [userID, docType, realName, verified, createdAt, updatedAt]
  properties:
