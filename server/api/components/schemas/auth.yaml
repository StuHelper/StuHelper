LoginURLResponse:
  type: object
  required: [url, state]
  properties:
    url:
      type: string
      format: uri
    state:
      type: string
      description: OAuth state parameter for CSRF protection

CallbackResponse:
  type: object
  required: [user, expiresIn]
  properties:
    user:
      $ref: '#/UserInfo'
    expiresIn:
      type: integer
      description: Access token TTL in seconds

RefreshResponse:
  type: object
  required: [expiresIn]
  properties:
    expiresIn:
      type: integer

UnlockAuthAccountRequest:
  type: object
  required: [phone]
  properties:
    phone:
      type: string
      pattern: '^1[3-9]\d{9}$'
      description: 需要解除认证失败锁定的手机号

CapabilityGrant:
  type: object
  required: [name, global]
  properties:
    name:
      type: string
    scopeSchoolIDs:
      type: array
      items:
        type: string
    scopeRoles:
      type: array
      items:
        type: string
    global:
      type: boolean

UserInfo:
  type: object
  required: [id, name, displayName, roles, capabilities, globalCapabilities, capabilityGrants, canAccessAdmin, isPlatformAdmin]
  properties:
    id:
      type: string
    name:
      type: string
    displayName:
      type: string
    avatar:
      type: string
    email:
      type: string
    roles:
      type: array
      items:
        type: string
      description: OIDC Token 中解析出的粗粒度角色列表
    isPlatformAdmin:
      type: boolean
      description: 是否持有平台级 super_admin 角色，不直接等于业务资源授权
    capabilities:
      type: array
      items:
        type: string
      description: 当前用户拥有的能力集合（由 roles 在应用侧静态展开）
    globalCapabilities:
      type: array
      items:
        type: string
      description: 当前前端可直接消费的全局能力集合，不含学校或角色范围限制
    capabilityGrants:
      type: array
      items:
        $ref: '#/CapabilityGrant'
      description: 完整能力授权明细，保留学校范围和角色范围等约束信息
    canAccessAdmin:
      type: boolean
      description: 当前用户是否拥有至少一个可直接进入现有后台界面的全局能力
    accountSettingsUrl:
      type: string
      format: uri
      description: 身份提供方账户设置页，用于修改密码等账号安全设置
