LoginURLResponse:
  type: object
  required: [url, state]
  properties:
    url:
      type: string
      format: uri
    state:
      type: string
      description: OAuth state parameter for CSRF protection

CallbackResponse:
  type: object
  required: [user, expiresIn]
  properties:
    user:
      $ref: '#/UserInfo'
    expiresIn:
      type: integer
      description: Access token TTL in seconds

RefreshResponse:
  type: object
  required: [expiresIn]
  properties:
    expiresIn:
      type: integer

UserInfo:
  type: object
  required: [id, name, displayName, capabilities, canAccessAdmin, isPlatformAdmin]
  properties:
    id:
      type: string
    name:
      type: string
    displayName:
      type: string
    avatar:
      type: string
    email:
      type: string
    isPlatformAdmin:
      type: boolean
      description: Casdoor 平台管理员标记，不代表航小伴业务管理员
    capabilities:
      type: array
      items:
        type: string
      description: 航小伴应用能力集合，作为前端菜单与后端业务授权的输入
    canAccessAdmin:
      type: boolean
      description: 当前用户是否拥有至少一个航小伴后台能力
