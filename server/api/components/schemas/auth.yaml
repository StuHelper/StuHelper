LoginURLResponse:
  type: object
  required: [url, state]
  properties:
    url:
      type: string
      format: uri
    state:
      type: string
      description: OAuth state parameter for CSRF protection

CallbackResponse:
  type: object
  required: [user, expiresIn]
  properties:
    user:
      $ref: '#/UserInfo'
    expiresIn:
      type: integer
      description: Access token TTL in seconds

RefreshResponse:
  type: object
  required: [expiresIn]
  properties:
    expiresIn:
      type: integer

UserInfo:
  type: object
  required: [id, name, displayName]
  properties:
    id:
      type: string
    name:
      type: string
    displayName:
      type: string
    avatar:
      type: string
    email:
      type: string
    isAdmin:
      type: boolean
