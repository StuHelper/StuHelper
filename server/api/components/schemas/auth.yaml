LoginURLResponse:
  type: object
  required: [url, state]
  properties:
    url:
      type: string
      format: uri
    state:
      type: string
      description: OAuth state parameter for CSRF protection

CallbackResponse:
  type: object
  required: [user, expiresIn]
  properties:
    user:
      $ref: '#/UserInfo'
    expiresIn:
      type: integer
      description: Access token TTL in seconds

RefreshResponse:
  type: object
  required: [expiresIn]
  properties:
    expiresIn:
      type: integer

CapabilityGrant:
  type: object
  required: [name, global]
  properties:
    name:
      type: string
    scopeSchoolIDs:
      type: array
      items:
        type: string
    scopeRoles:
      type: array
      items:
        type: string
    global:
      type: boolean

UserInfo:
  type: object
  required: [id, name, displayName, capabilities, globalCapabilities, capabilityGrants, canAccessAdmin, isPlatformAdmin]
  properties:
    id:
      type: string
    name:
      type: string
    displayName:
      type: string
    avatar:
      type: string
    email:
      type: string
    isPlatformAdmin:
      type: boolean
      description: Casdoor 平台管理员标记，不代表航小伴业务管理员
    capabilities:
      type: array
      items:
        type: string
      description: 用户当前拥有的全部能力名称，包含全局授权与带 scope 的授权
    globalCapabilities:
      type: array
      items:
        type: string
      description: 当前前端可直接消费的全局能力集合，不含学校或角色范围限制
    capabilityGrants:
      type: array
      items:
        $ref: '#/CapabilityGrant'
      description: 完整能力授权明细，保留学校范围和角色范围等约束信息
    canAccessAdmin:
      type: boolean
      description: 当前用户是否拥有至少一个可直接进入现有后台界面的全局能力
