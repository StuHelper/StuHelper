ReviewReport:
  type: object
  required: [id, reviewID, reason, status, createdAt]
  properties:
    id:
      type: string
      format: uuid
    reviewID:
      type: string
      format: uuid
    review:
      $ref: 'review.yaml#/Review'
    reason:
      type: string
      enum: [spam, inappropriate, harassment, false_info, other]
    description:
      type: string
    status:
      type: string
      enum: [pending, resolved, rejected]
    resolvedBy:
      type:
        - string
        - 'null'
    resolvedAt:
      type:
        - string
        - 'null'
      format: date-time
    resolutionNote:
      type:
        - string
        - 'null'
    createdAt:
      type: string
      format: date-time

ProcessReportRequest:
  type: object
  required: [action]
  properties:
    action:
      type: string
      enum: [reject, hide, delete]
    note:
      type: string
      maxLength: 500

AdminUpdateReviewRequest:
  type: object
  required: [action]
  properties:
    action:
      type: string
      enum: [hide, restore, delete]
      description: restore 对 pending_review 状态表示审核通过并发布
    reason:
      type: string
      maxLength: 500

BatchUpdateReviewsRequest:
  type: object
  required: [ids, action]
  properties:
    ids:
      type: array
      items:
        type: string
        format: uuid
      minItems: 1
      maxItems: 100
    action:
      type: string
      enum: [hide, restore, delete]
      description: restore 对 pending_review 状态表示审核通过并发布

BatchUpdateResult:
  type: object
  required: [message, affected]
  properties:
    message:
      type: string
    affected:
      type: integer
      format: int64

AdminStats:
  type: object
  required: [totalReviews, publishedReviews, hiddenReviews, deletedReviews, pendingReports, totalReports, todayReviews, weekReviews]
  properties:
    totalReviews:
      type: integer
    publishedReviews:
      type: integer
    hiddenReviews:
      type: integer
    deletedReviews:
      type: integer
    pendingReports:
      type: integer
    totalReports:
      type: integer
    todayReviews:
      type: integer
    weekReviews:
      type: integer

AdminEditReviewRequest:
  type: object
  required: [content]
  properties:
    title:
      type: string
      maxLength: 200
    content:
      type: string
      minLength: 1
      maxLength: 5000
    reason:
      type: string
      maxLength: 500

AdminTeacher:
  type: object
  required: [id, name, createdAt]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    departmentID:
      type:
        - integer
        - 'null'
      format: int64
    departmentName:
      type:
        - string
        - 'null'
    reviewCount:
      type: integer
    createdAt:
      type: string
      format: date-time

CreateTeacherRequest:
  type: object
  required: [name, departmentID]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    departmentID:
      type: integer
      format: int64

UpdateTeacherRequest:
  type: object
  required: [name]
  properties:
    name:
      type: string
      minLength: 1
      maxLength: 100
    departmentID:
      type:
        - integer
        - 'null'
      format: int64

AdminSensitiveWord:
  type: object
  required: [id, word, category, level, isActive, createdAt]
  properties:
    id:
      type: string
      format: uuid
    word:
      type: string
    category:
      type: string
    level:
      type: string
      enum: [block, warn, review]
    isActive:
      type: boolean
    createdAt:
      type: string
      format: date-time

CreateSensitiveWordRequest:
  type: object
  required: [word]
  properties:
    word:
      type: string
      minLength: 1
      maxLength: 100
    category:
      type: string
      maxLength: 50
      default: general
    level:
      type: string
      enum: [block, warn, review]
      default: block

UpdateSensitiveWordRequest:
  type: object
  properties:
    word:
      type: string
      minLength: 1
      maxLength: 100
    category:
      type: string
      maxLength: 50
    level:
      type: string
      enum: [block, warn, review]
    isActive:
      type: boolean

AdminOperationLog:
  type: object
  required: [id, adminUserID, adminUsername, action, resourceType, resourceID, createdAt]
  properties:
    id:
      type: string
      format: uuid
    adminUserID:
      type: string
      format: uuid
    adminUsername:
      type: string
    action:
      type: string
    resourceType:
      type: string
    resourceID:
      type: string
    oldValue:
      type: object
      additionalProperties: true
    newValue:
      type: object
      additionalProperties: true
    ipAddress:
      type: string
    userAgent:
      type: string
    createdAt:
      type: string
      format: date-time
