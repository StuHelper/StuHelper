AuthorizationRole:
  type: string
  description: StuHelper 固定管理员角色；角色与 scope 组合由服务端白名单校验。
  enum:
    - super_admin
    - school_admin
    - section_admin
    - section_moderator
    - section_reviewer

AuthorizationDesiredState:
  type: string
  description: PostgreSQL 授权账本中的期望状态。
  enum: [granted, revoked]

AuthorizationProjectionStatus:
  type: string
  description: 授权期望状态向 OpenFGA 运行时关系面的投影状态。
  enum: [pending, applied, failed]

AuthorizationGrant:
  type: object
  required:
    - id
    - subjectUserID
    - subjectUsername
    - subjectDisplayName
    - role
    - desiredState
    - projectionStatus
    - revision
    - reason
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
      format: int64
      minimum: 1
    subjectUserID:
      type: integer
      format: int64
      minimum: 1
    subjectUsername:
      type: string
    subjectDisplayName:
      type: string
    role:
      $ref: '#/AuthorizationRole'
    schoolID:
      type: integer
      format: int64
      minimum: 1
      description: school_admin 与 section_* 角色必填；super_admin 不得提供。
    sectionID:
      type: string
      minLength: 1
      description: section_* 角色必填；当前只接受受支持的 review-moderation section ID。
    desiredState:
      $ref: '#/AuthorizationDesiredState'
    projectionStatus:
      $ref: '#/AuthorizationProjectionStatus'
    revision:
      type: integer
      format: int64
      minimum: 1
      description: grant/revoke/reconcile 每次变更时单调递增，用于隔离陈旧 outbox 投影。
    reason:
      type: string
      minLength: 1
      maxLength: 500
    activatedAt:
      type: string
      format: date-time
    revokedAt:
      type: string
      format: date-time
    projectedAt:
      type: string
      format: date-time
    lastError:
      type: string
      maxLength: 1000
      description: 最近一次终态投影失败的脱敏错误摘要。
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

AuthorizationGrantList:
  type: object
  required: [list, total]
  properties:
    list:
      type: array
      items:
        $ref: '#/AuthorizationGrant'
    total:
      type: integer
      minimum: 0

CreateAuthorizationGrantRequest:
  type: object
  additionalProperties: false
  required: [subjectUserID, role, reason]
  properties:
    subjectUserID:
      type: integer
      format: int64
      minimum: 1
    role:
      $ref: '#/AuthorizationRole'
    schoolID:
      type: integer
      format: int64
      minimum: 1
      description: school_admin 与 section_* 角色必填；super_admin 不得提供。
    sectionID:
      type: string
      minLength: 1
      description: section_* 角色必填；其他角色不得提供。
    reason:
      type: string
      minLength: 1
      maxLength: 500
      description: 必填的授权业务理由，会写入不可变审计。

AuthorizationGrantMutationRequest:
  type: object
  additionalProperties: false
  required: [reason]
  properties:
    reason:
      type: string
      minLength: 1
      maxLength: 500
      description: 必填的撤销或对账理由，会写入不可变审计。

AuthorizationGrantMutationResult:
  type: object
  required: [grant, changed]
  properties:
    grant:
      $ref: '#/AuthorizationGrant'
    changed:
      type: boolean
      description: false 表示相同目标状态已生效，本次请求按幂等成功处理。
