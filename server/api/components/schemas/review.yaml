ReviewRatings:
  type: object
  additionalProperties:
    type: integer
    minimum: 1
    maximum: 5
  description: "Map of dimension key to rating value (1-5)"

Review:
  type: object
  required: [id, courseID, title, termID, content, ratings, likeCount, dislikeCount, replyCount, status, createdAt]
  properties:
    id:
      type: string
      format: uuid
    courseID:
      type: integer
      format: int64
    courseName:
      type: string
    teacherID:
      type: integer
      format: int64
      nullable: true
    teacherName:
      type: string
    termID:
      type: string
    termName:
      type: string
    title:
      type: string
    content:
      type: string
    grade:
      type: string
    ratings:
      $ref: '#/ReviewRatings'
    likeCount:
      type: integer
    dislikeCount:
      type: integer
    replyCount:
      type: integer
    status:
      type: string
      enum: [published, hidden, deleted]
    moderationReason:
      type: string
      nullable: true
      description: 屏蔽原因（仅 hidden 状态时存在）
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

PostReviewRequest:
  type: object
  required: [courseID, title, termID, content, ratings]
  properties:
    courseID:
      type: integer
      format: int64
      minimum: 1
    teacherID:
      type: integer
      format: int64
      minimum: 1
    termID:
      type: string
      maxLength: 20
      pattern: '^\d{4}-[12]$'
    title:
      type: string
      maxLength: 200
    content:
      type: string
      minLength: 10
      maxLength: 5000
    grade:
      type: string
    ratings:
      $ref: '#/ReviewRatings'

UpdateReviewRequest:
  type: object
  required: [content, ratings]
  properties:
    title:
      type: string
      maxLength: 200
    content:
      type: string
      minLength: 10
      maxLength: 5000
    grade:
      type: string
    ratings:
      $ref: '#/ReviewRatings'

VoteRequest:
  type: object
  required: [voteType]
  properties:
    voteType:
      type: string
      enum: [like, dislike]

ReportReviewRequest:
  type: object
  required: [reason]
  properties:
    reason:
      type: string
      enum: [spam, inappropriate, harassment, false_info, other]
    description:
      type: string
      maxLength: 500

Reply:
  type: object
  required: [id, reviewID, content, likeCount, status, isOwner, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    reviewID:
      type: string
      format: uuid
    parentID:
      type: string
      format: uuid
      nullable: true
    content:
      type: string
    likeCount:
      type: integer
    status:
      type: string
    isOwner:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateReplyRequest:
  type: object
  required: [content]
  properties:
    parentID:
      type: string
      format: uuid
    content:
      type: string
      minLength: 1
      maxLength: 1000

ReviewDraft:
  type: object
  required: [id, courseID, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    courseID:
      type: integer
      format: int64
    teacherID:
      type: integer
      format: int64
      nullable: true
    termID:
      type: string
    title:
      type: string
    content:
      type: string
    grade:
      type: string
    ratings:
      $ref: '#/ReviewRatings'
    updatedAt:
      type: string
      format: date-time

SaveDraftRequest:
  type: object
  required: [courseID]
  properties:
    courseID:
      type: integer
      format: int64
      minimum: 1
    teacherID:
      type: integer
      format: int64
      minimum: 1
    termID:
      type: string
      maxLength: 20
      pattern: '^\d{4}-[12]$'
    title:
      type: string
      maxLength: 200
    content:
      type: string
      maxLength: 5000
    grade:
      type: string
    ratings:
      $ref: '#/ReviewRatings'

ContentCheckRequest:
  type: object
  required: [content]
  properties:
    content:
      type: string

ContentCheckResult:
  type: object
  required: [isValid]
  properties:
    isValid:
      type: boolean
    level:
      type: string
      enum: [block, warn]
    matchCount:
      type: integer

QualityCheckResult:
  type: object
  properties:
    score:
      type: integer
      minimum: 0
      maximum: 100
    suggestions:
      type: array
      items:
        type: string

ContentCheckResponse:
  type: object
  properties:
    sensitive:
      $ref: '#/ContentCheckResult'
    quality:
      $ref: '#/QualityCheckResult'

HotCourse:
  type: object
  required: [courseID, courseName, reviewCount, avgRating]
  properties:
    courseID:
      type: integer
      format: int64
    courseName:
      type: string
    reviewCount:
      type: integer
    avgRating:
      type: number
      format: double

ReviewStats:
  type: object
  required: [courseCount, reviewCount, departmentCount]
  properties:
    courseCount:
      type: integer
    reviewCount:
      type: integer
    departmentCount:
      type: integer
