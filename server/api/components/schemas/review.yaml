ReviewRatings:
  type: object
  additionalProperties:
    type: integer
    minimum: 1
    maximum: 5
  description: "Map of dimension key to rating value (1-5)"

VoteType:
  type: string
  enum: [like, dislike]
  x-enum-varnames: [VoteTypeLike, VoteTypeDislike]

Review:
  type: object
  required:
    [
      id,
      courseID,
      title,
      termID,
      content,
      ratings,
      likeCount,
      dislikeCount,
      replyCount,
      status,
      createdAt,
    ]
  properties:
    id:
      type: string
      format: uuid
    courseID:
      type: integer
      format: int64
    courseName:
      type: string
    teacherID:
      type:
        - integer
        - "null"
      format: int64
    teacherName:
      type: string
    termID:
      type: string
    termName:
      type: string
    title:
      type: string
    content:
      type: string
    grade:
      type: string
      enum: [A+, A, A-, B+, B, B-, C+, C, C-, D, F]
    ratings:
      $ref: "#/ReviewRatings"
    likeCount:
      type: integer
    dislikeCount:
      type: integer
    userVote:
      $ref: "#/VoteType"
      description: 当前已认证用户对该测评的投票；匿名或未投票时省略
    replyCount:
      type: integer
    status:
      type: string
      enum: [published, pending_review, hidden, deleted]
    contentFlag:
      type: string
      enum: [warn, review, cleared]
      description: 内容审核标记；review 表示待人工复核，warn 表示已发布但需关注
    moderationReason:
      type:
        - string
        - "null"
      description: 屏蔽原因（仅 hidden 状态时存在）
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

PostReviewRequest:
  type: object
  required: [courseID, title, termID, content, ratings]
  properties:
    courseID:
      type: integer
      format: int64
      minimum: 1
    teacherID:
      type: integer
      format: int64
      minimum: 1
    termID:
      type: string
      maxLength: 20
      pattern: '^\d{4}-[12]$'
    title:
      type: string
      minLength: 1
      maxLength: 200
    content:
      type: string
      minLength: 10
      maxLength: 5000
    grade:
      type: string
      enum: [A+, A, A-, B+, B, B-, C+, C, C-, D, F]
    ratings:
      $ref: "#/ReviewRatings"

UpdateReviewRequest:
  type: object
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 200
    content:
      type: string
      minLength: 10
      maxLength: 5000
    grade:
      type: string
      enum: [A+, A, A-, B+, B, B-, C+, C, C-, D, F]
    ratings:
      $ref: "#/ReviewRatings"

VoteRequest:
  type: object
  required: [voteType]
  properties:
    voteType:
      $ref: "#/VoteType"

ReportReviewRequest:
  type: object
  required: [reason]
  properties:
    reason:
      type: string
      enum: [spam, inappropriate, harassment, false_info, other]
    description:
      type: string
      maxLength: 500

Reply:
  type: object
  required:
    [id, reviewID, content, likeCount, status, isOwner, createdAt, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    reviewID:
      type: string
      format: uuid
    parentID:
      type:
        - string
        - "null"
      format: uuid
    content:
      type: string
    likeCount:
      type: integer
    status:
      type: string
    isOwner:
      type: boolean
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

CreateReplyRequest:
  type: object
  required: [content]
  properties:
    parentID:
      type: string
      format: uuid
    content:
      type: string
      minLength: 1
      maxLength: 1000

ReviewDraft:
  type: object
  required: [id, updatedAt]
  properties:
    id:
      type: string
      format: uuid
    courseID:
      type: integer
      format: int64
    teacherID:
      type:
        - integer
        - "null"
      format: int64
    termID:
      type: string
    title:
      type: string
    content:
      type: string
    grade:
      type: string
      enum: [A+, A, A-, B+, B, B-, C+, C, C-, D, F]
    ratings:
      $ref: "#/ReviewRatings"
    updatedAt:
      type: string
      format: date-time

SaveDraftRequest:
  type: object
  properties:
    courseID:
      type: integer
      format: int64
      minimum: 1
    teacherID:
      type: integer
      format: int64
      minimum: 1
    termID:
      type: string
      maxLength: 20
      pattern: '^\d{4}-[12]$'
    title:
      type: string
      minLength: 1
      maxLength: 200
    content:
      type: string
      maxLength: 5000
    grade:
      type: string
      enum: [A+, A, A-, B+, B, B-, C+, C, C-, D, F]
    ratings:
      $ref: "#/ReviewRatings"

ContentCheckRequest:
  type: object
  required: [content]
  properties:
    content:
      type: string
      minLength: 1
      maxLength: 5000

ContentCheckResult:
  type: object
  required: [isValid]
  properties:
    isValid:
      type: boolean
    level:
      type: string
      enum: [block, warn]
    matchCount:
      type: integer

HotCourse:
  type: object
  required: [courseID, courseName, reviewCount, avgRating]
  properties:
    courseID:
      type: integer
      format: int64
    courseName:
      type: string
    reviewCount:
      type: integer
    avgRating:
      type: number
      format: double

ReviewStats:
  type: object
  required: [courseCount, reviewCount, departmentCount, userCount]
  properties:
    courseCount:
      type: integer
    reviewCount:
      type: integer
    departmentCount:
      type: integer
    userCount:
      type: integer

TeacherSummary:
  type: object
  required: [teacherID, teacherName, reviewCount, courseCount]
  properties:
    teacherID:
      type: integer
      format: int64
    teacherName:
      type: string
    departmentName:
      type: string
    reviewCount:
      type: integer
    courseCount:
      type: integer
    avgRating:
      type: number
      format: double
