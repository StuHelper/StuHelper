AdmissionStatus:
  type: string
  enum: [joined_muted, linked, material_submitted, verified, expired_kicked, cancelled]

FreshmanApplicationStatus:
  type: string
  enum: [pending, approved, rejected]

AdmissionErrorCode:
  type: string
  enum:
    - admission.qq_mismatch
    - admission.token_consumed
    - admission.token_expired
    - admission.token_not_found
    - admission.session_not_found

AdmissionSession:
  type: object
  required:
    [id, platform, guildID, qqID, status, tokenExpiresAt, linkWaitDeadlineAt, submissionWaitDeadlineAt, initialMuteUntil, projectionPending]
  properties:
    id:
      type: string
    platform:
      type: string
    botSelfID:
      type: string
    guildID:
      type: string
    channelID:
      type: string
    qqID:
      type: string
    userID:
      type: string
    status:
      $ref: '#/AdmissionStatus'
    tokenExpiresAt:
      type: string
      format: date-time
    tokenConsumedAt:
      type:
        - string
        - "null"
      format: date-time
    linkWaitDeadlineAt:
      type: string
      format: date-time
    submissionWaitDeadlineAt:
      type: string
      format: date-time
    manualReviewDeadlineAt:
      type:
        - string
        - "null"
      format: date-time
    initialMuteUntil:
      type: string
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    cancelledAt:
      type:
        - string
        - "null"
      format: date-time
    lastBotError:
      type:
        - string
        - "null"
    projectionPending:
      type: boolean
    failureCount:
      type: integer
      minimum: 0
    remainingRetryCount:
      type: integer
      minimum: 0
    willBlacklistOnTimeout:
      type: boolean
    authURL:
      type: string
      format: uri
    maxMaterialBytes:
      type: integer
      format: int64

AdmissionMe:
  type: object
  required: [status, projectionPending]
  properties:
    status:
      $ref: '#/AdmissionStatus'
    projectionPending:
      type: boolean
    session:
      $ref: '#/AdmissionSession'
    credentialKind:
      type: string
      enum: [school_sso, school_email_otp, freshman_material_manual]
    provisionalExpiresAt:
      type:
        - string
        - "null"
      format: date-time

CreatedAdmissionSession:
  type: object
  required: [session, token, authURL]
  properties:
    session:
      $ref: '#/AdmissionSession'
    token:
      type: string
    authURL:
      type: string
      format: uri

AdmissionQQAccess:
  type: object
  required: [canJoin]
  properties:
    canJoin:
      type: boolean
    reason:
      type: string
    autoApproveJoin:
      type: boolean

AdmissionPolicy:
  type: object
  required:
    [id, platform, guildID, guardEnabled, autoApproveJoin, autoApproveVerifiedJoin, autoApproveUnverifiedJoin, initialMuteDurationSeconds, linkWaitSeconds, submissionWaitSeconds, manualReviewTimeoutSeconds, reminderIntervalSeconds, failedJoinLimit, freshmanChannelEnabled, freshmanChannelClosesAt, freshmanDefaultExpiresAt, forwardRawMaterialToQQ, managementGuildIDs, maxMaterialBytes, maxExtensionDays]
  properties:
    id:
      type: string
    platform:
      type: string
    guildID:
      type: string
    guardEnabled:
      type: boolean
      default: true
      description: 是否把该目标群同步为 Koishi 入群认证守卫绑定。
    autoApproveJoin:
      type: boolean
      deprecated: true
    autoApproveVerifiedJoin:
      type: boolean
      default: true
    autoApproveUnverifiedJoin:
      type: boolean
      default: true
    initialMuteDurationSeconds:
      type: integer
    linkWaitSeconds:
      type: integer
    submissionWaitSeconds:
      type: integer
    manualReviewTimeoutSeconds:
      type: integer
    reminderIntervalSeconds:
      type: integer
    failedJoinLimit:
      type: integer
    blacklistDurationSeconds:
      type:
        - integer
        - "null"
    freshmanChannelEnabled:
      type: boolean
    freshmanChannelClosesAt:
      type: string
      format: date-time
    freshmanDefaultExpiresAt:
      type: string
      format: date-time
    forwardRawMaterialToQQ:
      type: boolean
    managementGuildIDs:
      type: array
      items:
        type: string
    maxMaterialBytes:
      type: integer
      format: int64
    maxExtensionDays:
      type: integer

AdmissionPolicyCreateRequest:
  type: object
  required: [sourcePolicyID, platform, guildID]
  properties:
    sourcePolicyID:
      type: string
      description: 要复制运行参数的已有 admission policy ID。
    platform:
      type: string
      default: qq
    guildID:
      type: string
      description: 新生认证目标群号。

BotAdmissionPolicyTarget:
  type: object
  required: [policyID, platform, guildID, guardEnabled]
  properties:
    policyID:
      type: string
    platform:
      type: string
    guildID:
      type: string
    guardEnabled:
      type: boolean
      description: 是否启用该目标群的 Koishi 入群认证守卫。

FreshmanApplication:
  type: object
  required: [id, userID, schoolID, status, applicantNameMasked, materialType, createdAt]
  properties:
    id:
      type: string
    userID:
      type: string
    schoolID:
      type: integer
      format: int64
    admissionSessionID:
      type: string
    applicantName:
      type: string
    applicantNameMasked:
      type: string
    departmentOrMajor:
      type: string
    materialType:
      type: string
      enum: [admission_notice, admission_certificate]
    materialURL:
      type: string
      format: uri
    qqID:
      type: string
    failureCount:
      type: integer
    status:
      $ref: '#/FreshmanApplicationStatus'
    provisionalExpiresAt:
      type:
        - string
        - "null"
      format: date-time
    reviewedAt:
      type:
        - string
        - "null"
      format: date-time
    createdAt:
      type: string
      format: date-time

FreshmanReviewRequest:
  type: object
  required: [action]
  properties:
    action:
      type: string
      enum: [approve, reject]
    reason:
      type: string
    expiresInDays:
      type: integer
      minimum: 1

BotFreshmanCommandContext:
  type: object
  required: [operatorQQID, guildID, rawCommand]
  properties:
    operatorQQID:
      type: string
    platform:
      type: string
    targetGuildID:
      type: string
    guildID:
      type: string
    channelID:
      type: string
    rawCommand:
      type: string

BotFreshmanReviewRequest:
  allOf:
    - $ref: '#/FreshmanReviewRequest'
    - $ref: '#/BotFreshmanCommandContext'

BotAdmissionSessionCreateRequest:
  type: object
  required: [platform, guildID, channelID, qqID, botSelfID]
  properties:
    platform:
      type: string
    guildID:
      type: string
    channelID:
      type: string
    qqID:
      type: string
    botSelfID:
      type: string

BotAdmissionSessionSubjectRequest:
  type: object
  required: [platform, guildID, qqID]
  properties:
    platform:
      type: string
    guildID:
      type: string
    qqID:
      type: string

BotAdmissionSessionOperatorRequest:
  allOf:
    - $ref: '#/BotAdmissionSessionSubjectRequest'
    - type: object
      required: [operatorQQID]
      properties:
        operatorQQID:
          type: string

BotAdmissionFailureResetResult:
  type: object
  required: [platform, guildID, qqID, previousFailureCount]
  properties:
    platform:
      type: string
    guildID:
      type: string
    qqID:
      type: string
    previousFailureCount:
      type: integer
      minimum: 0

BotAdmissionEventRequest:
  type: object
  required: [action, success]
  properties:
    action:
      type: string
      enum: [mute, remind, release, kick, blacklist, forward]
    success:
      type: boolean
    messageID:
      type: string
    error:
      type: string

BotAdmissionPendingAction:
  type: object
  required: [sessionID, action]
  properties:
    actionID:
      type: string
      description: 持久化 bot action outbox ID。SSE 下行动作会携带，ACK 时应提交到 actions/{id}/events。
    sessionID:
      type: string
    action:
      type: string
      enum: [remind, release, kick, blacklist]
    platform:
      type: string
    botSelfID:
      type: string
    guildID:
      type: string
    channelID:
      type: string
    qqID:
      type: string
    authURL:
      type: string
      format: uri
    deadlineAt:
      type: string
      format: date-time
    reason:
      type: string
    failureCount:
      type: integer
      minimum: 0
    remainingRetryCount:
      type: integer
      minimum: 0
    willBlacklistOnTimeout:
      type: boolean

BotAdmissionJoinRequestEvent:
  type: object
  required: [platform, guildID, qqID, requestID, success]
  properties:
    platform:
      type: string
    guildID:
      type: string
    qqID:
      type: string
    requestID:
      type: string
    decision:
      type: string
      enum: [approve, reject]
    success:
      type: boolean
    error:
      type: string
    rawEvent:
      type: object
      additionalProperties: true

BotAdmissionJoinRequestDecisionRequest:
  type: object
  required: [platform, guildID, qqID, requestID]
  properties:
    platform:
      type: string
    guildID:
      type: string
    qqID:
      type: string
    requestID:
      type: string
    rawEvent:
      type: object
      additionalProperties: true

BotAdmissionJoinRequestDecision:
  type: object
  required: [decision, verificationState, autoApproveVerifiedJoin, autoApproveUnverifiedJoin]
  properties:
    decision:
      type: string
      enum: [approve, reject]
    reason:
      type: string
    verificationState:
      type: string
      enum: [verified, unverified]
    autoApproveVerifiedJoin:
      type: boolean
    autoApproveUnverifiedJoin:
      type: boolean
    policyID:
      type: string
    userID:
      type: string

CameraCaptureRequest:
  type: object
  required: [contentType, imageBase64]
  properties:
    contentType:
      type: string
      enum: [image/jpeg, image/png, image/webp]
    imageBase64:
      type: string
    capturedAt:
      type: string
      format: date-time

FreshmanCameraHandoff:
  type: object
  required: [id, applicationID, userID, status, expiresAt, createdAt, maxMaterialBytes]
  properties:
    id:
      type: string
    applicationID:
      type: string
    userID:
      type: string
    status:
      type: string
      enum: [pending, uploaded, locked, expired]
    continueOn:
      type: string
      enum: [desktop, mobile]
    mobileURL:
      type: string
      format: uri
    expiresAt:
      type: string
      format: date-time
    uploadedAt:
      type: string
      format: date-time
    chosenAt:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    maxMaterialBytes:
      type: integer
      format: int64

FreshmanCameraHandoffContinuationRequest:
  type: object
  required: [continueOn]
  properties:
    continueOn:
      type: string
      enum: [desktop, mobile]

SchoolEmailAcademicMatchRequest:
  type: object
  required: [schoolCode, studentID, studentName]
  properties:
    schoolCode:
      type: string
      pattern: '^[0-9]{10}$'
      description: 教育部学校标识码；即时学籍匹配必须以此字段识别学校。
    admissionSessionID:
      type: string
      description: 当前 Join 页面绑定的 admission session ID；用于确认匹配请求属于当前页面 session。
    studentID:
      type: string
      description: 学号。
    studentName:
      type: string
      description: 姓名。

SchoolEmailAcademicMatchResponse:
  type: object
  required: [matched]
  properties:
    matched:
      type: boolean
      description: 学号和姓名是否在学校学籍数据源中匹配。
    email:
      type: string
      format: email
      description: 匹配通过后由后端按学号派生出的学校邮箱。
    studentID:
      type: string
      description: 规范化后的学号。
    message:
      type: string
      description: 面向前端展示的匹配提示。

SchoolEmailOTPRequest:
  type: object
  required: [schoolCode]
  properties:
    schoolCode:
      type: string
      pattern: '^[0-9]{10}$'
      description: 教育部学校标识码；公开 admission 学校邮箱 OTP 请求必须以此字段识别学校。
    admissionSessionID:
      type: string
      description: 当前 Join 页面绑定的 admission session ID；用于多群/多会话时校验 OTP 请求属于当前页面 session。
    email:
      type: string
      format: email
      description: 普通学校邮箱 OTP 可直接提交邮箱；配置学籍邮箱策略时由后端按学号派生并校验不可篡改
    studentID:
      type: string
      description: 配置 academic_student_email 策略的学校必填
    studentName:
      type: string
      description: 配置 academic_student_email 且 requireStudentName=true 的学校必填

SchoolEmailOTPVerifyRequest:
  type: object
  required: [schoolCode, email, code]
  properties:
    schoolCode:
      type: string
      pattern: '^[0-9]{10}$'
      description: 教育部学校标识码；公开 admission 学校邮箱 OTP 校验请求必须以此字段识别学校。
    admissionSessionID:
      type: string
      description: 当前 Join 页面绑定的 admission session ID；用于多群/多会话时返回当前页面 session 的 admission 状态。
    email:
      type: string
      format: email
    code:
      type: string
      minLength: 4
      maxLength: 12

SchoolEmailOTPResponse:
  type: object
  required: [email, cooldownSeconds]
  properties:
    email:
      type: string
      format: email
      description: 后端最终锁定并发送验证码的学校邮箱
    studentID:
      type: string
      description: 学籍邮箱策略下已匹配的学号
    cooldownSeconds:
      type: integer
      minimum: 1
