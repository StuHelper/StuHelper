AdmissionStatus:
  type: string
  enum:
    - created
    - awaiting_account_link
    - awaiting_requirements
    - pending_manual_review
    - eligible
    - action_pending
    - admitted
    - released
    - rejected
    - cancelled
    - expired
AdmissionErrorCode:
  type: string
  enum:
    - admission.member_blacklisted
    - admission.qq_mismatch
    - admission.token_consumed
    - admission.token_expired
    - admission.token_not_found
    - admission.session_not_found

AdmissionSession:
  type: object
  required:
    [id, platform, guildID, qqID, status, tokenExpiresAt, linkWaitDeadlineAt, submissionWaitDeadlineAt, initialMuteUntil, projectionPending]
  properties:
    id:
      type: string
    platform:
      type: string
    botSelfID:
      type: string
    guildID:
      type: string
    channelID:
      type: string
    qqID:
      type: string
    userID:
      type: string
    status:
      $ref: '#/AdmissionStatus'
    tokenExpiresAt:
      type: string
      format: date-time
    tokenConsumedAt:
      type:
        - string
        - "null"
      format: date-time
    linkWaitDeadlineAt:
      type: string
      format: date-time
    submissionWaitDeadlineAt:
      type: string
      format: date-time
    manualReviewDeadlineAt:
      type:
        - string
        - "null"
      format: date-time
    initialMuteUntil:
      type: string
      format: date-time
    verifiedAt:
      type:
        - string
        - "null"
      format: date-time
    cancelledAt:
      type:
        - string
        - "null"
      format: date-time
    lastBotError:
      type:
        - string
        - "null"
    eligibilityRevision:
      type:
        - integer
        - "null"
      format: int64
      minimum: 1
      description: Monotonic student-eligibility fence used by this admission decision.
    eligibilityEvaluatedAt:
      type:
        - string
        - "null"
      format: date-time
    projectionPending:
      type: boolean
    failureCount:
      type: integer
      minimum: 0
    remainingRetryCount:
      type: integer
      minimum: 0
    willBlacklistOnTimeout:
      type: boolean
    authURL:
      type: string
      format: uri

AdmissionMe:
  type: object
  required: [status, projectionPending]
  properties:
    status:
      $ref: '#/AdmissionStatus'
    projectionPending:
      type: boolean
    session:
      $ref: '#/AdmissionSession'

CreatedAdmissionSession:
  type: object
  required: [session, token, authURL]
  properties:
    session:
      $ref: '#/AdmissionSession'
    token:
      type: string
    authURL:
      type: string
      format: uri

AdmissionQQAccess:
  type: object
  required: [canJoin]
  properties:
    canJoin:
      type: boolean
    reason:
      type: string
    autoApproveJoin:
      type: boolean

AdmissionPolicy:
  type: object
  required:
    [id, platform, guildID, guardEnabled, joinHandlingStrategy, autoApproveJoin, autoApproveVerifiedJoin, autoApproveUnverifiedJoin, unverifiedJoinRejectReason, initialMuteDurationSeconds, linkWaitSeconds, submissionWaitSeconds, manualReviewTimeoutSeconds, reminderIntervalSeconds, failedJoinLimit, allowTemporaryFreshman]
  properties:
    id:
      type: string
    platform:
      type: string
    guildID:
      type: string
    guardEnabled:
      type: boolean
      default: true
      description: 是否把该目标群同步为 Koishi 入群认证守卫绑定。
    joinHandlingStrategy:
      type: string
      enum: [post_join_guard, join_request_review, post_join_time_code]
      default: post_join_guard
      description: 入群处理策略。post_join_guard 表示加群后禁言并发送认证链接；join_request_review 表示在加群申请阶段按 StuHelper 学生认证状态自动通过或拒绝；post_join_time_code 表示 Koishi 先同意入群申请，成员入群后在群内发送动态验证码完成验证，超时未验证则移出群聊。
    autoApproveJoin:
      type: boolean
      deprecated: true
    autoApproveVerifiedJoin:
      type: boolean
      default: true
    autoApproveUnverifiedJoin:
      type: boolean
      default: true
      deprecated: true
    unverifiedJoinRejectReason:
      type: string
      description: join_request_review 策略下，未完成 StuHelper 学生认证时返回给 QQ 入群申请的拒绝理由。
    initialMuteDurationSeconds:
      type: integer
    linkWaitSeconds:
      type: integer
    submissionWaitSeconds:
      type: integer
    manualReviewTimeoutSeconds:
      type: integer
    reminderIntervalSeconds:
      type: integer
    failedJoinLimit:
      type: integer
    blacklistDurationSeconds:
      type:
        - integer
        - "null"
    allowTemporaryFreshman:
      type: boolean
      default: false
      description: 是否允许有效期内的临时新生凭据满足本群准入；正式学生凭据不受此开关影响。

AdmissionPolicyCreateRequest:
  type: object
  required: [sourcePolicyID, platform, guildID]
  properties:
    sourcePolicyID:
      type: string
      description: 要复制运行参数的已有 admission policy ID。
    platform:
      type: string
      default: qq
    guildID:
      type: string
      description: 入群认证目标群号。

BotAdmissionPolicyTarget:
  type: object
  required: [policyID, platform, guildID, guardEnabled, joinHandlingStrategy, linkWaitSeconds, managementGuildIDs]
  properties:
    policyID:
      type: string
    platform:
      type: string
    guildID:
      type: string
    guardEnabled:
      type: boolean
      description: 是否启用该目标群的 Koishi 入群认证守卫。
    joinHandlingStrategy:
      type: string
      enum: [post_join_guard, join_request_review, post_join_time_code]
      description: 该目标群当前使用的入群处理策略。
    linkWaitSeconds:
      type: integer
      description: |
        入群后等待秒数。`post_join_guard` 下表示学生认证链接等待时间；`post_join_time_code`
        下表示群内动态验证码等待时间，Koishi 会按该值生成本地超时踢出期限。
    managementGuildIDs:
      type: array
      items:
        type: string
      description: |
        由 PostgreSQL admission policy 下发的 QQ 管理群白名单。Koishi 只能把它用于固定的
        管理通知和受权命令边界，不得接受 webhook 或事件载荷覆盖目标群。
BotAdmissionSessionCreateRequest:
  type: object
  required: [platform, guildID, channelID, qqID, botSelfID]
  properties:
    platform:
      type: string
    guildID:
      type: string
    channelID:
      type: string
    qqID:
      type: string
    botSelfID:
      type: string

BotAdmissionSessionSubjectRequest:
  type: object
  required: [platform, guildID, qqID]
  properties:
    platform:
      type: string
    guildID:
      type: string
    qqID:
      type: string

BotAdmissionSessionOperatorRequest:
  allOf:
    - $ref: '#/BotAdmissionSessionSubjectRequest'
    - type: object
      required: [operatorQQID]
      properties:
        operatorQQID:
          type: string

BotAdmissionFailureResetResult:
  type: object
  required: [platform, guildID, qqID, previousFailureCount]
  properties:
    platform:
      type: string
    guildID:
      type: string
    qqID:
      type: string
    previousFailureCount:
      type: integer
      minimum: 0

BotAdmissionEventRequest:
  type: object
  required: [action, success]
  properties:
    action:
      type: string
      enum: [mute, remind, release, kick, blacklist, forward]
    success:
      type: boolean
    messageID:
      type: string
    error:
      type: string

BotAdmissionActionEventRequest:
  allOf:
    - $ref: '#/BotAdmissionEventRequest'
    - type: object
      required: [dispatchAttempt]
      properties:
        dispatchAttempt:
          type: integer
          minimum: 1
          description: 领取 action 时返回的派发代次。服务端仅接受当前代次的 ACK。

BotAdmissionPendingAction:
  type: object
  required: [sessionID, action]
  properties:
    actionID:
      type: string
      description: 持久化 bot action outbox ID。SSE 下行动作会携带，ACK 时应提交到 actions/{id}/events。
    dispatchAttempt:
      type: integer
      minimum: 1
      description: actionID 对应的派发代次；ACK 时必须原样提交。
    eligibilityRevision:
      type: integer
      format: int64
      minimum: 1
      description: release 动作使用的学生资格修订号；执行器不得修改或缓存为学生身份真源。
    sessionID:
      type: string
    action:
      type: string
      enum: [remind, release, kick, blacklist]
    platform:
      type: string
    botSelfID:
      type: string
    guildID:
      type: string
    channelID:
      type: string
    qqID:
      type: string
    authURL:
      type: string
      format: uri
    deadlineAt:
      type: string
      format: date-time
    reason:
      type: string
    failureCount:
      type: integer
      minimum: 0
    remainingRetryCount:
      type: integer
      minimum: 0
    willBlacklistOnTimeout:
      type: boolean

BotAdmissionJoinRequestEvent:
  type: object
  required: [platform, guildID, qqID, requestID, success]
  properties:
    platform:
      type: string
    guildID:
      type: string
    qqID:
      type: string
    requestID:
      type: string
    decision:
      type: string
      enum: [approve, reject]
    success:
      type: boolean
    error:
      type: string
    rawEvent:
      type: object
      additionalProperties: true

BotAdmissionJoinRequestDecisionRequest:
  type: object
  required: [platform, guildID, qqID, requestID]
  properties:
    platform:
      type: string
    guildID:
      type: string
    qqID:
      type: string
    requestID:
      type: string
    rawEvent:
      type: object
      additionalProperties: true

BotAdmissionJoinRequestDecision:
  type: object
  required: [decision, verificationState, joinHandlingStrategy, autoApproveVerifiedJoin, autoApproveUnverifiedJoin]
  properties:
    decision:
      type: string
      enum: [approve, reject]
    reason:
      type: string
    verificationState:
      type: string
      enum: [verified, unverified]
    joinHandlingStrategy:
      type: string
      enum: [post_join_guard, join_request_review, post_join_time_code]
    autoApproveVerifiedJoin:
      type: boolean
    autoApproveUnverifiedJoin:
      type: boolean
    policyID:
      type: string
    userID:
      type: string
