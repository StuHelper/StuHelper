OpenPlatformScope:
  type: string
  enum:
    - profile.basic.read
    - email.read
    - phone.read
    - stu.identity.status.read
    - stu.identity.type.read
    - stu.student.status.read
    - stu.student.school.read
    - resource.read
    - resource.write

OpenPlatformScopeDefinition:
  type: object
  required: [scope, displayName, sensitivity, fields]
  properties:
    scope:
      $ref: '#/OpenPlatformScope'
    displayName:
      type: string
    sensitivity:
      type: string
      enum: [low, medium, high, very_high]
    fields:
      type: array
      items:
        type: string

OpenPlatformAuthorizeResponse:
  type: object
  properties:
    redirectURL:
      type: string
      format: uri
      description: 已授权时返回的 Casdoor OIDC authorize URL。
    consentURL:
      type: string
      format: uri-reference
      description: 需要用户确认授权时返回的 StuHelper 授权页 URL。
    scopes:
      type: array
      items:
        $ref: '#/OpenPlatformScopeDefinition'

OpenPlatformConsentApp:
  type: object
  required: [id, clientID, displayName, description, homepageURL, privacyPolicyURL]
  properties:
    id:
      type: integer
      format: int64
    clientID:
      type: string
    displayName:
      type: string
    description:
      type: string
    homepageURL:
      type: string
      format: uri
    privacyPolicyURL:
      type: string
      format: uri

OpenPlatformConsentPage:
  type: object
  required: [token, app, scopes, redirectURI, expiresAt]
  properties:
    token:
      type: string
    app:
      $ref: '#/OpenPlatformConsentApp'
    scopes:
      type: array
      items:
        $ref: '#/OpenPlatformScopeDefinition'
    redirectURI:
      type: string
      format: uri
    expiresAt:
      type: string
      format: date-time

OpenPlatformConsentDecisionRequest:
  type: object
  required: [token]
  properties:
    token:
      type: string

OpenPlatformRedirectResponse:
  type: object
  required: [redirectURL]
  properties:
    redirectURL:
      type: string
      format: uri-reference

OpenPlatformApp:
  type: object
  required:
    - id
    - clientID
    - displayName
    - description
    - homepageURL
    - privacyPolicyURL
    - redirectURIs
    - status
    - createdAt
    - updatedAt
  properties:
    id:
      type: integer
      format: int64
    clientID:
      type: string
    displayName:
      type: string
    description:
      type: string
    homepageURL:
      type: string
      format: uri
    privacyPolicyURL:
      type: string
      format: uri
    redirectURIs:
      type: array
      items:
        type: string
        format: uri
    status:
      type: string
      enum: [pending, approved, suspended, revoked]
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time

OpenPlatformScopeRequestInput:
  type: object
  required: [scope]
  properties:
    scope:
      $ref: '#/OpenPlatformScope'
    reason:
      type: string

OpenPlatformRegisterAppRequest:
  type: object
  required: [displayName, homepageURL, privacyPolicyURL, redirectURIs, scopes]
  properties:
    displayName:
      type: string
    description:
      type: string
    homepageURL:
      type: string
      format: uri
    privacyPolicyURL:
      type: string
      format: uri
    redirectURIs:
      type: array
      minItems: 1
      items:
        type: string
        format: uri
    scopes:
      type: array
      minItems: 1
      items:
        $ref: '#/OpenPlatformScopeRequestInput'

OpenPlatformRegisteredApp:
  type: object
  required: [app]
  properties:
    app:
      $ref: '#/OpenPlatformApp'
    clientSecret:
      type: string
      description: 注册阶段不返回 client secret；管理员批准应用后才返回。

OpenPlatformApprovedApp:
  type: object
  required: [app, clientSecret]
  properties:
    app:
      $ref: '#/OpenPlatformApp'
    clientSecret:
      type: string
      description: 只在批准时返回一次，调用方必须自行保存。

OpenPlatformApproveScopeRequest:
  type: object
  properties:
    decisionNote:
      type: string

OpenPlatformSchoolDisclosure:
  type: object
  required: [id, name]
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string

OpenPlatformDisclosure:
  type: object
  additionalProperties: true
  properties:
    username:
      type: string
    displayName:
      type: string
    avatar:
      type: string
      format: uri-reference
    email:
      type: string
      format: email
    phone:
      type: string
      pattern: '^1[3-9]\d{9}$'
    phoneMasked:
      type: string
    phoneVerified:
      type: boolean
    identityVerified:
      type: boolean
    identityType:
      type: string
      enum: [student, other]
    studentVerified:
      type: boolean
    school:
      $ref: '#/OpenPlatformSchoolDisclosure'
