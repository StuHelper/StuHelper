Course:
  type: object
  required: [id, name, credits, departmentID, reviewCount]
  properties:
    id:
      type: integer
      format: int64
    schoolID:
      type: integer
      format: int64
    departmentID:
      type:
        - integer
        - "null"
      format: int64
      description: 课程尚未归类到院系时为 null。
    departmentName:
      type: string
    code:
      type: string
    name:
      type: string
    credits:
      type:
        - number
        - "null"
      format: double
      description: 数据源未提供学分时为 null，不得以 0 代替未知值。
    category:
      type: string
    reviewCount:
      type: integer
    isFavorited:
      type: boolean
      description: 当前登录用户是否已收藏（未登录时不返回此字段）

Department:
  type: object
  required: [id, name, category]
  properties:
    id:
      type: integer
      format: int64
    schoolID:
      type: integer
      format: int64
    name:
      type: string
    shortName:
      type: string
    category:
      type: string
    sortOrder:
      type: integer

CourseCategory:
  type: object
  required: [id, name]
  properties:
    id:
      type: integer
      format: int64
    schoolID:
      type: integer
      format: int64
    name:
      type: string
    sortOrder:
      type: integer

Term:
  type: object
  required: [id, name, isCurrent]
  properties:
    id:
      type: string
    schoolID:
      type: integer
      format: int64
    name:
      type: string
    isCurrent:
      type: boolean

FavoriteCourse:
  allOf:
    - $ref: '#/Course'
    - type: object
      required: [favoritedAt]
      properties:
        favoritedAt:
          type: string
          format: date-time

FavoriteStatusData:
  type: object
  required: [favorited]
  properties:
    favorited:
      type: boolean

CourseStats:
  type: object
  required: [courseCount, departmentCount]
  properties:
    courseCount:
      type: integer
    departmentCount:
      type: integer

DepartmentGroup:
  type: object
  required: [departmentID, departmentName, courses]
  properties:
    departmentID:
      type:
        - integer
        - "null"
      format: int64
      description: 未分类课程分组为 null。
    departmentName:
      type:
        - string
        - "null"
      description: 未分类课程分组为 null。
    courses:
      type: array
      items:
        $ref: '#/Course'
