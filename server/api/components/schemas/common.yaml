SuccessResponse:
  type: object
  required: [success]
  properties:
    success:
      type: boolean
      enum: [true]

ErrorResponseBody:
  type: object
  required: [success, error]
  properties:
    success:
      type: boolean
      enum: [false]
    error:
      $ref: '#/APIError'

APIError:
  type: object
  required: [code, message]
  properties:
    code:
      type: string
      example: "A00400"
    message:
      type: string
    details:
      type: object
      additionalProperties: true

MessageData:
  type: object
  required: [message]
  properties:
    message:
      type: string
