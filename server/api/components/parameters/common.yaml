PageParam:
  name: page
  in: query
  description: 页码
  schema:
    type: integer
    default: 1
    minimum: 1

PageSizeParam:
  name: pageSize
  in: query
  description: 每页数量
  schema:
    type: integer
    default: 20
    minimum: 1
    maximum: 100

CourseIDPath:
  name: courseID
  in: path
  required: true
  description: 课程 ID
  schema:
    type: integer
    format: int64

ReviewIDPath:
  name: reviewID
  in: path
  required: true
  description: 测评 ID
  schema:
    type: string
    format: uuid

TeacherIDPath:
  name: teacherID
  in: path
  required: true
  description: 教师 ID
  schema:
    type: integer
    format: int64

NotificationIDPath:
  name: notificationID
  in: path
  required: true
  description: 通知 ID
  schema:
    type: string
    format: uuid

DraftCourseIDPath:
  name: courseID
  in: path
  required: true
  description: 课程 ID（用于草稿）
  schema:
    type: integer
    format: int64

ReplyIDPath:
  name: replyID
  in: path
  required: true
  description: 回复 ID
  schema:
    type: string
    format: uuid

ReportIDPath:
  name: reportID
  in: path
  required: true
  description: 举报 ID
  schema:
    type: string
    format: uuid

SensitiveWordIDPath:
  name: sensitiveWordID
  in: path
  required: true
  description: 敏感词 ID
  schema:
    type: string
    format: uuid
