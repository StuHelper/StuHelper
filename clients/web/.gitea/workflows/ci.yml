name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'clients/web/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'clients/web/**'

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          # TODO: Gitea Actions 可能不完全支持 setup-node 内置缓存，如不生效可移除此行
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json
      - name: Install dependencies
        working-directory: clients/web
        run: npm ci
      - name: Type check
        working-directory: clients/web
        run: npm run type-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json
      - name: Install dependencies
        working-directory: clients/web
        run: npm ci
      - name: Lint
        working-directory: clients/web
        run: npm run lint

  build:
    runs-on: ubuntu-latest
    needs: [type-check, lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: clients/web/package-lock.json
      - name: Install dependencies
        working-directory: clients/web
        run: npm ci
      - name: Build
        working-directory: clients/web
        run: npm run build
