name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'clients/web/course/**'
  pull_request:
    branches: [main, develop]
    paths:
      - 'clients/web/course/**'

jobs:
  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: clients/web/course/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: clients/web/course
        run: pnpm install --frozen-lockfile
      - name: Type check
        working-directory: clients/web/course
        run: pnpm run type-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: clients/web/course/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: clients/web/course
        run: pnpm install --frozen-lockfile
      - name: ESLint
        working-directory: clients/web/course
        run: pnpm exec eslint . --ext .ts,.tsx,.vue
      - name: Prettier check
        working-directory: clients/web/course
        run: pnpm exec prettier --check "src/**/*.{ts,tsx,vue,css,json}"

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: clients/web/course/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: clients/web/course
        run: pnpm install --frozen-lockfile
      - name: Run tests
        working-directory: clients/web/course
        run: |
          if pnpm exec vitest --version > /dev/null 2>&1; then
            pnpm exec vitest --run
          else
            echo "No test runner found, skipping tests"
          fi

  build:
    runs-on: ubuntu-latest
    needs: [type-check, lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: clients/web/course/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: clients/web/course
        run: pnpm install --frozen-lockfile
      - name: Build
        working-directory: clients/web/course
        run: pnpm run build
