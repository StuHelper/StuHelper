workflow:
  rules:
  - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  - if: '$CI_COMMIT_BRANCH == "develop"'
  - if: '$CI_COMMIT_BRANCH == "main"'
  - when: never

stages:
- lint
- test
- security
- build
- package
- deploy
- verify

default:
  interruptible: true

.pnpm_setup: &pnpm_setup
  - corepack enable
  - corepack prepare pnpm@10 --activate

variables:
  REGISTRY: registry.stuhelper.com
  BACKEND_IMAGE: registry.stuhelper.com/stuhelper/backend
  FRONTEND_IMAGE: registry.stuhelper.com/stuhelper/frontend
  ADMIN_IMAGE: registry.stuhelper.com/stuhelper/admin
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: /certs/client

include:
- local: ".gitlab/server-ci.yml"
- local: ".gitlab/cd.yml"

.playwright_job:
  stage: test
  image: mcr.microsoft.com/playwright:v1.58.2-noble
  before_script: *pnpm_setup
  variables:
    CI: "true"

.node_pnpm_job:
  image: node:24-bookworm
  before_script: *pnpm_setup

.docker_job:
  image: docker:27.5.1-cli
  services:
  - name: docker:27.5.1-dind

.trivy_scan_job:
  extends: .docker_job
  stage: security
  before_script:
  - apk add --no-cache curl tar
  - export TRIVY_VERSION=0.58.2
  - curl -fsSL "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" | tar -xz -C /usr/local/bin trivy

check_shadow_files:
  stage: lint
  image: alpine:3.21
  script:
  - apk add --no-cache bash findutils
  - bash scripts/check-uniappx-shadow-files.sh

check_docs_hygiene:
  stage: lint
  image: node:24-bookworm
  script:
  - make check-docs

frontend_lint:
  stage: lint
  extends: .node_pnpm_job
  script:
  - cd clients
  - pnpm install --frozen-lockfile
  - pnpm run check:no-empty-catch
  - pnpm --filter @stuhelper/web lint
  - pnpm --filter @stuhelper/web exec prettier --check .

koishi_test:
  stage: test
  image: node:24-bookworm
  before_script:
  - corepack enable
  - corepack prepare yarn@4.12.0 --activate
  script:
  - cd bots/koishi
  - corepack yarn install --immutable
  - corepack yarn test

admin_lint:
  stage: lint
  extends: .node_pnpm_job
  script:
  - cd clients/admin
  - pnpm install --frozen-lockfile
  - pnpm lint

frontend_typecheck:
  stage: test
  extends: .node_pnpm_job
  script:
  - cd clients
  - pnpm install --frozen-lockfile
  - pnpm run type-check

admin_typecheck:
  stage: test
  extends: .node_pnpm_job
  script:
  - cd clients/admin
  - pnpm install --frozen-lockfile
  - pnpm --filter @vben/web-ele typecheck

prod_init_contract:
  stage: test
  image: python:3.13-bookworm
  before_script:
  - apt-get update
  - apt-get install -y openssl
  script:
  - bash infra/ops/tests/init-prod-env-contract.sh

infra_contract:
  stage: test
  image: python:3.13-bookworm
  before_script:
  - apt-get update
  - apt-get install -y openssl
  script:
  - for test_script in infra/ops/tests/*.sh; do bash "${test_script}"; done

frontend_test:
  stage: test
  extends: .node_pnpm_job
  script:
  - cd clients
  - pnpm install --frozen-lockfile
  - pnpm run test:all

admin_unit_test:
  stage: test
  extends: .node_pnpm_job
  script:
  - cd clients/admin
  - pnpm install --frozen-lockfile
  - pnpm test

frontend_e2e:
  extends: .playwright_job
  script:
  - cd clients
  - pnpm install --frozen-lockfile
  - pnpm --filter @stuhelper/web test:e2e
  artifacts:
    when: always
    paths:
    - clients/web/playwright-report
    - clients/web/test-results

admin_e2e:
  extends: .playwright_job
  script:
  - cd clients/admin
  - pnpm install --frozen-lockfile
  - pnpm --filter @vben/web-ele test:e2e
  artifacts:
    when: always
    paths:
    - clients/admin/apps/web-ele/playwright-report
    - clients/admin/apps/web-ele/test-results

frontend_dependency_scan:
  stage: security
  extends: .node_pnpm_job
  script:
  - cd clients
  - pnpm install --frozen-lockfile
  - pnpm audit --audit-level=high --prod

admin_dependency_scan:
  stage: security
  extends: .node_pnpm_job
  script:
  - cd clients/admin
  - pnpm install --frozen-lockfile
  - pnpm audit --audit-level=high --prod

frontend_sast:
  stage: security
  image: semgrep/semgrep:1.128.0
  script:
  - semgrep scan --config=p/vuejs --config=p/typescript --error clients/web/src clients/admin/apps/web-ele/src

container_scan_backend:
  extends: .trivy_scan_job
  script:
  - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
  - trivy image --severity HIGH,CRITICAL --exit-code 1 --no-progress "${BACKEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}"
  needs:
  - docker_build_backend
container_scan_frontend:
  extends: .trivy_scan_job
  script:
  - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
  - trivy image --severity HIGH,CRITICAL --exit-code 1 --no-progress "${FRONTEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}"
  needs:
  - docker_build_frontend
container_scan_admin:
  extends: .trivy_scan_job
  script:
  - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
  - trivy image --severity HIGH,CRITICAL --exit-code 1 --no-progress "${ADMIN_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}"
  needs:
  - docker_build_admin
frontend_build:
  stage: build
  extends: .node_pnpm_job
  script:
  - cd clients
  - pnpm install --frozen-lockfile
  - ': "${WEB_VITE_SSO_URL:?WEB_VITE_SSO_URL must be set for frontend builds}"'
  - export VITE_SSO_URL="${WEB_VITE_SSO_URL}"
  - pnpm run build:web

admin_build:
  stage: build
  extends: .node_pnpm_job
  script:
  - cd clients/admin
  - pnpm install --frozen-lockfile
  - pnpm build:ele

docker_build_backend:
  extends: .docker_job
  stage: build
  script:
  - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
  - export BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
  - docker buildx create --use --name "gitlab-builder-${CI_JOB_ID}"
  - docker buildx build --push --platform linux/amd64 --tag "${BACKEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}" --build-arg "VERSION=${CI_COMMIT_SHORT_SHA}" --build-arg "GIT_COMMIT=${CI_COMMIT_SHA}" --build-arg "BUILD_TIME=${BUILD_TIME}" --cache-from "type=registry,ref=${BACKEND_IMAGE}:buildcache" --cache-to "type=registry,ref=${BACKEND_IMAGE}:buildcache,mode=max" server
docker_build_frontend:
  extends: .docker_job
  stage: build
  script:
  - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
  - export BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
  - docker buildx create --use --name "gitlab-builder-${CI_JOB_ID}"
  - ': "${WEB_VITE_SSO_URL:?WEB_VITE_SSO_URL must be set for frontend builds}"'
  - docker buildx build --push --platform linux/amd64 --file clients/web/Dockerfile --tag "${FRONTEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}" --build-arg "VITE_API_URL=${WEB_VITE_API_URL:-/api}" --build-arg "VITE_SSO_URL=${WEB_VITE_SSO_URL}" --build-arg "VITE_API_TIMEOUT_MS=${WEB_VITE_API_TIMEOUT_MS:-15000}" --cache-from "type=registry,ref=${FRONTEND_IMAGE}:buildcache" --cache-to "type=registry,ref=${FRONTEND_IMAGE}:buildcache,mode=max" clients
docker_build_admin:
  extends: .docker_job
  stage: build
  script:
  - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
  - export BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
  - docker buildx create --use --name "gitlab-builder-${CI_JOB_ID}"
  - docker buildx build --push --platform linux/amd64 --file clients/admin/scripts/deploy/Dockerfile --tag "${ADMIN_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}" --build-arg "VITE_GLOB_API_URL=${ADMIN_VITE_API_URL:-/api/v1}" --build-arg "VITE_BASE=${ADMIN_VITE_BASE:-/admin/}" --cache-from "type=registry,ref=${ADMIN_IMAGE}:buildcache" --cache-to "type=registry,ref=${ADMIN_IMAGE}:buildcache,mode=max" clients/admin
