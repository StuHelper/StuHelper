groups:
  - name: stuhelper-application
    interval: 30s
    rules:
      - alert: StuHelperApiDown
        expr: up{job="app"} == 0
        for: 2m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: StuHelper backend is unreachable
          description: The backend metrics endpoint has been unreachable for more than 2 minutes.

      - alert: StuHelperHigh5xxRate
        expr: |
          sum(rate(http_requests_total{job="app",status=~"5..",path!~"/health/.*|unknown"}[5m]))
            /
          clamp_min(sum(rate(http_requests_total{job="app",path!~"/health/.*|unknown"}[5m])), 0.001)
          > 0.05
        for: 10m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: StuHelper backend 5xx rate is high
          description: 5xx ratio has been above 5% for 10 minutes.

      - alert: StuHelperHighLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, method, path) (rate(http_request_duration_seconds_bucket{path!~"/health/.*|unknown"}[5m]))
          ) > 1
        for: 15m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: StuHelper API p95 latency is high
          description: API p95 latency has exceeded 1 second for 15 minutes.

      - alert: StuHelperDBQueryErrors
        expr: sum(rate(db_queries_total{status="error"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: Database query errors are elevated
          description: Database query error rate is above 1 req/s over the last 10 minutes.

      - alert: StuHelperDependencyErrors
        expr: sum by (client, operation) (rate(external_requests_total{status="error"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: External dependency errors detected
          description: '{{ $labels.client }} {{ $labels.operation }} error rate is above 0.1 req/s.'

      - alert: StuHelperOutboxTerminalFailures
        expr: increase(outbox_job_failures_total{terminal="true"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: Outbox job reached terminal retry threshold
          description: '{{ $labels.worker }} {{ $labels.job_type }} exceeded its configured retry limit.'

      - alert: StuHelperRefreshTokenReuseDetected
        expr: increase(auth_refresh_token_reuse_total[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: Refresh token reuse detected
          description: 'Refresh token reuse was detected for token family {{ $labels.token_family }}.'

      - alert: StuHelperIAMDriftReconciliationThresholdExceeded
        expr: increase(iam_drift_reconciliation_threshold_exceeded_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: IAM drift reconciliation exceeded automatic repair threshold
          description: '{{ $labels.domain }} drift reconciliation paused automatic repair and needs manual confirmation.'

      - alert: StuHelperOpenPlatformDisclosureReplayDetected
        expr: increase(open_platform_disclosure_replay_total{outcome="detected"}[5m]) > 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: Open Platform disclosure replay detected
          description: 'Repeated Open Platform disclosure attempts were detected on endpoint {{ $labels.endpoint }}.'

      - alert: StuHelperOpenPlatformDisclosureDeniedSpike
        expr: sum(rate(open_platform_disclosure_requests_total{result!~"ok|audit_unavailable"}[5m])) > 1
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: Open Platform disclosure denials are elevated
          description: Disclosure denial rate has been above 1 req/s for 10 minutes.

      - alert: StuHelperOpenPlatformDisclosureRateLimited
        expr: sum(rate(open_platform_disclosure_requests_total{result="rate_limited"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: Open Platform disclosure rate limits are firing
          description: Disclosure rate limiting has exceeded 0.1 req/s for 5 minutes.

      - alert: StuHelperRedisPoolTimeouts
        expr: increase(redis_pool_timeouts_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: Redis connection pool timeouts detected
          description: Redis pool timeouts increased over the last 10 minutes.

      - alert: StuHelperSSEDrops
        expr: increase(sse_dropped_events_total[10m]) > 0
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: SSE events are being dropped
          description: Notification SSE buffers overflowed during the last 10 minutes.

      - alert: StuHelperFrontendProbeFailed
        expr: probe_success{job="blackbox-http",instance="http://frontend/"} == 0
        for: 5m
        labels:
          severity: critical
          team: frontend
        annotations:
          summary: StuHelper frontend probe failed
          description: The frontend blackbox probe has failed for 5 minutes.

      - alert: StuHelperFrontendErrors
        expr: sum(rate(frontend_errors_total[10m])) > 0.1
        for: 15m
        labels:
          severity: warning
          team: frontend
        annotations:
          summary: Frontend runtime errors are elevated
          description: Frontend runtime error reporting has exceeded 0.1 events/s for 15 minutes.

      - alert: StuHelperCasdoorProbeFailed
        expr: probe_success{job="blackbox-http",instance="https://sso.stuhelper.com/.well-known/openid-configuration"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: Casdoor OIDC metadata probe failed
          description: The external Casdoor OIDC metadata endpoint has failed blackbox probing for 5 minutes.

      - alert: StuHelperIdentityProbeFailed
        expr: probe_success{job="blackbox-http",instance="https://id.stuhelper.com/.well-known/openid-configuration"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: StuHelper Identity OIDC metadata probe failed
          description: The public StuHelper Identity OIDC metadata endpoint has failed blackbox probing for 5 minutes.

      - alert: StuHelperOpenFGAGRPCProbeFailed
        expr: probe_success{job="blackbox-tcp",instance="openfga:8081"} == 0
        for: 5m
        labels:
          severity: critical
          team: platform
        annotations:
          summary: OpenFGA gRPC health probe failed
          description: The OpenFGA gRPC endpoint has failed TCP probing for 5 minutes.
