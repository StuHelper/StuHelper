---
- name: Roll back StuHelper release
  hosts: stuhelper
  gather_facts: false
  vars:
    rollback_tag: "{{ lookup('env', 'ROLLBACK_TAG') }}"
    registry_pull_token: "{{ lookup('env', 'REGISTRY_PULL_TOKEN') }}"
    registry_username: "{{ lookup('env', 'REGISTRY_USERNAME') }}"
  pre_tasks:
    - name: Require separate SSH and rollback identities
      ansible.builtin.assert:
        that:
          - ansible_user is defined
          - ansible_user == 'root'
          - deploy_user is defined
          - deploy_user | length > 0
          - deploy_user != 'root'
          - deploy_group is defined
          - deploy_group | length > 0
          - deploy_app_dir is defined
          - deploy_app_dir | length > 0
          - deploy_app_mode is defined
          - deploy_app_mode | string == '0750'
        fail_msg: >-
          rollback inventory must explicitly separate root SSH transport from
          the non-root 0750 deployment identity

    - name: Inspect rollback deploy directory boundary
      become: true
      ansible.builtin.stat:
        path: "{{ deploy_app_dir }}"
      register: deploy_directory

    - name: Refuse rollback when deploy directory boundary drifted
      ansible.builtin.assert:
        that:
          - deploy_directory.stat.exists
          - deploy_directory.stat.isdir
          - deploy_directory.stat.pw_name == deploy_user
          - deploy_directory.stat.gr_name == deploy_group
          - deploy_directory.stat.mode == deploy_app_mode
        fail_msg: >-
          rollback requires the existing deploy directory to retain the
          approved non-root ownership and 0750 mode

  tasks:
    - name: Require short-lived registry authentication for remote rollback
      ansible.builtin.assert:
        that:
          - rollback_tag | length > 0
          - registry_pull_token | length > 0
          - registry_username | length > 0
        fail_msg: >-
          ROLLBACK_TAG / REGISTRY_PULL_TOKEN / REGISTRY_USERNAME must be
          provided for rollback.yml

    - name: Run remote rollback
      become: true
      become_user: "{{ deploy_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ deploy_app_dir }}"
        ./infra/ops/remote-ci-release.sh rollback
      args:
        executable: /bin/bash
        stdin: "{{ registry_pull_token }}\n"
      no_log: true
      environment:
        CI_REGISTRY_USERNAME: "{{ registry_username }}"
        TAG: "{{ rollback_tag }}"
        ROLLBACK_TAG: "{{ rollback_tag }}"
