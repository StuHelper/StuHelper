---
- name: Deploy StuHelper release
  hosts: stuhelper
  gather_facts: false
  vars:
    deploy_app_dir: "{{ deploy_app_dir | default('/opt/stuhelper') }}"
    deploy_tag: "{{ lookup('env', 'DEPLOY_TAG') | default(lookup('pipe', 'git -C ../.. rev-parse --short HEAD'), true) }}"
    backend_image_ref: "{{ lookup('env', 'BACKEND_IMAGE_REF') }}"
    frontend_image_ref: "{{ lookup('env', 'FRONTEND_IMAGE_REF') }}"
    admin_image_ref: "{{ lookup('env', 'ADMIN_IMAGE_REF') }}"
    registry_pull_token: "{{ lookup('env', 'REGISTRY_PULL_TOKEN') }}"
    registry_username: "{{ lookup('env', 'REGISTRY_USERNAME') }}"
  tasks:
    - name: Require immutable image refs for remote deploy
      ansible.builtin.assert:
        that:
          - backend_image_ref | length > 0
          - frontend_image_ref | length > 0
          - admin_image_ref | length > 0
          - registry_pull_token | length > 0
          - registry_username | length > 0
        fail_msg: >-
          BACKEND_IMAGE_REF / FRONTEND_IMAGE_REF / ADMIN_IMAGE_REF /
          REGISTRY_PULL_TOKEN / REGISTRY_USERNAME must be provided for deploy.yml

    - name: Build deploy bundle on control node
      delegate_to: localhost
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/../../ops/build-deploy-bundle.sh"
      tags:
        - deploy-bundle

    - name: Ensure deploy directory exists
      ansible.builtin.file:
        path: "{{ deploy_app_dir }}"
        state: directory
        mode: "0755"

    - name: Upload deploy bundle
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../generated/deploy/stuhelper-deploy-bundle.tar.gz"
        dest: "{{ deploy_app_dir }}/deploy-bundle.tgz"
        mode: "0644"

    - name: Run remote deploy
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ deploy_app_dir }}"
        tar xzf deploy-bundle.tgz
        rm -f deploy-bundle.tgz
        ./infra/ops/remote-ci-release.sh deploy
      args:
        executable: /bin/bash
        stdin: "{{ registry_pull_token }}\n"
      no_log: true
      environment:
        CI_REGISTRY_USERNAME: "{{ registry_username }}"
        TAG: "{{ deploy_tag }}"
        BACKEND_IMAGE_REF: "{{ backend_image_ref }}"
        FRONTEND_IMAGE_REF: "{{ frontend_image_ref }}"
        ADMIN_IMAGE_REF: "{{ admin_image_ref }}"
