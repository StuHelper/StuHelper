---
- name: Deploy StuHelper release
  hosts: stuhelper
  gather_facts: false
  vars:
    deploy_tag: "{{ lookup('env', 'DEPLOY_TAG') | default(lookup('pipe', 'git -C ../.. rev-parse --short HEAD'), true) }}"
    backend_image_ref: "{{ lookup('env', 'BACKEND_IMAGE_REF') }}"
    frontend_image_ref: "{{ lookup('env', 'FRONTEND_IMAGE_REF') }}"
    admin_image_ref: "{{ lookup('env', 'ADMIN_IMAGE_REF') }}"
    registry_pull_token: "{{ lookup('env', 'REGISTRY_PULL_TOKEN') }}"
    registry_username: "{{ lookup('env', 'REGISTRY_USERNAME') }}"
  pre_tasks:
    - name: Require separate SSH and deployment identities
      ansible.builtin.assert:
        that:
          - ansible_user is defined
          - ansible_user == 'root'
          - deploy_user is defined
          - deploy_user | length > 0
          - deploy_user != 'root'
          - deploy_group is defined
          - deploy_group | length > 0
          - deploy_app_dir is defined
          - deploy_app_dir | length > 0
          - deploy_app_mode is defined
          - deploy_app_mode | string == '0750'
        fail_msg: >-
          inventory must use root only as the SSH transport identity and must
          explicitly declare the non-root deploy_user/deploy_group, deploy_app_dir,
          and deploy_app_mode=0750

    - name: Inspect existing deploy directory boundary
      become: true
      ansible.builtin.stat:
        path: "{{ deploy_app_dir }}"
      register: deploy_directory

    - name: Refuse ownership or mode drift in an existing deploy directory
      ansible.builtin.assert:
        that:
          - not deploy_directory.stat.exists or deploy_directory.stat.isdir
          - not deploy_directory.stat.exists or deploy_directory.stat.pw_name == deploy_user
          - not deploy_directory.stat.exists or deploy_directory.stat.gr_name == deploy_group
          - not deploy_directory.stat.exists or deploy_directory.stat.mode == deploy_app_mode
        fail_msg: >-
          existing deploy directory ownership or mode differs from the approved
          non-root 0750 boundary; repair it explicitly before deployment

  tasks:
    - name: Require immutable image refs for remote deploy
      ansible.builtin.assert:
        that:
          - backend_image_ref | length > 0
          - frontend_image_ref | length > 0
          - admin_image_ref | length > 0
          - registry_pull_token | length > 0
          - registry_username | length > 0
        fail_msg: >-
          BACKEND_IMAGE_REF / FRONTEND_IMAGE_REF / ADMIN_IMAGE_REF /
          REGISTRY_PULL_TOKEN / REGISTRY_USERNAME must be provided for deploy.yml

    - name: Build deploy bundle on control node
      delegate_to: localhost
      become: false
      ansible.builtin.command:
        argv:
          - "{{ playbook_dir }}/../../ops/build-deploy-bundle.sh"
      tags:
        - deploy-bundle

    - name: Ensure deploy directory exists
      become: true
      ansible.builtin.file:
        path: "{{ deploy_app_dir }}"
        state: directory
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "{{ deploy_app_mode }}"

    - name: Upload deploy bundle
      become: true
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../../generated/deploy/stuhelper-deploy-bundle.tar.gz"
        dest: "{{ deploy_app_dir }}/deploy-bundle.tgz"
        owner: "{{ deploy_user }}"
        group: "{{ deploy_group }}"
        mode: "0640"

    - name: Run remote deploy
      become: true
      become_user: "{{ deploy_user }}"
      ansible.builtin.shell: |
        set -euo pipefail
        cd "{{ deploy_app_dir }}"
        tar xzf deploy-bundle.tgz
        rm -f deploy-bundle.tgz
        ./infra/ops/remote-ci-release.sh deploy
      args:
        executable: /bin/bash
        stdin: "{{ registry_pull_token }}\n"
      no_log: true
      environment:
        CI_REGISTRY_USERNAME: "{{ registry_username }}"
        TAG: "{{ deploy_tag }}"
        BACKEND_IMAGE_REF: "{{ backend_image_ref }}"
        FRONTEND_IMAGE_REF: "{{ frontend_image_ref }}"
        ADMIN_IMAGE_REF: "{{ admin_image_ref }}"
