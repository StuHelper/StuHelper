# StuHelper PostgreSQL host-based authentication policy
#
# 设计目标：
# 1. 保留容器内本地 socket 管理入口；
# 2. 只允许来自 RFC1918 私网的容器网络访问；
# 3. 按数据库 / 角色限制连接，拒绝其他来源与未声明角色。

# Local admin / init scripts inside the container.
local   all             postgres                                trust
local   all             all                                     trust

# Application / service roles on private container networks.
host    stuhelper       stuhelper_app         10.0.0.0/8        scram-sha-256
host    stuhelper       stuhelper_app         172.16.0.0/12     scram-sha-256
host    stuhelper       stuhelper_app         192.168.0.0/16    scram-sha-256

host    stuhelper,postgres stuhelper_backup   10.0.0.0/8        scram-sha-256
host    stuhelper,postgres stuhelper_backup   172.16.0.0/12     scram-sha-256
host    stuhelper,postgres stuhelper_backup   192.168.0.0/16    scram-sha-256

host    postgres        stuhelper_metrics     10.0.0.0/8        scram-sha-256
host    postgres        stuhelper_metrics     172.16.0.0/12     scram-sha-256
host    postgres        stuhelper_metrics     192.168.0.0/16    scram-sha-256

host    replication     stuhelper_replication 10.0.0.0/8        scram-sha-256
host    replication     stuhelper_replication 172.16.0.0/12     scram-sha-256
host    replication     stuhelper_replication 192.168.0.0/16    scram-sha-256

host    casdoor         casdoor               10.0.0.0/8        scram-sha-256
host    casdoor         casdoor               172.16.0.0/12     scram-sha-256
host    casdoor         casdoor               192.168.0.0/16    scram-sha-256

host    openfga         openfga               10.0.0.0/8        scram-sha-256
host    openfga         openfga               172.16.0.0/12     scram-sha-256
host    openfga         openfga               192.168.0.0/16    scram-sha-256

# Default compose admin role over TCP is still restricted to private networks.
host    all             stuhelper             10.0.0.0/8        scram-sha-256
host    all             stuhelper             172.16.0.0/12     scram-sha-256
host    all             stuhelper             192.168.0.0/16    scram-sha-256

# PostgreSQL image default admin role, for deployments that set POSTGRES_USER.
host    all             postgres              10.0.0.0/8        scram-sha-256
host    all             postgres              172.16.0.0/12     scram-sha-256
host    all             postgres              192.168.0.0/16    scram-sha-256

# Default deny.
host    all             all                   0.0.0.0/0         reject
host    all             all                   ::/0              reject
