# StuHelper PostgreSQL production host-based authentication policy.
#
# Production enables PostgreSQL TLS and rejects non-TLS TCP before role-specific
# hostssl rules. The default infra/postgres/pg_hba.conf remains development
# compatible with POSTGRES_ENABLE_SSL=off.

# Local admin / init scripts inside the container.
local   all             postgres                                trust
local   all             all                                     trust

# Reject plaintext TCP on private container networks in production.
hostnossl all           all                   10.0.0.0/8        reject
hostnossl all           all                   172.16.0.0/12     reject
hostnossl all           all                   192.168.0.0/16    reject
hostnossl all           all                   0.0.0.0/0         reject
hostnossl all           all                   ::/0              reject

# Application / service roles on private container networks.
hostssl stuhelper       stuhelper_app         10.0.0.0/8        scram-sha-256
hostssl stuhelper       stuhelper_app         172.16.0.0/12     scram-sha-256
hostssl stuhelper       stuhelper_app         192.168.0.0/16    scram-sha-256

hostssl postgres        stuhelper_backup      10.0.0.0/8        scram-sha-256
hostssl postgres        stuhelper_backup      172.16.0.0/12     scram-sha-256
hostssl postgres        stuhelper_backup      192.168.0.0/16    scram-sha-256

hostssl replication     stuhelper_replication 10.0.0.0/8        scram-sha-256
hostssl replication     stuhelper_replication 172.16.0.0/12     scram-sha-256
hostssl replication     stuhelper_replication 192.168.0.0/16    scram-sha-256

hostssl casdoor         casdoor               10.0.0.0/8        scram-sha-256
hostssl casdoor         casdoor               172.16.0.0/12     scram-sha-256
hostssl casdoor         casdoor               192.168.0.0/16    scram-sha-256

hostssl openfga         openfga               10.0.0.0/8        scram-sha-256
hostssl openfga         openfga               172.16.0.0/12     scram-sha-256
hostssl openfga         openfga               192.168.0.0/16    scram-sha-256

# Default compose admin role over TCP is still restricted to private networks and TLS.
hostssl all             stuhelper             10.0.0.0/8        scram-sha-256
hostssl all             stuhelper             172.16.0.0/12     scram-sha-256
hostssl all             stuhelper             192.168.0.0/16    scram-sha-256

# PostgreSQL image default admin role, for deployments that set POSTGRES_USER.
hostssl all             postgres              10.0.0.0/8        scram-sha-256
hostssl all             postgres              172.16.0.0/12     scram-sha-256
hostssl all             postgres              192.168.0.0/16    scram-sha-256

# Default deny.
hostssl all             all                   0.0.0.0/0         reject
hostssl all             all                   ::/0              reject
