# TLS 配置（ACME / Let's Encrypt）
#
# 本文件为 TLS 终止桩配置，默认禁用。
# 启用方式：在 docker-compose.yml 的 proxy 服务中挂载此文件，
# 并设置环境变量 TRAEFIK_TLS_ENABLED=true。
#
# 证书存储卷 acme_data 需要在 docker-compose.yml 中声明。
# 详见 docs/guides/release-runbook.md 中的 TLS 终止策略章节。

tls:
  options:
    default:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      sniStrict: true
