# Baota/Nginx public ingress for the external Casdoor SSO host.
# Apply this on the host that serves sso.stuhelper.com, not on the main
# StuHelper application host unless Casdoor is colocated there.
#
# The critical rule is that /.well-known/* must be proxied to Casdoor. If Baota
# serves that path from a static site root, OIDC discovery returns the Casdoor SPA
# 404 page instead of JSON and all StuHelper Identity integrations fail.

server {
    listen 80;
    server_name sso.stuhelper.com;
    return 301 https://sso.stuhelper.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sso.stuhelper.com;

    # If sso.stuhelper.com has a dedicated certificate directory, replace these
    # two paths with /www/server/panel/vhost/cert/sso.stuhelper.com/{fullchain,privkey}.pem.
    ssl_certificate /www/server/panel/vhost/cert/stuhelper.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/stuhelper.com/privkey.pem;

    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    # OIDC discovery and JWKS must never fall through to Baota's static site root.
    # Current production SSO hosts Casdoor on 127.0.0.1:8087. If your external
    # SSO host uses another local port, replace the upstream consistently and run
    # nginx-public-ingress-preflight.sh with NGINX_PUBLIC_INGRESS_CASDOOR_UPSTREAM.
    location ^~ /.well-known/ {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
