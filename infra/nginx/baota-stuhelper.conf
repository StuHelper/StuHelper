# Baota/Nginx public ingress for stuhelper.com.
# Keep Docker services bound to 127.0.0.1; only Nginx listens on public 80/443.

server {
    listen 80;
    server_name stuhelper.com www.stuhelper.com;
    return 301 https://stuhelper.com$request_uri;
}

server {
    listen 80;
    server_name id.stuhelper.com;
    return 301 https://id.stuhelper.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.stuhelper.com;

    ssl_certificate /www/server/panel/vhost/cert/stuhelper.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/stuhelper.com/privkey.pem;

    return 301 https://stuhelper.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name stuhelper.com;

    ssl_certificate /www/server/panel/vhost/cert/stuhelper.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/stuhelper.com/privkey.pem;

    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location ^~ /health/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location = /metrics {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location ^~ /docs/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location = /admin {
        return 301 /admin/;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
    }
}

server {
    listen 443 ssl http2;
    server_name id.stuhelper.com;

    ssl_certificate /www/server/panel/vhost/cert/stuhelper.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/stuhelper.com/privkey.pem;

    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location ^~ /.well-known/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location ^~ /oauth2/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location ^~ /oidc/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location ^~ /health/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
    }
}
