# Baota/Nginx public ingress for stuhelper.com.
# Keep Docker services bound to 127.0.0.1; only Nginx listens on public 80/443.

server {
    listen 80;
    server_name stuhelper.com www.stuhelper.com;
    return 301 https://stuhelper.com$request_uri;
}

server {
    listen 80;
    server_name join.stuhelper.com;
    return 301 https://join.stuhelper.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.stuhelper.com;

    ssl_certificate /www/server/panel/vhost/cert/sso.stuhelper.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/sso.stuhelper.com/privkey.pem;

    return 301 https://stuhelper.com$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name stuhelper.com;

    ssl_certificate /www/server/panel/vhost/cert/sso.stuhelper.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/sso.stuhelper.com/privkey.pem;

    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location = /verify {
        return 404;
    }

    location ^~ /verify/ {
        return 404;
    }

    location = /start {
        return 404;
    }

    location ^~ /start/ {
        return 404;
    }

    location ^~ /api/v1/admission/freshman/camera-handoffs/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    location = /api/v1/bot/admission/actions/stream {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location ^~ /health/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location = /metrics {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location ^~ /docs/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /_app.config.js {
        return 404;
    }

    location ^~ /css/ {
        return 404;
    }

    location ^~ /js/ {
        return 404;
    }

    location ^~ /jse/ {
        return 404;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:18001;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name join.stuhelper.com;

    ssl_certificate /www/server/panel/vhost/cert/sso.stuhelper.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/sso.stuhelper.com/privkey.pem;

    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host $host;

    location = /verify {
        return 404;
    }

    location = /start {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
    }

    location ^~ /start/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
    }

    location ^~ /verify/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
    }

    location ^~ /admission/freshman/camera/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
    }

    location ^~ /api/v1/admission/freshman/camera-handoffs/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header X-Accel-Buffering no always;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location ^~ /health/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
    }

    location ^~ /assets/ {
        proxy_pass http://127.0.0.1:18000;
        proxy_http_version 1.1;
    }

    location / {
        return 404;
    }
}
