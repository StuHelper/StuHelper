    }

    location ^~ /signup {
        proxy_pass http://127.0.0.1:__CASDOOR_PORT__;
        proxy_http_version 1.1;
    }

    location ^~ /forget {
        proxy_pass http://127.0.0.1:__CASDOOR_PORT__;
        proxy_http_version 1.1;
    }

    location = /favicon.ico {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
    }

    location = /favicon-32x32.png {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
    }

    location = /favicon-16x16.png {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
