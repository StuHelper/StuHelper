# Local production-parity ingress for StuHelper.
# Installed by infra/ops/install-local-prod-parity-ingress.sh.
# Keep the Docker services bound to 127.0.0.1; only local Nginx listens on 80.

server {
    listen 80;
    server_name stuhelper.com www.stuhelper.com;

    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location = /identity {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location = /connect {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location = /login {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location = /auth/callback {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location = /consent {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location = /complete-profile {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location ^~ /developers/ {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location = /user/authorized-apps {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location = /user/identity-verification {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location = /user/student-verification {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location = /user/phone-binding {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location = /user/qq-binding {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location = /user/academic-info {
        return 302 $scheme://id.stuhelper.com$request_uri;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
    }

    location ^~ /health/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
    }

    location = /metrics {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
    }

    location ^~ /docs/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
    }

    location = /admin {
        return 301 /admin/;
    }

    location = /_app.config.js {
        proxy_pass http://127.0.0.1:__ADMIN_PORT__;
        proxy_http_version 1.1;
    }

    location ^~ /css/ {
        proxy_pass http://127.0.0.1:__ADMIN_PORT__;
        proxy_http_version 1.1;
    }

    location ^~ /js/ {
        proxy_pass http://127.0.0.1:__ADMIN_PORT__;
        proxy_http_version 1.1;
    }

    location ^~ /jse/ {
        proxy_pass http://127.0.0.1:__ADMIN_PORT__;
        proxy_http_version 1.1;
    }

    location ^~ /admin/ {
        proxy_pass http://127.0.0.1:__ADMIN_PORT__;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
    }
}

server {
    listen 80;
    server_name id.stuhelper.com;

    client_max_body_size 50m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    location ^~ /.well-known/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
    }

    location ^~ /oauth2/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
    }

    location ^~ /oidc/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
    }

    location ^~ /api/v1/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /api/ {
        proxy_pass http://127.0.0.1:__CASDOOR_PORT__;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
    }

    location ^~ /health/ {
        proxy_pass http://127.0.0.1:__BACKEND_PORT__;
        proxy_http_version 1.1;
    }

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, private" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        return 302 /identity;
    }

    location ^~ /login/oauth/ {
        proxy_pass http://127.0.0.1:__CASDOOR_PORT__;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location ^~ /signup/oauth/ {
        proxy_pass http://127.0.0.1:__CASDOOR_PORT__;
        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location = /login {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_http_version 1.1;
    }

    location = /auth/callback {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
