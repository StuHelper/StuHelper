# Baota extension snippet for sso.stuhelper.com.
#
# Put this file under:
#   /www/server/panel/vhost/nginx/extension/sso.stuhelper.com/
#
# Baota may rewrite the main sso.stuhelper.com vhost and append a static
# `location /.well-known` block for certificate validation. These exact
# locations keep OIDC discovery and JWKS proxied to Casdoor even after that
# rewrite, as long as the vhost keeps the standard extension include.

location = /.well-known/openid-configuration {
    proxy_pass http://127.0.0.1:8087;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location = /.well-known/jwks {
    proxy_pass http://127.0.0.1:8087;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location ^~ /.well-known/ {
    proxy_pass http://127.0.0.1:8087;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_http_version 1.1;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}
