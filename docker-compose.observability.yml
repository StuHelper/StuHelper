# StuHelper Docker Compose overlay: observability
# 与 docker-compose.yml 一起使用；公共网络/卷/secret 仍定义在主文件。

services:
  docker-socket-proxy:
    profiles: [observability, prod]
    image: ${DOCKER_SOCKET_PROXY_IMAGE_REF:-ghcr.io/tecnativa/docker-socket-proxy:latest@sha256:1f5038b54f06c3e18422902cf00ba21803d1c97805aae032e5e6673d532d3459}
    container_name: ${STACK_NAME:-stuhelper}-docker-socket-proxy
    environment:
      CONTAINERS: "1"
      EVENTS: "1"
      INFO: "1"
      NETWORKS: "1"
      PING: "1"
      POST: "0"
      VERSION: "1"
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:2375/_ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

    networks:
    - docker_api
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 64M
    read_only: true
    tmpfs:
    - /tmp
    - /run
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  alloy:
    profiles: [observability, prod]
    image: ${GRAFANA_ALLOY_IMAGE_REF:-grafana/alloy:v1.18.0@sha256:491b0578c04983fd54fe99b587b6fab4404dc46d0dc16677bd6b00cc1140b308}
    container_name: ${STACK_NAME:-stuhelper}-alloy
    environment:
      ALLOY_DOCKER_LOG_MAX_AGE: ${ALLOY_DOCKER_LOG_MAX_AGE:-1h}
      ALLOY_DOCKER_STREAM_TIMEOUT: ${ALLOY_DOCKER_STREAM_TIMEOUT:-24h}
      STACK_NAME: ${STACK_NAME:-stuhelper}
    user: "473:473"
    command:
    - run
    - --disable-reporting
    - --server.http.listen-addr=0.0.0.0:12345
    - --storage.path=/var/lib/alloy/data
    - /etc/alloy/config.alloy
    ports:
    - "127.0.0.1:${ALLOY_HTTP_PORT:-12345}:12345"
    - "127.0.0.1:${OTEL_GRPC_PORT:-4317}:4317"
    - "127.0.0.1:${OTEL_HTTP_PORT:-4318}:4318"
    volumes:
    - ./infra/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
    - alloy_data:/var/lib/alloy/data
    depends_on:
      docker-socket-proxy:
        condition: service_healthy
      loki:
        # Loki's current distroless image intentionally ships no shell or HTTP
        # client. Runtime readiness is monitored by Prometheus/blackbox; Alloy
        # will retry remote writes while Loki finishes its brief startup.
        condition: service_started
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/bin/bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

    networks:
    - backend
    - observability
    - docker_api
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  prometheus:
    profiles: [observability, prod]
    image: ${PROMETHEUS_IMAGE_REF:-prom/prometheus:v3.13.1@sha256:3c42b892cf723fa54d2f262c37a0e1f80aa8c8ddb1da7b9b0df9455a35a7f893}
    container_name: ${STACK_NAME:-stuhelper}-prometheus
    command:
    - --config.file=/etc/prometheus/prometheus.yml
    - --storage.tsdb.path=/prometheus
    - --web.enable-lifecycle
    - --web.enable-remote-write-receiver
    - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
    - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-20GB}
    ports:
    - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
    - ./infra/generated/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    - ./infra/observability/prometheus/rules:/etc/prometheus/rules:ro
    - prometheus_data:/prometheus
    depends_on:
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

    networks:
    - observability
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  alertmanager:
    profiles: [observability, prod]
    image: ${ALERTMANAGER_IMAGE_REF:-prom/alertmanager:v0.33.1@sha256:9e082985f56f4c8c9f724e18f2288c6708f472e56a5286b8863d080434ea065d}
    container_name: ${STACK_NAME:-stuhelper}-alertmanager
    command:
    - --config.file=/etc/alertmanager/alertmanager.yml
    - --storage.path=/alertmanager
    ports:
    - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
    - ./infra/generated/observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

    networks:
    - observability
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  loki:
    profiles: [observability, prod]
    image: ${LOKI_IMAGE_REF:-grafana/loki:3.7.4@sha256:87f0a067673756a3cede1bcbf0c74875f7df9b09fddb53e399d0c576f756cfcc}
    container_name: ${STACK_NAME:-stuhelper}-loki
    command: ["-config.file=/etc/loki/loki.yaml"]
    ports:
    - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    volumes:
    - ./infra/observability/loki/loki.yaml:/etc/loki/loki.yaml:ro
    - loki_data:/loki
    restart: unless-stopped

    networks:
    - observability
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  tempo:
    profiles: [observability, prod]
    image: ${TEMPO_IMAGE_REF:-grafana/tempo:3.0.2@sha256:cda87c212d8c584dc0b89e337e7ed648a5100feb657e5d528480ee4fa03dbbe3}
    container_name: ${STACK_NAME:-stuhelper}-tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    ports:
    - "127.0.0.1:${TEMPO_HTTP_PORT:-3200}:3200"
    volumes:
    - ./infra/observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
    - tempo_data:/var/tempo
    healthcheck:
      test: ["CMD", "/tempo", "-health", "-health.url=http://127.0.0.1:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

    networks:
    - observability
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  grafana:
    profiles: [observability, prod]
    image: ${GRAFANA_IMAGE_REF:-grafana/grafana:nightly-slim@sha256:5909f8f4123b9ff3efcd701e23c0b5310b6ae0ea12fd3ee906f2bc91831e5363}
    container_name: ${STACK_NAME:-stuhelper}-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_METRICS_ENABLED: "true"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3003}
    ports:
    - "127.0.0.1:${GRAFANA_PORT:-3003}:3000"
    volumes:
    - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./infra/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    - grafana_data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_healthy
      alertmanager:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

    networks:
    - observability
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  node-exporter:
    profiles: [observability, prod]
    image: ${NODE_EXPORTER_IMAGE_REF:-prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0}
    container_name: ${STACK_NAME:-stuhelper}-node-exporter
    command:
    - --path.rootfs=/host
    volumes:
    - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9100/metrics"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

    networks:
    - observability
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    read_only: true
    tmpfs:
    - /tmp
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
  cadvisor:
    profiles: [observability, prod]
    image: ${CADVISOR_IMAGE_REF:-ghcr.io/google/cadvisor:v0.60.5@sha256:763aecf1c32c2be8a1a75f9abfc2fc461005c9dbbaa39cb356b354aac1296dbe}
    container_name: ${STACK_NAME:-stuhelper}-cadvisor
    security_opt:
    - no-new-privileges:true
    devices:
    - /dev/kmsg:/dev/kmsg
    volumes:
    - /:/rootfs:ro
    - /var/run:/var/run:ro
    - /sys:/sys:ro
    - /var/lib/docker/:/var/lib/docker:ro
    ports:
    - "127.0.0.1:${CADVISOR_PORT:-8088}:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/metrics"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

    networks:
    - observability
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
  postgres-exporter:
    profiles: [observability, prod]
    image: ${POSTGRES_EXPORTER_IMAGE_REF:-quay.io/prometheuscommunity/postgres-exporter:v0.20.1@sha256:ac5ec343104fae0e2d84a27bb8d69b38430a11910c5382cad85d478d2bab713e}
    container_name: ${STACK_NAME:-stuhelper}-postgres-exporter
    environment:
      DATA_SOURCE_URI: postgres:5432/postgres?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable}&sslrootcert=/tls/ca.crt
      DATA_SOURCE_USER: stuhelper_metrics
      DATA_SOURCE_PASS: ${POSTGRES_EXPORTER_DB_PASSWORD:?POSTGRES_EXPORTER_DB_PASSWORD is required}
    volumes:
    - ./infra/generated/postgres-client-ca:/tls:ro
    ports:
    - "127.0.0.1:${POSTGRES_EXPORTER_PORT:-9187}:9187"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9187/metrics"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

    networks:
    - backend
    - observability
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
  redis-exporter:
    profiles: [observability, prod]
    image: ${REDIS_EXPORTER_IMAGE_REF:-oliver006/redis_exporter:v1.88.0@sha256:2c8c55c63ce4d915389f03d337b8acef56aaaca9fab8728291287e612d4d6398}
    container_name: ${STACK_NAME:-stuhelper}-redis-exporter
    environment:
      REDIS_ADDR: rediss://redis:6379
      REDIS_USER: ${REDIS_EXPORTER_USERNAME:-stuhelper_metrics}
      REDIS_PASSWORD: ${REDIS_EXPORTER_PASSWORD:?REDIS_EXPORTER_PASSWORD is required}
      REDIS_EXPORTER_TLS_CA_CERT_FILE: /tls/ca.crt
      REDIS_EXPORTER_DISABLE_SCRAPE_ENDPOINT: "true"
    volumes:
    - ./infra/generated/redis-client-ca:/tls:ro
    ports:
    - "127.0.0.1:${REDIS_EXPORTER_PORT:-9121}:9121"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/redis_exporter", "--version"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

    networks:
    - backend
    - observability
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
  blackbox-exporter:
    profiles: [observability, prod]
    image: ${BLACKBOX_EXPORTER_IMAGE_REF:-quay.io/prometheus/blackbox-exporter:master@sha256:9a7db82eecc48c8f226a24ca72c7b367b749b7994881824aa9b6a05b24ff4579}
    container_name: ${STACK_NAME:-stuhelper}-blackbox-exporter
    command:
    - --config.file=/etc/blackbox/blackbox.yml
    ports:
    - "127.0.0.1:${BLACKBOX_EXPORTER_PORT:-9115}:9115"
    volumes:
    - ./infra/observability/blackbox/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9115/metrics"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

    networks:
    - observability
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
  alert-webhook-sink:
    profiles: [local-alert-sink]
    image: ${ALERT_WEBHOOK_SINK_IMAGE_REF:-mendhak/http-https-echo:41@sha256:2046be25f4a2c0bdda662ebfb7c2b7b60fc95c31d97987be143645a8a2194a40}
    container_name: ${STACK_NAME:-stuhelper}-alert-webhook-sink
    environment:
      HTTP_PORT: 8080
    restart: unless-stopped

    networks:
    - observability
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M
    read_only: true
    tmpfs:
    - /tmp
    security_opt:
    - no-new-privileges:true
