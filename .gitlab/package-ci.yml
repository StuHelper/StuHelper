.package_image_template:
  stage: package
  extends: .docker_job
  rules:
  - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"'
  - when: never

package_backend:
  extends: .package_image_template
  script:
  - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
  - docker pull "${BACKEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}"
  - docker tag "${BACKEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}" "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  - |-
    if [ "${CI_COMMIT_BRANCH}" = "main" ]; then
      docker tag "${BACKEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}" "${BACKEND_IMAGE}:latest"
    else
      docker tag "${BACKEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}" "${BACKEND_IMAGE}:develop-latest"
    fi
  - docker push "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  - printf 'BACKEND_IMAGE_REF=%s\n' "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}" > backend-image.env
  - |-
    if [ "${CI_COMMIT_BRANCH}" = "main" ]; then
      docker push "${BACKEND_IMAGE}:latest"
    else
      docker push "${BACKEND_IMAGE}:develop-latest"
    fi
  artifacts:
    reports:
      dotenv: backend-image.env
  needs:
  - check_docs_hygiene
  - openapi_contract
  - backend_lint
  - backend_security
  - backend_test
  - migration_verify
  - koishi_test
  - prod_init_contract
  - infra_contract
  - backend_vulnerability_scan
  - secret_scan
  - backend_build
  - docker_build_backend
  - container_scan_backend

