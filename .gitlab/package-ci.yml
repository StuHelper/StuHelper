.package_image_template:
  stage: package
  extends: .docker_job
  rules:
  - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"'
  - when: never

package_backend:
  extends: .package_image_template
  script:
  - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
  - |
    set -euo pipefail
    expected_digest="${BACKEND_CANDIDATE_REF##*@}"
    immutable_ref="${BACKEND_IMAGE}:${CI_COMMIT_SHA}"
    if [ "${CI_COMMIT_BRANCH}" = "main" ]; then
      mutable_ref="${BACKEND_IMAGE}:latest"
    else
      mutable_ref="${BACKEND_IMAGE}:develop-latest"
    fi

    docker buildx imagetools create \
      --prefer-index=false \
      --tag "${immutable_ref}" \
      "${BACKEND_CANDIDATE_REF}"
    actual_digest="$(
      docker buildx imagetools inspect "${immutable_ref}" |
        awk '$1 == "Digest:" {print $2; exit}'
    )"
    if [ "${actual_digest}" != "${expected_digest}" ]; then
      echo "immutable backend tag digest mismatch" >&2
      exit 1
    fi

    docker buildx imagetools create \
      --prefer-index=false \
      --tag "${mutable_ref}" \
      "${BACKEND_CANDIDATE_REF}"
    printf 'BACKEND_IMAGE_REF=%s@%s\n' "${BACKEND_IMAGE}" "${expected_digest}" > backend-image.env
  artifacts:
    expire_in: 7 days
    reports:
      dotenv: backend-image.env
  needs:
  - check_docs_hygiene
  - openapi_contract
  - backend_lint
  - backend_security
  - backend_test
  - migration_verify
  - koishi_test
  - prod_init_contract
  - infra_contract
  - backend_vulnerability_scan
  - custom_sast
  - secret_scan
  - backend_build
  - docker_build_backend
  - container_scan_backend
  - sbom_backend

