    DEPLOY_REGISTRY_PASSWORD_SECRET_REF: $STAGING_DEPLOY_REGISTRY_PASSWORD_SECRET_REF
  environment:
    name: staging
    url: $STAGING_PUBLIC_URL
  rules:
