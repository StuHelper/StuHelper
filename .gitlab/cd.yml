.remote_operation_template:
  image: alpine:3.24@sha256:28bd5fe8a8bd2a60b63fd00ec6b4fe3a9c4d741873baabf15717e1c667943f8b
  before_script:
  - apk add --no-cache bash git gzip openssh-client tar

.deploy_remote_template:
  extends: .remote_operation_template
  stage: deploy
  script:
  - export DEPLOY_ENVIRONMENT="${CI_ENVIRONMENT_NAME}"
  - export TARGET_SHA="${CI_COMMIT_SHA}"
  - ./infra/ops/run-ci-remote-operation.sh deploy

.verify_remote_template:
  extends: .remote_operation_template
  stage: verify
  script:
  - export DEPLOY_ENVIRONMENT="${CI_ENVIRONMENT_NAME}"
  - export TARGET_SHA="${CI_COMMIT_SHA}"
  - ./infra/ops/run-ci-remote-operation.sh verify

.rollback_remote_template:
  extends: .remote_operation_template
  stage: deploy
  needs: []
  before_script:
  - apk add --no-cache bash docker-cli docker-cli-buildx git gzip openssh-client tar
  script:
  - export DEPLOY_ENVIRONMENT="${CI_ENVIRONMENT_NAME}"
  - export TARGET_SHA="${ROLLBACK_SHA:-${ROLLBACK_TAG:-}}"
  - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
  - ./infra/ops/resolve-registry-release-images.sh /tmp/rollback-images.env
  - . /tmp/rollback-images.env
  - export ROLLBACK_BACKEND_IMAGE_REF ROLLBACK_FRONTEND_IMAGE_REF ROLLBACK_ADMIN_IMAGE_REF
  - ./infra/ops/run-ci-remote-operation.sh rollback

deploy_staging:
  extends: .deploy_remote_template
  needs:
  - package_backend
  - package_frontend
  - package_admin
  variables:
    DEPLOY_TARGET_HOST: $STAGING_DEPLOY_HOST
    DEPLOY_TARGET_PORT: $STAGING_DEPLOY_PORT
    DEPLOY_TARGET_USER: $STAGING_DEPLOY_USER
    DEPLOY_TARGET_APP_DIR: $STAGING_DEPLOY_APP_DIR
    DEPLOY_TARGET_SSH_KEY: $STAGING_DEPLOY_SSH_KEY
    DEPLOY_TARGET_SSH_KNOWN_HOSTS: $STAGING_DEPLOY_SSH_KNOWN_HOSTS
  environment:
    name: staging
    url: $STAGING_PUBLIC_URL
  rules:
  - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"'
  - when: never

deploy_production:
  extends: .deploy_remote_template
  needs:
  - package_backend
  - package_frontend
  - package_admin
  variables:
    DEPLOY_TARGET_HOST: $DEPLOY_HOST
    DEPLOY_TARGET_PORT: $DEPLOY_PORT
    DEPLOY_TARGET_USER: $DEPLOY_USER
    DEPLOY_TARGET_APP_DIR: $DEPLOY_APP_DIR
    DEPLOY_TARGET_SSH_KEY: $DEPLOY_SSH_KEY
    DEPLOY_TARGET_SSH_KNOWN_HOSTS: $DEPLOY_SSH_KNOWN_HOSTS
  environment:
    name: production
    url: $WEB_PUBLIC_URL
  rules:
  - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    when: manual
  - when: never

verify_staging:
