package_backend:
  stage: package
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - when: never
  script:
    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
    - export BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
    - docker buildx create --use --name gitlab-builder
    - docker buildx build --push --platform linux/amd64 --tag "${BACKEND_IMAGE}:latest" --tag "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}" --build-arg "VERSION=${CI_COMMIT_SHORT_SHA}" --build-arg "GIT_COMMIT=${CI_COMMIT_SHA}" --build-arg "BUILD_TIME=${BUILD_TIME}" --cache-from "type=registry,ref=${BACKEND_IMAGE}:buildcache" --cache-to "type=registry,ref=${BACKEND_IMAGE}:buildcache,mode=max" server

package_frontend:
  stage: package
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      command: ["--tls=false"]
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - when: never
  script:
    - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
    - docker buildx create --use --name gitlab-builder
    - docker buildx build --push --platform linux/amd64 --file clients/web/Dockerfile --tag "${FRONTEND_IMAGE}:latest" --tag "${FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA}" --cache-from "type=registry,ref=${FRONTEND_IMAGE}:buildcache" --cache-to "type=registry,ref=${FRONTEND_IMAGE}:buildcache,mode=max" clients

deploy_production:
  stage: deploy
  image: alpine:3.21
  needs:
    - package_backend
    - package_frontend
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
    - when: never
  script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add -
    - ssh-keyscan -p "${DEPLOY_PORT:-22}" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
    - ssh -p "${DEPLOY_PORT:-22}" "${DEPLOY_USER}@${DEPLOY_HOST}" "cd ${DEPLOY_APP_DIR} && docker compose --profile prod pull && docker compose --profile prod up -d --remove-orphans && sleep 5 && docker compose --profile prod ps"
