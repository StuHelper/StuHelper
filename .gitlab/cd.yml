deploy_staging:
  extends: .deploy_remote_template
  needs:
  - package_backend
  - package_frontend
  - package_admin
  variables:
    DEPLOY_TARGET_HOST: $STAGING_DEPLOY_HOST
    DEPLOY_TARGET_PORT: $STAGING_DEPLOY_PORT
    DEPLOY_TARGET_USER: $STAGING_DEPLOY_USER
    DEPLOY_TARGET_APP_DIR: $STAGING_DEPLOY_APP_DIR
    DEPLOY_TARGET_SSH_KEY: $STAGING_DEPLOY_SSH_KEY
    DEPLOY_SECRET_BACKEND: $STAGING_DEPLOY_SECRET_BACKEND
    DEPLOY_SHARED_ENV_SECRET_REF: $STAGING_DEPLOY_SHARED_ENV_SECRET_REF
    DEPLOY_SECRET_ENV_SECRET_REF: $STAGING_DEPLOY_SECRET_ENV_SECRET_REF
    DEPLOY_GENERATED_ENV_SECRET_REF: $STAGING_DEPLOY_GENERATED_ENV_SECRET_REF
    DEPLOY_SECRET_FILE_ROOT: $STAGING_DEPLOY_SECRET_FILE_ROOT
    DEPLOY_VAULT_ADDR: $STAGING_DEPLOY_VAULT_ADDR
    DEPLOY_VAULT_NAMESPACE: $STAGING_DEPLOY_VAULT_NAMESPACE
