.package_image_template:
  stage: package
  extends: .docker_job
  rules:
  - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  - if: '$CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"'
  - when: never

.deploy_remote_template:
  stage: deploy
  image: alpine:3.21
  script:
  - test -n "${DEPLOY_TARGET_HOST:-}" || { echo "DEPLOY_TARGET_HOST is required"; exit 1; }
  - test -n "${DEPLOY_TARGET_USER:-}" || { echo "DEPLOY_TARGET_USER is required"; exit 1; }
  - test -n "${DEPLOY_TARGET_APP_DIR:-}" || { echo "DEPLOY_TARGET_APP_DIR is required"; exit 1; }
  - test -n "${DEPLOY_TARGET_SSH_KEY:-}" || { echo "DEPLOY_TARGET_SSH_KEY is required"; exit 1; }
  - test -n "${BACKEND_IMAGE_REF:-}" || { echo "BACKEND_IMAGE_REF is required"; exit 1; }
  - test -n "${FRONTEND_IMAGE_REF:-}" || { echo "FRONTEND_IMAGE_REF is required"; exit 1; }
  - test -n "${ADMIN_IMAGE_REF:-}" || { echo "ADMIN_IMAGE_REF is required"; exit 1; }
  - apk add --no-cache openssh-client bash tar gzip
  - export TARGET_TAG="${DEPLOY_TAG:-${CI_COMMIT_SHORT_SHA}}"
  - export REMOTE_SHARED_ENV_FILE="${DEPLOY_SHARED_ENV_REMOTE_PATH:-${DEPLOY_TARGET_APP_DIR}/.env.prod.shared}"
  - export REMOTE_SECRETS_ENV_FILE="${DEPLOY_SECRETS_ENV_REMOTE_PATH:-${DEPLOY_TARGET_APP_DIR}/.env.prod.secrets}"
  - export REMOTE_GENERATED_SECRETS_ENV_FILE="${DEPLOY_GENERATED_SECRETS_ENV_REMOTE_PATH:-${DEPLOY_TARGET_APP_DIR}/.env.prod.generated.secrets}"
  - test -n "${DEPLOY_SECRET_BACKEND:-}" || { echo "DEPLOY_SECRET_BACKEND is required"; exit 1; }
  - test -n "${DEPLOY_SHARED_ENV_SECRET_REF:-}" || { echo "DEPLOY_SHARED_ENV_SECRET_REF is required"; exit 1; }
  - test -n "${DEPLOY_SECRET_ENV_SECRET_REF:-}" || { echo "DEPLOY_SECRET_ENV_SECRET_REF is required"; exit 1; }
  - eval "$(ssh-agent -s)"
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - printf '%s\n' "$DEPLOY_TARGET_SSH_KEY" | tr -d '\r' | ssh-add -
  - ssh-keyscan -p "${DEPLOY_TARGET_PORT:-22}" "$DEPLOY_TARGET_HOST" >> ~/.ssh/known_hosts
  - ./infra/ops/build-deploy-bundle.sh "${CI_PROJECT_DIR}/deploy-bundle.tgz"
  - |
    cat > "${CI_PROJECT_DIR}/deploy.remote.env" <<EOF
    REGISTRY=${REGISTRY}
    REGISTRY_USERNAME_SECRET_REF=${DEPLOY_REGISTRY_USERNAME_SECRET_REF}
    REGISTRY_PASSWORD_SECRET_REF=${DEPLOY_REGISTRY_PASSWORD_SECRET_REF}
    TAG=${TARGET_TAG}
    BACKEND_IMAGE_REF=${BACKEND_IMAGE_REF}
    FRONTEND_IMAGE_REF=${FRONTEND_IMAGE_REF}
    ADMIN_IMAGE_REF=${ADMIN_IMAGE_REF}
    ENV_FILE=${REMOTE_SHARED_ENV_FILE}
    SECRETS_ENV_FILE=${REMOTE_SECRETS_ENV_FILE}
    GENERATED_ENV_FILE=${DEPLOY_TARGET_APP_DIR}/.env.prod.generated
    GENERATED_SECRET_ENV_FILE=${REMOTE_GENERATED_SECRETS_ENV_FILE}
    SECRET_BACKEND=${DEPLOY_SECRET_BACKEND}
    SHARED_ENV_SECRET_REF=${DEPLOY_SHARED_ENV_SECRET_REF}
    SECRETS_ENV_SECRET_REF=${DEPLOY_SECRET_ENV_SECRET_REF}
    GENERATED_ENV_SECRET_REF=${DEPLOY_GENERATED_ENV_SECRET_REF}
    SECRET_FILE_ROOT=${DEPLOY_SECRET_FILE_ROOT:-${DEPLOY_TARGET_APP_DIR}/.secrets}
    VAULT_ADDR=${DEPLOY_VAULT_ADDR:-}
    VAULT_NAMESPACE=${DEPLOY_VAULT_NAMESPACE:-}
    VAULT_TOKEN_FILE=${DEPLOY_VAULT_TOKEN_FILE:-}
    VAULT_KV_MOUNT=${DEPLOY_VAULT_KV_MOUNT:-secret}
    EOF
  - ssh -p "${DEPLOY_TARGET_PORT:-22}" "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}" "mkdir -p '${DEPLOY_TARGET_APP_DIR}'"
  - scp -P "${DEPLOY_TARGET_PORT:-22}" "${CI_PROJECT_DIR}/deploy-bundle.tgz" "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}:${DEPLOY_TARGET_APP_DIR}/deploy-bundle.tgz"
  - scp -P "${DEPLOY_TARGET_PORT:-22}" "${CI_PROJECT_DIR}/deploy.remote.env" "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}:${DEPLOY_TARGET_APP_DIR}/deploy.remote.env"
  - |
    ssh -p "${DEPLOY_TARGET_PORT:-22}" "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}" "
      set -euo pipefail &&
      cd '${DEPLOY_TARGET_APP_DIR}' &&
      tar xzf deploy-bundle.tgz &&
      rm -f deploy-bundle.tgz &&
      set -a && . ./deploy.remote.env && set +a &&
      ./infra/ops/remote-preflight.sh &&
      ./infra/ops/remote-prod-deploy.sh &&
      rm -f ./deploy.remote.env
    "

.verify_remote_template:
  stage: verify
  image: alpine:3.21
  script:
  - test -n "${DEPLOY_TARGET_HOST:-}" || { echo "DEPLOY_TARGET_HOST is required"; exit 1; }
  - test -n "${DEPLOY_TARGET_USER:-}" || { echo "DEPLOY_TARGET_USER is required"; exit 1; }
  - test -n "${DEPLOY_TARGET_APP_DIR:-}" || { echo "DEPLOY_TARGET_APP_DIR is required"; exit 1; }
  - test -n "${DEPLOY_TARGET_SSH_KEY:-}" || { echo "DEPLOY_TARGET_SSH_KEY is required"; exit 1; }
  - apk add --no-cache openssh-client bash curl
  - eval "$(ssh-agent -s)"
  - mkdir -p ~/.ssh
  - chmod 700 ~/.ssh
  - printf '%s\n' "$DEPLOY_TARGET_SSH_KEY" | tr -d '\r' | ssh-add -
  - ssh-keyscan -p "${DEPLOY_TARGET_PORT:-22}" "$DEPLOY_TARGET_HOST" >> ~/.ssh/known_hosts
  - |
    ssh -p "${DEPLOY_TARGET_PORT:-22}" "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}" "
      set -euo pipefail &&
      cd '${DEPLOY_TARGET_APP_DIR}' &&
      ./infra/ops/smoke-check.sh &&
      ./infra/ops/observability-smoke-check.sh
    "

package_backend:
  extends: .package_image_template
  script:
  - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
  - docker pull "${BACKEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}"
  - docker tag "${BACKEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}" "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  - |-
    if [ "${CI_COMMIT_BRANCH}" = "main" ]; then
      docker tag "${BACKEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}" "${BACKEND_IMAGE}:latest"
    else
      docker tag "${BACKEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}" "${BACKEND_IMAGE}:develop-latest"
    fi
  - docker push "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  - printf 'BACKEND_IMAGE_REF=%s\n' "${BACKEND_IMAGE}:${CI_COMMIT_SHORT_SHA}" > backend-image.env
  - |-
    if [ "${CI_COMMIT_BRANCH}" = "main" ]; then
      docker push "${BACKEND_IMAGE}:latest"
    else
      docker push "${BACKEND_IMAGE}:develop-latest"
    fi
  artifacts:
    reports:
      dotenv: backend-image.env
  needs:
  - openapi_contract
  - backend_lint
  - backend_security
  - backend_test
  - migration_verify
  - backend_vulnerability_scan
  - backend_build
  - docker_build_backend
  - container_scan_backend
package_frontend:
  extends: .package_image_template
  script:
  - echo "$REGISTRY_PASSWORD" | docker login "$REGISTRY" --username "$REGISTRY_USERNAME" --password-stdin
  - docker pull "${FRONTEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}"
  - docker tag "${FRONTEND_IMAGE}:ci-${CI_COMMIT_SHORT_SHA}" "${FRONTEND_IMAGE}:${CI_COMMIT_SHORT_SHA}"
  - |-
    if [ "${CI_COMMIT_BRANCH}" = "main" ]; then
