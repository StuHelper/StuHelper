.openapi_contract_node_setup: &openapi_contract_node_setup
  - apt-get update
  - apt-get install -y --no-install-recommends ca-certificates curl xz-utils
  - rm -rf /var/lib/apt/lists/*
  - export NODE_DIST=node-v24.18.0-linux-x64
  - export NODE_ARCHIVE="${NODE_DIST}.tar.xz"
  - curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error "https://nodejs.org/dist/v24.18.0/${NODE_ARCHIVE}" --output "/tmp/${NODE_ARCHIVE}"
  - printf '%s  %s\n' '55aa7153f9d88f28d765fcdad5ae6945b5c0f98a36881703817e4c450fa76742' "/tmp/${NODE_ARCHIVE}" | sha256sum --check --strict
  - tar --extract --xz --file "/tmp/${NODE_ARCHIVE}" --directory /usr/local --strip-components=1 --no-same-owner
  - rm -f "/tmp/${NODE_ARCHIVE}"
  - corepack enable
  - corepack prepare pnpm@10.32.1 --activate

.go_job:
  image: golang:1.26.5-bookworm@sha256:1ecb7edf62a0408027bd5729dfd6b1b8766e578e8df93995b225dfd0944eb651
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go/pkg/mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go/build
  cache:
    key:
      prefix: go-$CI_COMMIT_REF_SLUG
      files:
      - server/go.sum
    paths:
    - .cache/go/pkg/mod
    - .cache/go/build
backend_lint:
  stage: lint
  script:
  - cd server
  - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
  - make lint

  extends: .go_job
backend_security:
  stage: lint
  script:
  - cd server
  - go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
  - make security

  extends: .go_job
backend_vulnerability_scan:
  stage: security
  script:
  - cd server
  - go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
  - govulncheck ./...

  extends: .go_job
openapi_contract:
  stage: lint
  before_script: *openapi_contract_node_setup
  script:
  - cd server
  - make lint-spec
  - make check-bundled-drift
  - make check-drift-go
  - make check-doc-sync
  - cd ../clients
  - pnpm install --frozen-lockfile
  - pnpm run check:api-drift
  - pnpm run check:capabilities-drift

  extends: .go_job
backend_test:
  stage: test
  services:
  - name: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    alias: postgres
  - name: redis:8.6.2@sha256:832d7785830f3f4b559300e6191fc914b15642c1935252338825cf4332200148
    alias: redis
  variables:
    POSTGRES_DB: test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    DATABASE_URL: postgres://test:test@postgres:5432/test?sslmode=disable
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ""
    PGPASSWORD: test
  script:
  - cd server
  - make migrate-up
  - go test -v -race -timeout=10m -coverprofile=coverage.out ./...
  - make check-coverage-threshold
  artifacts:
    when: always
    paths:
    - server/coverage.out

  extends: .go_job
migration_verify:
  stage: test
  services:
  - name: postgres:18.3@sha256:7e32e9833a6fb1c92c32552794cb6ed569d51b445a54907d35fc112ef39684db
    alias: postgres
  variables:
    POSTGRES_DB: test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    DATABASE_URL: postgres://test:test@postgres:5432/test?sslmode=disable
  script:
  - cd server
  - make migrate-verify

  extends: .go_job
backend_build:
  stage: build
  script:
  - cd server
  - make build
  artifacts:
    when: always
    paths:
    - server/bin/stuhelper
  extends: .go_job
