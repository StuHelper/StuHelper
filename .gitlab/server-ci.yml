.go_job:
  image: golang:1.26-bookworm
  variables:
    GOMODCACHE: $CI_PROJECT_DIR/.cache/go/pkg/mod
    GOCACHE: $CI_PROJECT_DIR/.cache/go/build
  cache:
    key:
      files:
      - server/go.sum
    paths:
    - .cache/go/pkg/mod
    - .cache/go/build
backend_lint:
  stage: lint
  script:
  - cd server
  - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
  - make lint

  extends: .go_job
backend_security:
  stage: lint
  script:
  - cd server
  - go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
  - make security

  extends: .go_job
backend_vulnerability_scan:
  stage: security
  script:
  - cd server
  - go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
  - govulncheck ./...

  extends: .go_job
openapi_contract:
  stage: lint
  script:
  - apt-get update
  - apt-get install -y curl ca-certificates gnupg
  - curl -fsSL https://deb.nodesource.com/setup_24.x | bash -
  - apt-get install -y nodejs
  - corepack enable
  - corepack prepare pnpm@10 --activate
  - cd server
  - make lint-spec
  - make check-drift-go
  - cd ../clients
  - pnpm install --frozen-lockfile
  - pnpm run check:api-drift

  extends: .go_job
backend_test:
  stage: test
  services:
  - name: postgres:18
    alias: postgres
  - name: redis:8
    alias: redis
  variables:
    POSTGRES_DB: test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    DATABASE_URL: postgres://test:test@postgres:5432/test?sslmode=disable
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ""
    PGPASSWORD: test
  script:
  - cd server
  - make migrate-up
  - go test -v -race -timeout=10m -coverprofile=coverage.out ./...
  artifacts:
    when: always
    paths:
    - server/coverage.out

  extends: .go_job
migration_verify:
  stage: test
  services:
  - name: postgres:18
    alias: postgres
  variables:
    POSTGRES_DB: test
    POSTGRES_USER: test
    POSTGRES_PASSWORD: test
    DATABASE_URL: postgres://test:test@postgres:5432/test?sslmode=disable
  script:
  - cd server
  - make migrate-verify

  extends: .go_job
backend_build:
  stage: build
  script:
  - cd server
  - make build
  artifacts:
    when: always
    paths:
    - server/bin/stuhelper
  extends: .go_job
