name: Deploy

on:
  workflow_call:
    inputs:
      target:
        description: Protected GitHub environment to deploy
        required: true
        type: string
      reason:
        description: Change record explaining why this release is being promoted
        required: true
        type: string
      promotion_mode:
        description: Explicit environment-promotion policy
        required: true
        type: string
  workflow_dispatch:
    inputs:
      target:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        options:
          - staging
          - production
      reason:
        description: Change or incident record explaining this deployment
        required: true
        type: string
      promotion_mode:
        description: Promotion policy (must match the selected target)
        required: true
        type: choice
        options:
          - staging
          - after-staging
          - direct
          - break-glass

permissions:
  attestations: read # Verify provenance before exposing environment secrets
  checks: read # Require the release commit's CI and CodeQL checks
  contents: read
  packages: read # Resolve immutable release manifests from GHCR

concurrency:
  group: deployment-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify release before approval
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      admin_image_ref: ${{ steps.release-images.outputs.admin_image_ref }}
      backend_image_ref: ${{ steps.release-images.outputs.backend_image_ref }}
      frontend_image_ref: ${{ steps.release-images.outputs.frontend_image_ref }}
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.target }}
      DEPLOY_REASON: ${{ inputs.reason }}
      PRODUCTION_PROMOTION_MODE: ${{ inputs.promotion_mode }}
      RELEASE_OPERATION: forward
      SOURCE_REF: ${{ github.ref }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Check out the trusted release controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The JSON round-trip preserves GitHub's newer job.workflow_sha while
          # remaining compatible with the repository's pinned actionlint release.
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require the current trusted branch head and successful checks
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: ./infra/ops/verify-github-release.sh

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify release images
        id: release-images
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAMESPACE: ghcr.io/stuhelper
        run: ./infra/ops/resolve-attested-release-images.sh

      - name: Record verified promotion candidate
        env:
          ADMIN_IMAGE_REF: ${{ steps.release-images.outputs.admin_image_ref }}
          BACKEND_IMAGE_REF: ${{ steps.release-images.outputs.backend_image_ref }}
          FRONTEND_IMAGE_REF: ${{ steps.release-images.outputs.frontend_image_ref }}
        run: |
          {
            printf '### Verified promotion candidate\n\n'
            printf -- "- Environment: \`%s\`\n" "${DEPLOY_ENVIRONMENT}"
            printf -- "- Commit: \`%s\`\n" "${TARGET_SHA}"
            printf -- "- Promotion mode: \`%s\`\n" "${PRODUCTION_PROMOTION_MODE}"
            printf -- "- Backend: \`%s\`\n" "${BACKEND_IMAGE_REF}"
            printf -- "- Frontend: \`%s\`\n" "${FRONTEND_IMAGE_REF}"
            printf -- "- Admin: \`%s\`\n" "${ADMIN_IMAGE_REF}"
          } >>"${GITHUB_STEP_SUMMARY}"

  deploy:
    name: Deploy ${{ inputs.target }}
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.target }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      ADMIN_IMAGE_REF: ${{ needs.verify-release.outputs.admin_image_ref }}
      BACKEND_IMAGE_REF: ${{ needs.verify-release.outputs.backend_image_ref }}
      DEPLOY_ENVIRONMENT: ${{ inputs.target }}
      DEPLOY_TARGET_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
      DEPLOY_TARGET_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_TARGET_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_TARGET_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_TARGET_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_TARGET_USER: ${{ secrets.DEPLOY_USER }}
      FRONTEND_IMAGE_REF: ${{ needs.verify-release.outputs.frontend_image_ref }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Check out the verified release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Revalidate the release after environment approval
        env:
          DEPLOY_REASON: ${{ inputs.reason }}
          GH_TOKEN: ${{ github.token }}
          PRODUCTION_PROMOTION_MODE: ${{ inputs.promotion_mode }}
          RELEASE_OPERATION: forward
          SOURCE_REF: ${{ github.ref }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: ./infra/ops/verify-github-release.sh

      - name: Validate deployment inputs
        run: ./infra/ops/validate-ci-deploy-inputs.sh

      - name: Build the deployment bundle
        run: ./infra/ops/build-deploy-bundle.sh "${RUNNER_TEMP}/deploy-bundle.tgz"

      - name: Upload, deploy, and verify
        env:
          CI_REGISTRY_USERNAME: ${{ github.actor }}
          DEPLOY_RUN_ATTEMPT: ${{ github.run_attempt }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          GHCR_PULL_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "${DEPLOY_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${DEPLOY_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          [[ "${CI_REGISTRY_USERNAME}" =~ ^([A-Za-z0-9][A-Za-z0-9_.-]{0,127}|[A-Za-z0-9][A-Za-z0-9_.-]{0,121}\[bot\])$ ]]
          port="${DEPLOY_TARGET_PORT:-22}"
          incoming_dir="${DEPLOY_TARGET_APP_DIR}/.deploy/incoming"
          incoming_name="deploy-${DEPLOY_RUN_ID}-${DEPLOY_RUN_ATTEMPT}.tgz"
          incoming_path="${incoming_dir}/${incoming_name}"
          bundle_sha256="$(sha256sum "${RUNNER_TEMP}/deploy-bundle.tgz" | cut -d' ' -f1)"
          deploy_key_path="${RUNNER_TEMP}/deploy-key"
          trap 'rm -f "${deploy_key_path}"' EXIT

          install -d -m 700 "${HOME}/.ssh"
          install -m 600 /dev/null "${deploy_key_path}"
          printf '%s\n' "${DEPLOY_TARGET_SSH_KEY}" | tr -d '\r' >"${deploy_key_path}"
          ssh-keygen -y -f "${deploy_key_path}" >/dev/null
          printf '%s\n' "${DEPLOY_TARGET_SSH_KNOWN_HOSTS}" |
            tr -d '\r' >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          known_host_lookup="${DEPLOY_TARGET_HOST}"
          if [[ "${port}" != "22" ]]; then
            known_host_lookup="[${DEPLOY_TARGET_HOST}]:${port}"
          fi
          if ! ssh-keygen -F "${known_host_lookup}" -f "${HOME}/.ssh/known_hosts" >/dev/null; then
            echo "DEPLOY_SSH_KNOWN_HOSTS does not pin the selected endpoint" >&2
            exit 1
          fi

          ssh_args=(
            -o BatchMode=yes
            -o ConnectTimeout=15
            -o IdentitiesOnly=yes
            -o ServerAliveCountMax=3
            -o ServerAliveInterval=15
            -o StrictHostKeyChecking=yes
            -i "${deploy_key_path}"
            -p "${port}"
          )

          # Values below are validated before they are expanded into the trusted remote shell.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" \
            "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}" \
            "umask 077 && mkdir -p '${DEPLOY_TARGET_APP_DIR}' '${incoming_dir}'"

          scp \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o IdentitiesOnly=yes \
            -o ServerAliveCountMax=3 \
            -o ServerAliveInterval=15 \
            -o StrictHostKeyChecking=yes \
            -i "${deploy_key_path}" \
            -P "${port}" \
            "${RUNNER_TEMP}/deploy-bundle.tgz" \
            "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}:${incoming_path}"

          # Release identifiers, digest references, and transfer checksum are validated values.
          # shellcheck disable=SC2029
          printf '%s\n' "${GHCR_PULL_TOKEN}" | ssh "${ssh_args[@]}" \
            "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}" \
            "set -euo pipefail &&
             printf '%s  %s\n' '${bundle_sha256}' '${incoming_path}' | sha256sum -c - &&
             tar --extract --gzip --file='${incoming_path}' --directory='${DEPLOY_TARGET_APP_DIR}' --exclude='infra/generated' &&
             rm -f '${incoming_path}' &&
             cd '${DEPLOY_TARGET_APP_DIR}' &&
             TAG='${TARGET_SHA}' \
             BACKEND_IMAGE_REF='${BACKEND_IMAGE_REF}' \
             FRONTEND_IMAGE_REF='${FRONTEND_IMAGE_REF}' \
             ADMIN_IMAGE_REF='${ADMIN_IMAGE_REF}' \
             CI_REGISTRY_USERNAME='${CI_REGISTRY_USERNAME}' \
             ./infra/ops/remote-ci-release.sh deploy"

      - name: Record deployment result
        if: always()
        env:
          DEPLOY_JOB_STATUS: ${{ job.status }}
        run: |
          {
            printf '### Deployment result\n\n'
            printf -- "- Environment: \`%s\`\n" "${DEPLOY_ENVIRONMENT}"
            printf -- "- Commit: \`%s\`\n" "${TARGET_SHA}"
            printf -- "- Status: \`%s\`\n" "${DEPLOY_JOB_STATUS}"
            printf -- "- Actor: \`%s\`\n" "${GITHUB_ACTOR}"
            printf -- '- Run: %s/%s/actions/runs/%s\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}"
          } >>"${GITHUB_STEP_SUMMARY}"
          if [[ "${DEPLOY_JOB_STATUS}" != "success" ]]; then
            echo "Deployment failed. Do not roll back database schema automatically; assess the last known good image set and use the audited Rollback workflow." >&2
          fi
