name: Publish images

on:
  workflow_call:
    inputs:
      commit_sha:
        description: Tested full commit SHA
        required: true
        type: string
      branch:
        description: Trusted branch that produced the commit
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Serialize every registry mutation so immutable tags and human-readable
  # aliases cannot race across develop/main or rapid consecutive pushes.
  group: publish-images
  cancel-in-progress: false

jobs:
  verify-release:
    name: Verify trusted release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      checks: read
      contents: read
    env:
      DEPLOY_ENVIRONMENT: staging
      DEPLOY_REASON: Trusted image publication after CI and CodeQL verification
      PRODUCTION_PROMOTION_MODE: not-applicable
      RELEASE_OPERATION: publish
      SOURCE_REF: ${{ github.ref }}
      TARGET_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Check out the trusted publication controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(toJSON(job)).workflow_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require the live branch head, Required, and both CodeQL checks
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_SHA: ${{ fromJSON(toJSON(job)).workflow_sha }}
        run: ./infra/ops/verify-github-release.sh

  publish:
    name: ${{ matrix.name }}
    needs: verify-release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # Push the three scanned OCI images to GHCR
      attestations: write # Store provenance with each manifest digest
      id-token: write # Mint the OIDC identity used to sign provenance
      artifact-metadata: write # Link each published digest to the organization artifact inventory
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: server
            file: server/Dockerfile
            image: ghcr.io/stuhelper/backend
          - name: frontend
            context: .
            file: clients/web/Dockerfile
            image: ghcr.io/stuhelper/frontend
          - name: admin
            context: clients
            file: clients/admin/scripts/deploy/Dockerfile
            image: ghcr.io/stuhelper/admin
    steps:
      - name: Validate trusted release inputs
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          SOURCE_BRANCH: ${{ inputs.branch }}
        run: |
          if [[ ! "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase 40-character Git commit SHA" >&2
            exit 1
          fi
          if [[ "${SOURCE_BRANCH}" != "develop" && "${SOURCE_BRANCH}" != "main" ]]; then
            echo "branch must be develop or main" >&2
            exit 1
          fi

      - name: Check out the tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false

      - name: Record reproducible build metadata
        id: build-meta
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          commit_epoch="$(git show -s --format=%ct "${COMMIT_SHA}")"
          build_time="$(date -u --date="@${commit_epoch}" +'%Y-%m-%dT%H:%M:%SZ')"
          printf 'commit_epoch=%s\n' "${commit_epoch}" >>"${GITHUB_OUTPUT}"
          printf 'build_time=%s\n' "${build_time}" >>"${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve a trusted immutable image
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          IMAGE_NAME: ${{ matrix.image }}
        run: ./infra/ops/resolve-existing-published-image.sh

      - name: Build the candidate locally
        if: steps.existing.outputs.found != 'true'
        env:
          SOURCE_DATE_EPOCH: ${{ steps.build-meta.outputs.commit_epoch }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ matrix.image }}:${{ inputs.commit_sha }}
          labels: |
            org.opencontainers.image.created=${{ steps.build-meta.outputs.build_time }}
            org.opencontainers.image.revision=${{ inputs.commit_sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.commit_sha }}
          build-args: |
            VERSION=${{ inputs.commit_sha }}
            GIT_COMMIT=${{ inputs.commit_sha }}
            BUILD_TIME=${{ steps.build-meta.outputs.build_time }}
            VITE_API_URL=${{ vars.WEB_VITE_API_URL || '/api' }}
            VITE_SSO_URL=${{ vars.WEB_VITE_SSO_URL || 'https://sso.stuhelper.com' }}
            VITE_WEB_URL=${{ vars.WEB_VITE_WEB_URL || 'https://stuhelper.com' }}
            VITE_ADMIN_URL=${{ vars.ADMIN_PUBLIC_URL || 'https://stuhelper.com/admin/' }}
            VITE_API_TIMEOUT_MS=${{ vars.WEB_VITE_API_TIMEOUT_MS || '15000' }}
            VITE_QQ_BOT_ENTRY=${{ vars.WEB_VITE_QQ_BOT_ENTRY }}
            VITE_QQ_BIND_COMMAND=${{ vars.WEB_VITE_QQ_BIND_COMMAND || '绑定' }}
            VITE_GLOB_API_URL=${{ vars.ADMIN_VITE_API_URL || '/api/v1' }}
            VITE_BASE=${{ vars.ADMIN_VITE_BASE || '/admin/' }}

      - name: Scan the candidate image
        if: steps.existing.outputs.found != 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ matrix.image }}:${{ inputs.commit_sha }}
          version: v0.72.0
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"

      - name: Generate the candidate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: >-
            ${{ steps.existing.outputs.found == 'true' &&
            format('{0}@{1}', matrix.image, steps.existing.outputs.digest) ||
            format('{0}:{1}', matrix.image, inputs.commit_sha) }}
          version: v0.72.0
          format: cyclonedx
          output: sbom-${{ matrix.name }}.cdx.json
          scanners: vuln
          list-all-pkgs: "true"
          exit-code: "0"
          cache: "false"
          skip-setup-trivy: ${{ steps.existing.outputs.found != 'true' }}

      - name: Publish the scanned image
        id: publish
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          EXISTING_DIGEST: ${{ steps.existing.outputs.digest }}
          IMAGE_EXISTS: ${{ steps.existing.outputs.found }}
          IMAGE_NAME: ${{ matrix.image }}
        run: |
          set -euo pipefail
          if [[ "${IMAGE_EXISTS}" == "true" ]]; then
            printf 'digest=%s\n' "${EXISTING_DIGEST}" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          immutable_ref="${IMAGE_NAME}:${COMMIT_SHA}"
          docker push "${immutable_ref}"
          digest="$(
            docker buildx imagetools inspect \
              "${immutable_ref}" \
              --format '{{json .Manifest}}' |
              jq -er '.digest'
          )"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "published image returned an invalid manifest digest" >&2
            exit 1
          fi
          printf 'digest=%s\n' "${digest}" >>"${GITHUB_OUTPUT}"

      - name: Attest image provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Attest the image SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-name: ${{ matrix.image }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          sbom-path: sbom-${{ matrix.name }}.cdx.json
          push-to-registry: true

      - name: Upload the SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-${{ matrix.name }}-${{ inputs.commit_sha }}
          path: sbom-${{ matrix.name }}.cdx.json
          if-no-files-found: error
          retention-days: 30

      - name: Update the human-readable branch alias
        env:
          IMAGE_NAME: ${{ matrix.image }}
          SOURCE_BRANCH: ${{ inputs.branch }}
          PUBLISHED_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          if [[ "${SOURCE_BRANCH}" == "develop" ]]; then
            alias_ref="${IMAGE_NAME}:develop-latest"
          else
            alias_ref="${IMAGE_NAME}:latest"
          fi
          docker buildx imagetools create \
            --prefer-index=false \
            --tag "${alias_ref}" \
            "${IMAGE_NAME}@${PUBLISHED_DIGEST}"
