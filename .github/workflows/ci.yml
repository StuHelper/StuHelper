name: CI

on:
  pull_request:
  push:
    branches:
      - develop
      - main
  schedule:
    # Full default-branch regression every Monday at 02:23 Asia/Shanghai.
    - cron: "23 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read # Required by paths-filter for fork PR metadata

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      clients: ${{ steps.filter.outputs.clients }}
      contract: ${{ steps.filter.outputs.contract }}
      docs: ${{ steps.filter.outputs.docs }}
      guards: ${{ steps.filter.outputs.guards }}
      infra: ${{ steps.filter.outputs.infra }}
      koishi: ${{ steps.filter.outputs.koishi }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: |
            backend:
              - 'server/**'
              - '.env.example'
              - '.env.prod.example'
            clients:
              - 'clients/**'
              - 'server/api/**'
              - 'server/internal/pkg/capability/**'
              - 'scripts/check-vue-ui-contracts.mjs'
              - '.node-version'
              - '.nvmrc'
            contract:
              - 'server/api/**'
              - 'server/internal/api/gen/**'
              - 'server/internal/pkg/capability/**'
              - 'server/Makefile'
              - 'clients/shared/**'
              - 'clients/scripts/**'
              - 'clients/package.json'
              - 'clients/pnpm-lock.yaml'
              - 'clients/pnpm-workspace.yaml'
              - '.node-version'
              - '.nvmrc'
            docs:
              - 'AGENTS.md'
              - 'README.md'
              - 'docs/**'
              - 'scripts/check-docs-hygiene*'
              - 'scripts/lib/**'
            guards:
              - 'scripts/**'
              - 'tools/**'
              - '.node-version'
              - '.nvmrc'
            infra:
              - '.env.example'
              - '.env.prod.example'
              - '.github/**'
              - 'Makefile'
              - 'docker-compose*.yml'
              - 'infra/**'
              - '.node-version'
              - '.nvmrc'
            koishi:
              - 'bots/koishi/**'
              - 'server/api/**'
              - 'scripts/check-vue-ui-contracts.mjs'
              - '.node-version'
              - '.nvmrc'
            workflows:
              - '.github/**'
              - '.gitleaksignore'

  static-contracts:
    name: Static file contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert supply-chain pinning and CI wiring
        run: |
          bash infra/ops/tests/dockerfile-supply-chain-contract.sh
          bash infra/ops/tests/ci-and-drift-contract.sh

  repository-policy:
    name: Repository policy
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.docs == 'true' ||
      needs.changes.outputs.clients == 'true' ||
      needs.changes.outputs.guards == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache: false

      - name: Check documentation hygiene
        run: make check-docs

      - name: Check UniAppX shadow files
        run: bash scripts/check-uniappx-shadow-files.sh

      - name: Check UniAppX supported targets
        run: node scripts/check-uniappx-platform-contract.mjs

      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

  secret-scan:
    name: Secret history scan
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the complete repository history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan all reachable commits
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:e1b35e12a8c6fa8901f060459cfb6b2fc4c484d3afbe3b029733a3bbfab07055
          git /repo
          --gitleaks-ignore-path /repo/.gitleaksignore
          --platform github
          --redact=100
          --no-banner

  dependency-review:
    name: Dependency review
    needs: changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject newly introduced vulnerable dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  backend:
    name: Backend
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: cgr.dev/chainguard/postgres:latest@sha256:dc2f04037c1044a22af76cee4de70b9111885b17c561b939d7ed70103d100759
        env:
          POSTGRES_DB: test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:8.8.1-alpine@sha256:8096655e437712b07503796fb64d81359256cfcff0ab29d95a7da72863786efb
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://stuhelper_app:test@127.0.0.1:5432/test?sslmode=disable
      STUHELPER_TEST_POSTGRES_URL: postgres://test:test@127.0.0.1:5432/postgres?sslmode=disable
      PGPASSWORD: test
      REDIS_HOST: 127.0.0.1
      REDIS_PASSWORD: ""
      REDIS_PORT: "6379"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Install pinned security and lint tools
        working-directory: server
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.1.6
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.4
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4

      - name: Lint
        working-directory: server
        run: make lint

      - name: Run static security checks
        working-directory: server
        run: |
          make security
          govulncheck ./...

      - name: Bootstrap the application database role
        run: |
          psql "${STUHELPER_TEST_POSTGRES_URL}" -v ON_ERROR_STOP=1 <<'SQL'
          DO $bootstrap$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'stuhelper_app') THEN
              CREATE ROLE stuhelper_app;
            END IF;
          END
          $bootstrap$;
          ALTER ROLE stuhelper_app
            WITH LOGIN PASSWORD 'test' NOSUPERUSER NOCREATEDB NOCREATEROLE CONNECTION LIMIT 30;
          ALTER DATABASE test OWNER TO stuhelper_app;
          \connect test
          ALTER SCHEMA public OWNER TO stuhelper_app;
          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          GRANT USAGE, CREATE ON SCHEMA public TO stuhelper_app;
          SQL

      - name: Apply pending database migrations
        working-directory: server
        run: make migrate-up

      - name: Test with race detection and coverage
        working-directory: server
        run: |
          make test-coverage
          make check-coverage-threshold

      - name: Verify reversible migrations
        working-directory: server
        run: make migrate-verify

      - name: Build
        working-directory: server
        run: make build

      - name: Upload backend evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-${{ github.sha }}
          path: |
            server/coverage.out
            server/bin/stuhelper
          if-no-files-found: warn
          retention-days: 7

  contract:
    name: OpenAPI and generated-code contract
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: clients/pnpm-lock.yaml

      - name: Install client dependencies
        working-directory: clients
        run: pnpm install --frozen-lockfile

      - name: Validate API specifications and generated Go code
        working-directory: server
        run: |
          make lint-spec
          make check-bundled-drift
          make check-drift-go
          make check-doc-sync

      - name: Validate generated TypeScript and capability contracts
        working-directory: clients
        run: |
          pnpm run check:api-drift
          pnpm run check:capabilities-drift

  clients:
    name: Web, Admin, and UniAppX
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "true"
      VITE_ADMIN_URL: /admin/
      VITE_API_URL: /api
      VITE_SSO_URL: https://sso.example.invalid
      VITE_WEB_URL: https://web.example.invalid
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            clients/pnpm-lock.yaml
            clients/admin/pnpm-lock.yaml

      - name: Install client dependencies
        working-directory: clients
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir admin install --frozen-lockfile

      - name: Lint
        working-directory: clients
        run: pnpm run lint:all

      - name: Type-check
        working-directory: clients
        run: pnpm run type-check:all

      - name: Run unit tests
        working-directory: clients
        run: pnpm run test:all

      - name: Audit all client dependencies
        working-directory: clients
        run: |
          pnpm audit --registry=https://registry.npmjs.org --audit-level=moderate
          pnpm --dir admin audit --registry=https://registry.npmjs.org --audit-level=moderate

      - name: Build all browser clients
        working-directory: clients
        run: |
          pnpm run build:web
          pnpm run build:admin
          pnpm run build:uni:h5

  client-e2e:
    name: ${{ matrix.name }} E2E
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.clients == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Web
            script: test:e2e:web
            install_admin: false
            artifact_path: |
              clients/web/playwright-report
              clients/web/test-results
          - name: Admin
            script: test:e2e:admin
            install_admin: true
            artifact_path: |
              clients/admin/apps/web-ele/playwright-report
              clients/admin/apps/web-ele/test-results
          - name: UniAppX
            script: test:e2e:uni
            install_admin: false
            artifact_path: |
              clients/uniappx/playwright-report
              clients/uniappx/test-results
    env:
      CI: "true"
      INSTALL_ADMIN: ${{ matrix.install_admin }}
      PLAYWRIGHT_SCRIPT: ${{ matrix.script }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install client dependencies
        working-directory: clients
        run: |
          pnpm install --frozen-lockfile
          if [ "${INSTALL_ADMIN}" = "true" ]; then
            pnpm --dir admin install --frozen-lockfile
          fi

      - name: Run Playwright
        working-directory: clients
        run: pnpm run "${PLAYWRIGHT_SCRIPT}"

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: ignore
          retention-days: 7

  koishi:
    name: Koishi
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.koishi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
    env:
      CI: "true"
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install dependencies
        working-directory: bots/koishi
        run: |
          corepack enable
          corepack yarn install --immutable

      - name: Audit all Koishi dependencies
        working-directory: bots/koishi
        env:
          YARN_NPM_REGISTRY_SERVER: https://registry.npmjs.org
        run: corepack yarn npm audit --all --severity moderate

      - name: Test
        working-directory: bots/koishi
        run: corepack yarn test

      - name: Validate deployable StuHelper package bundle
        run: bash infra/ops/tests/koishi-stuhelper-package-contract.sh

      - name: Upload Koishi evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: koishi-${{ github.sha }}
          path: |
            bots/koishi/playwright-report
            bots/koishi/test-results
          if-no-files-found: ignore
          retention-days: 7

  infra:
    name: Infrastructure contracts
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Set up pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.32.1
          run_install: false

      - name: Install contract dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes curl jq openssl python3-venv

      - name: Install pinned Ansible controller
        run: |
          python3 -m venv "${RUNNER_TEMP}/stuhelper-ansible"
          "${RUNNER_TEMP}/stuhelper-ansible/bin/pip" install \
            --disable-pip-version-check \
            --requirement infra/ansible/requirements.txt
          echo "${RUNNER_TEMP}/stuhelper-ansible/bin" >> "${GITHUB_PATH}"

      - name: Validate Ansible playbooks and bundle path
        working-directory: infra/ansible
        run: |
          ansible-playbook -i inventory/staging.example.ini --syntax-check playbooks/bootstrap.yml
          ansible-playbook -i inventory/staging.example.ini --syntax-check playbooks/deploy.yml
          ansible-playbook -i inventory/staging.example.ini --syntax-check playbooks/rollback.yml
          ansible-playbook -i inventory/staging.example.ini playbooks/deploy.yml --tags deploy-bundle

      - name: Install browser client dependencies used by smoke contracts
        working-directory: clients
        run: pnpm install --frozen-lockfile

      - name: Install Chromium used by browser smoke contracts
        working-directory: clients
        run: pnpm --filter @stuhelper/web exec playwright install --with-deps chromium

      - name: Prepare Koishi package artifacts used by infra contracts
        working-directory: bots/koishi
        run: |
          corepack enable
          corepack yarn install --immutable
          corepack yarn build

      - name: Test production environment initialization
        run: bash infra/ops/tests/init-prod-env-contract.sh

      - name: Run infrastructure contracts
        run: bash infra/ops/tests/run-infra-contracts.sh

  runtime-image-security:
    name: Runtime image security
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.infra == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore the Trivy vulnerability database cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/trivy
          key: runtime-image-trivy-${{ runner.os }}-${{ hashFiles('infra/security/runtime-images.json') }}
          restore-keys: |
            runtime-image-trivy-${{ runner.os }}-

      - name: Scan and validate every managed runtime image
        env:
          RUNTIME_IMAGE_SCAN_OUTPUT_DIR: ${{ github.workspace }}/runtime-image-scan-evidence
          TRIVY_CACHE_DIR: ${{ github.workspace }}/.cache/trivy
        run: |
          mkdir -p "${RUNTIME_IMAGE_SCAN_OUTPUT_DIR}" "${TRIVY_CACHE_DIR}"
          bash infra/ops/scan-runtime-images.sh

      - name: Upload runtime-image scan evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-image-security-${{ github.sha }}
          path: runtime-image-scan-evidence/*.json
          if-no-files-found: warn
          retention-days: 14

  sast:
    name: Semgrep
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.clients == 'true' ||
      needs.changes.outputs.backend == 'true' ||
      needs.changes.outputs.guards == 'true' ||
      needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan application code
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/src:ro"
          -w /src
          semgrep/semgrep@sha256:183a149fb3e9700ab5294a7b4ab0241a826fd046bc8b721062fbea80fdfa438f
          semgrep scan
          --config=p/javascript
          --config=p/typescript
          --config=p/owasp-top-ten
          --config=p/security-audit
          --config=p/jwt
          --severity ERROR
          --error
          clients/web/src
          clients/admin/apps/web-ele/src

      - name: Run project-specific Semgrep rules
        run: >-
          docker run --rm
          -v "${GITHUB_WORKSPACE}:/src:ro"
          -w /src
          --entrypoint bash
          semgrep/semgrep@sha256:183a149fb3e9700ab5294a7b4ab0241a826fd046bc8b721062fbea80fdfa438f
          scripts/check-semgrep-custom-rules.sh

  required:
    name: Required
    if: always()
    needs:
      - changes
      - static-contracts
      - repository-policy
      - secret-scan
      - dependency-review
      - backend
      - contract
      - clients
      - client-e2e
      - koishi
      - infra
      - runtime-image-security
      - sast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every selected check to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          printf 'Job results: %s\n' "${RESULTS}"
          if [[ "${RESULTS}" == *failure* || "${RESULTS}" == *cancelled* ]]; then
            exit 1
          fi

  publish-images:
    name: Publish images
    needs: required
    if: >-
      always() &&
      !cancelled() &&
      needs.required.result == 'success' &&
      github.event_name == 'push' &&
      (github.ref_name == 'develop' || github.ref_name == 'main')
    permissions:
      contents: read
      packages: write # Publish scanned images after every CI gate succeeds
      attestations: write # Attach provenance to each immutable image digest
      id-token: write # Mint the OIDC identity used by the provenance signer
      artifact-metadata: write # Allow actions/attest v4 to register GHCR storage records
    uses: ./.github/workflows/publish-images.yml
    with:
      commit_sha: ${{ github.sha }}
      branch: ${{ github.ref_name }}

  promote-staging:
    name: Promote to staging
    needs:
      - required
      - publish-images
    if: >-
      always() &&
      !cancelled() &&
      needs.required.result == 'success' &&
      needs.publish-images.result == 'success' &&
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      vars.STAGING_AUTO_DEPLOY_ENABLED == 'true'
    permissions:
      attestations: read
      checks: read
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      target: staging
      reason: Automated staging promotion after trusted main CI and image publication

  promote-production:
    name: Promote to production
    needs:
      - promote-staging
    if: >-
      always() &&
      !cancelled() &&
      needs.promote-staging.result == 'success' &&
      github.event_name == 'push' &&
      github.ref_name == 'main' &&
      vars.STAGING_AUTO_DEPLOY_ENABLED == 'true' &&
      vars.PRODUCTION_AUTO_PROMOTION_ENABLED == 'true'
    permissions:
      attestations: read
      checks: read
      contents: read
      packages: read
    uses: ./.github/workflows/deploy.yml
    with:
      target: production
      reason: Automated production promotion after successful same-SHA staging deployment
