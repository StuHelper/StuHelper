name: Runtime image review deadlines

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-image-review-deadlines
  cancel-in-progress: true

jobs:
  review-deadlines:
    name: Require at least three review days remaining
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate runtime-image review deadlines
        run: >-
          python3 infra/ops/validate-runtime-image-scan.py
          --repo-root .
          --policy-only
          --minimum-review-days-remaining 3
