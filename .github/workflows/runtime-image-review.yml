name: Runtime image review deadlines

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-image-review-deadlines
  cancel-in-progress: true

jobs:
  review-deadlines:
    name: Require at least three review days remaining
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate runtime-image review deadlines
        run: >-
          python3 infra/ops/validate-runtime-image-scan.py
          --repo-root .
          --policy-only
          --minimum-review-days-remaining 3
