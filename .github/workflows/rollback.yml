name: Rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected GitHub environment to roll back
        required: true
        type: choice
        options:
          - staging
          - production
      commit_sha:
        description: Full 40-character commit SHA of the previously published release
        required: true
        type: string
      reason:
        description: Incident or change record explaining why this rollback is required
        required: true
        type: string

permissions:
  contents: read
  packages: read # Pull rollback manifests from GHCR
  attestations: read # Verify provenance before remote mutation

concurrency:
  group: deployment-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.target }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      DEPLOY_TARGET_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_TARGET_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_TARGET_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_TARGET_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
      DEPLOY_TARGET_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_TARGET_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      DEPLOY_ENVIRONMENT: ${{ inputs.target }}
      TARGET_SHA: ${{ inputs.commit_sha }}
    steps:
      - name: Validate the immutable release identifier
        run: |
          if [[ ! "${TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "commit_sha must be a full lowercase 40-character Git commit SHA" >&2
            exit 1
          fi

      - name: Check out the trusted rollback controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: rollback-controller

      - name: Check out the rollback release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: rollback-release

      - name: Validate deployment inputs
        working-directory: rollback-controller
        run: ./infra/ops/validate-ci-deploy-inputs.sh

      - name: Build the rollback bundle
        working-directory: rollback-controller
        run: >-
          ./infra/ops/build-deploy-bundle.sh
          "${RUNNER_TEMP}/deploy-bundle.tgz"
          "${GITHUB_WORKSPACE}/rollback-release"

      - name: Build the trusted rollback-controller overlay
        run: |
          tar -czf "${RUNNER_TEMP}/rollback-controller.tgz" \
            -C rollback-controller \
            infra/ops/prod-rollback.sh \
            infra/ops/validate-runtime-image-scan.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@371161bbe7024a29a25c5e19bfcbc0804fe9ad2c # v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and verify rollback images
        id: release-images
        working-directory: rollback-controller
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_NAMESPACE: ghcr.io/stuhelper
        run: ./infra/ops/resolve-attested-release-images.sh

      - name: Prepare rollback audit context
        id: rollback-audit
        env:
          ROLLBACK_ACTOR: ${{ github.actor }}
          ROLLBACK_REASON: ${{ inputs.reason }}
        run: |
          python3 - <<'PY'
          import base64
          import os
          import re
          from pathlib import Path

          actor = os.environ["ROLLBACK_ACTOR"].strip()
          reason = os.environ["ROLLBACK_REASON"].strip()
          if re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9_.@-]{0,127}", actor) is None:
              raise SystemExit("rollback actor is invalid")
          if not 12 <= len(reason) <= 500 or any(ord(char) < 32 for char in reason):
              raise SystemExit("rollback reason must be 12-500 printable characters")
          encoded = base64.b64encode(reason.encode()).decode()
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as handle:
              handle.write(f"reason_b64={encoded}\n")
          PY

      - name: Upload, roll back, and verify
        env:
          ROLLBACK_BACKEND_IMAGE_REF: ${{ steps.release-images.outputs.backend_image_ref }}
          ROLLBACK_FRONTEND_IMAGE_REF: ${{ steps.release-images.outputs.frontend_image_ref }}
          ROLLBACK_ADMIN_IMAGE_REF: ${{ steps.release-images.outputs.admin_image_ref }}
          ROLLBACK_REVIEW_ACTOR: ${{ github.actor }}
          ROLLBACK_REVIEW_REASON_B64: ${{ steps.rollback-audit.outputs.reason_b64 }}
        run: |
          set -euo pipefail
          [[ "${ROLLBACK_REVIEW_ACTOR}" =~ ^[A-Za-z0-9][A-Za-z0-9_.@-]{0,127}$ ]]
          [[ "${ROLLBACK_REVIEW_REASON_B64}" =~ ^[A-Za-z0-9+/=]+$ ]]
          port="${DEPLOY_TARGET_PORT:-22}"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k >/dev/null 2>&1 || true' EXIT
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_TARGET_SSH_KEY}" | tr -d '\r' | ssh-add -
          printf '%s\n' "${DEPLOY_TARGET_SSH_KNOWN_HOSTS}" |
            tr -d '\r' >"${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"
          known_host_lookup="${DEPLOY_TARGET_HOST}"
          if [[ "${port}" != "22" ]]; then
            known_host_lookup="[${DEPLOY_TARGET_HOST}]:${port}"
          fi
          if ! ssh-keygen -F "${known_host_lookup}" -f "${HOME}/.ssh/known_hosts" >/dev/null; then
            echo "DEPLOY_SSH_KNOWN_HOSTS does not pin the selected endpoint" >&2
            exit 1
          fi

          ssh_args=(
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -p "${port}"
          )

          # Values below are intentionally expanded on the trusted runner before SSH.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" \
            "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}" \
            "mkdir -p '${DEPLOY_TARGET_APP_DIR}'"

          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -P "${port}" \
            "${RUNNER_TEMP}/deploy-bundle.tgz" \
            "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}:${DEPLOY_TARGET_APP_DIR}/deploy-bundle.tgz"

          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -P "${port}" \
            "${RUNNER_TEMP}/rollback-controller.tgz" \
            "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}:${DEPLOY_TARGET_APP_DIR}/rollback-controller.tgz"

          # The validated release identifier and digest references are passed to the remote shell.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" \
            "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}" \
            "set -euo pipefail &&
             cd '${DEPLOY_TARGET_APP_DIR}' &&
             tar xzf deploy-bundle.tgz &&
             tar xzf rollback-controller.tgz &&
             rm -f deploy-bundle.tgz rollback-controller.tgz &&
             TAG='${TARGET_SHA}' \
             ROLLBACK_TAG='${TARGET_SHA}' \
             ROLLBACK_BACKEND_IMAGE_REF='${ROLLBACK_BACKEND_IMAGE_REF}' \
             ROLLBACK_FRONTEND_IMAGE_REF='${ROLLBACK_FRONTEND_IMAGE_REF}' \
             ROLLBACK_ADMIN_IMAGE_REF='${ROLLBACK_ADMIN_IMAGE_REF}' \
             ROLLBACK_REVIEW_ACTOR='${ROLLBACK_REVIEW_ACTOR}' \
             ROLLBACK_REVIEW_REASON_B64='${ROLLBACK_REVIEW_REASON_B64}' \
             ./infra/ops/remote-prod-rollback.sh &&
             ./infra/ops/smoke-check.sh &&
             ./infra/ops/observability-smoke-check.sh"
