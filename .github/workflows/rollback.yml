name: Rollback

on:
  workflow_dispatch:
    inputs:
      target:
        description: Protected GitHub environment to roll back
        required: true
        type: choice
        options:
          - staging
          - production
      release_tag:
        description: Previously published immutable image tag
        required: true
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: deployment-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: ${{ inputs.target }}
      url: ${{ vars.PUBLIC_URL }}
    env:
      DEPLOY_TARGET_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_TARGET_PORT: ${{ secrets.DEPLOY_PORT }}
      DEPLOY_TARGET_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_TARGET_APP_DIR: ${{ secrets.DEPLOY_APP_DIR }}
      DEPLOY_TARGET_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_TARGET_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
      TARGET_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Validate the rollback tag
        run: |
          if [[ ! "${TARGET_TAG}" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "release_tag is not a valid container image tag" >&2
            exit 1
          fi

      - name: Check out deployment tooling
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build the rollback bundle
        run: ./infra/ops/build-deploy-bundle.sh "${RUNNER_TEMP}/deploy-bundle.tgz"

      - name: Upload, roll back, and verify
        run: |
          set -euo pipefail
          : "${DEPLOY_TARGET_HOST:?DEPLOY_HOST environment secret is required}"
          : "${DEPLOY_TARGET_USER:?DEPLOY_USER environment secret is required}"
          : "${DEPLOY_TARGET_APP_DIR:?DEPLOY_APP_DIR environment secret is required}"
          : "${DEPLOY_TARGET_SSH_KEY:?DEPLOY_SSH_KEY environment secret is required}"
          : "${DEPLOY_TARGET_SSH_KNOWN_HOSTS:?DEPLOY_SSH_KNOWN_HOSTS environment secret is required}"

          port="${DEPLOY_TARGET_PORT:-22}"
          eval "$(ssh-agent -s)"
          install -d -m 700 "${HOME}/.ssh"
          printf '%s\n' "${DEPLOY_TARGET_SSH_KEY}" | tr -d '\r' | ssh-add -
          printf '%s\n' "${DEPLOY_TARGET_SSH_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/known_hosts"

          ssh_args=(
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -p "${port}"
          )

          # Values below are intentionally expanded on the trusted runner before SSH.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" \
            "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}" \
            "mkdir -p '${DEPLOY_TARGET_APP_DIR}'"

          scp \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -P "${port}" \
            "${RUNNER_TEMP}/deploy-bundle.tgz" \
            "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}:${DEPLOY_TARGET_APP_DIR}/deploy-bundle.tgz"

          # The validated release tag is intentionally passed to the remote shell.
          # shellcheck disable=SC2029
          ssh "${ssh_args[@]}" \
            "${DEPLOY_TARGET_USER}@${DEPLOY_TARGET_HOST}" \
            "set -euo pipefail &&
             cd '${DEPLOY_TARGET_APP_DIR}' &&
             tar xzf deploy-bundle.tgz &&
             rm -f deploy-bundle.tgz &&
             TAG='${TARGET_TAG}' ROLLBACK_TAG='${TARGET_TAG}' \
             ./infra/ops/remote-prod-rollback.sh &&
             ./infra/ops/smoke-check.sh &&
             ./infra/ops/observability-smoke-check.sh"
