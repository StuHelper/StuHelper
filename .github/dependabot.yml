version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /server
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Keep each JavaScript workspace independently reviewable. Dependabot's
  # default version-update scope is direct manifest dependencies; vulnerable
  # lockfile dependencies remain covered by security updates. Ignore only
  # routine major version updates so security remediations can cross majors.
  - package-ecosystem: npm
    directory: /bots/koishi
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      koishi-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: npm
    directory: /clients
    target-branch: develop
    # UniAppX follows an exact DCloud build train whose packages, Vue compiler,
    # runtime, Pinia, and @dcloudio/types must be upgraded together. Exclude its
    # manifest from routine version PRs; CI still audits the shared lockfile.
    exclude-paths:
      - "uniappx/package.json"
    schedule:
      interval: weekly
      day: monday
      time: "09:35"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      clients-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # UniAppX packages form one exact DCloud/Vue/Pinia build train. Its
      # dependencies remain visible through the shared pnpm lockfile even when
      # the manifest is excluded, so ignore routine DCloud version updates in
      # this workspace. These version-update filters do not suppress security
      # updates.
      - dependency-name: "@dcloudio/*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: npm
    directory: /clients/admin
    target-branch: develop
    # Admin uses a large pnpm catalog. Dependabot currently conflates current
    # catalog entries with older same-named transitive lockfile nodes, which
    # produces empty PRs and FileUpdater::NoChangeError failures. Disable
    # routine version PRs for this workspace and refresh it in deliberate,
    # reviewed batches. Dependabot security updates remain enabled; GitHub
    # documents open-pull-requests-limit: 0 as the security-updates-only mode.
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directories:
      - /server
      - /clients/web
      - /clients/admin/scripts/deploy
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      container-bases:
        group-by: dependency-name
