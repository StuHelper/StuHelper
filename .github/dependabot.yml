version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: gomod
    directory: /server
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      go-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Keep each JavaScript workspace independently reviewable. Version-update PRs
  # are limited to minor/patch releases; Dependabot security updates are not
  # restricted by this allow rule and may still cross a major version.
  - package-ecosystem: npm
    directory: /bots/koishi
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      koishi-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
  - package-ecosystem: npm
    directory: /clients
    # UniAppX follows an exact DCloud build train whose packages, Vue compiler,
    # runtime, Pinia, and @dcloudio/types must be upgraded together. Exclude its
    # manifest from routine version PRs; CI still audits the shared lockfile.
    exclude-paths:
      - "uniappx/package.json"
    schedule:
      interval: weekly
      day: monday
      time: "09:35"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      clients-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: npm
    directory: /clients/admin
    schedule:
      interval: weekly
      day: monday
      time: "09:40"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      admin-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    allow:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    ignore:
      # zod-defaults >= 0.2 requires Zod 4, while the current form stack and
      # @vee-validate/zod remain on Zod 3. Revisit in the coordinated Zod 4 migration.
      - dependency-name: "zod-defaults"
        versions:
          - ">=0.2.0"

  - package-ecosystem: docker
    directories:
      - /server
      - /clients/web
      - /clients/admin/scripts/deploy
    schedule:
      interval: weekly
      day: monday
      time: "09:45"
      timezone: Asia/Shanghai
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      container-bases:
        group-by: dependency-name
