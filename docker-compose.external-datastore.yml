# StuHelper Docker Compose overlay: externally managed PostgreSQL.
#
# Intended for production hosts where PostgreSQL is managed outside the
# StuHelper compose project, for example by a Baota compose stack on baota_net.
# Redis remains an application-local StuHelper service so cache/session/rate
# limit failure domains stay isolated from other applications.

services:
  postgres:
    profiles: !override [internal-datastore]
    networks: !override
    - external-datastore

  casdoor:
    profiles: !override [local-sso]
    depends_on: !reset []
    networks: !override
    - backend
    - external-datastore

  migrate:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    depends_on: !reset []
    networks: !override
    - backend
    - external-datastore

  openfga-migrate:
    environment:
      OPENFGA_DATASTORE_URI: ${OPENFGA_DATASTORE_URI:-postgresql://openfga:${OPENFGA_DB_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/openfga?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable}}
    depends_on: !reset []
    networks: !override
    - backend
    - external-datastore

  openfga:
    environment:
      OPENFGA_DATASTORE_URI: ${OPENFGA_DATASTORE_URI:-postgresql://openfga:${OPENFGA_DB_PASSWORD}@${POSTGRES_HOST:-postgres}:5432/openfga?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable}}
    networks: !override
    - backend
    - external-datastore

  postgres-exporter:
    environment:
      DATA_SOURCE_URI: ${POSTGRES_EXPORTER_DATA_SOURCE_URI:-${POSTGRES_HOST:-postgres}:5432/${POSTGRES_DB:-stuhelper}?sslmode=${POSTGRES_INTERNAL_SSL_MODE:-disable}}
    depends_on: !reset []
    networks: !override
    - backend
    - observability
    - external-datastore

  app:
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      DB_SSL_ROOT_CERT: ${DB_SSL_ROOT_CERT:-}
    depends_on: !override
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      alloy:
        condition: service_healthy
      openfga:
        condition: service_healthy
    networks: !override
    - backend
    - observability
    - external-datastore

networks:
  external-datastore:
    name: ${EXTERNAL_DATASTORE_NETWORK:?EXTERNAL_DATASTORE_NETWORK is required}
    external: true
